# Commit-message depersonalization gate.
#
# Closes the gap the content gates miss: repo-integrity / reference-durability scan
# FILE CONTENT on added lines, never the COMMIT MESSAGE. A local prepare-commit-msg
# co-author injector can rewrite the trailer into a personal email — an identity leak
# that is permanent once merged. This scans every commit message in the PR range
# (body, trailers, and author/committer identity) for the generic leak library and
# fails loud + redacted.
#
# DISCIPLINE: generic patterns ONLY. Never hardcode an operator literal — a detector
# that names the operator is itself a leak. Generic personal-email domains, generic
# macOS home paths, and any SUFFIXED variant of the public repo slug cover every
# operator-specific case without naming one. (This replaces the retired public-flip
# leak ratchet, preserving its one unique surface: commit-message scope.)
#
# SECOND PROPERTY, SAME JOB: close keywords. The repository host's auto-close parser
# reads every commit message that reaches the default branch, so a close-family keyword
# directly before an issue reference closes that issue at merge, whatever the sentence
# around it meant. The last step of this job asserts that no commit in the PR range
# carries one. It lives in THIS job, under this job's name, on purpose: this job is the
# registered required check, and a new job would be a status context that blocks
# nothing until it is registered. The predicate is not written in this file. The step
# is a thin caller of core/deploy/tools/check-commit-close-keywords.py, which is
# fixture-backed and is the same file an author runs before pushing. A failure names
# itself: its own step, its own annotation title, its own summary heading.
#
# Security: the external inputs are the base/head commit SHAs, passed via env: and
# referenced as quoted shell vars (never interpolated into run:) per the Actions
# injection-hardening guidance, and the head branch name, which is read only inside an
# `if:` expression and never reaches a shell.
name: Commit-message depersonalization

# gate-efficacy: posture=required  enforcement=branch-protection:"Commit-message depersonalization gate"  always-reports=yes
#   invariant: (1) no commit message in the PR range carries personal data (a generic
#              personal-email domain, a macOS home path, or a suffixed private-repo
#              slug) in its body, trailers, or author/committer identity — asserted
#              by scanning every commit message in the base..head range. (2) On a
#              pull request whose head is a release branch, no commit message in that
#              range — subject or body — puts a close-family keyword directly before
#              an issue reference: the commit-message arm of the close-keyword
#              parser-clean discipline, asserted over the same range by
#              core/deploy/tools/check-commit-close-keywords.py.
#   falsification: (1) add a commit whose trailer co-author is an @gmail.com address ->
#                  this gate turns red (redacted) on that commit. (2) On a release
#                  head, add a commit whose body puts a close-family keyword directly
#                  before an issue reference -> the close-keyword step turns this gate
#                  red, naming that commit and line. The same predicate runs with no
#                  live branch at all:
#                  python3 core/deploy/tools/check-commit-close-keywords.py --self-test
# (Posture realized per core/standards/gate-efficacy-standard.md Requirement (b).)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  commit-message-scan:
    name: Commit-message depersonalization gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Scan PR commit messages for personal data + private-upstream (lineage = notice)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # NO \b (grep -E treats it literally).
          # IDENTITY = personal-email domains or macOS home paths — a bare presence match.
          # SLUG = the private-upstream repo slug 'pmo-platform-<suffix>' (bare 'pmo-platform'
          #   is the public repo itself; a suffix marks a private upstream). This is NOT a bare
          #   presence match, because the legitimate in-repo filename 'pmo-platform-context.md'
          #   (release/skills/pmo-skill-refiner/references/) shares that prefix. A suffix that is
          #   a filename (ends in a known in-repo file extension, trailing dots tolerated) is
          #   carved out; only a NON-file suffix (bare slug, or e.g. '.git') is treated as a leak.
          # SOFT = internal version lineage (public line is v1.0x/v2.x; internal families are
          #   v3 + v8-v18) — a NOTICE only: process-intel, redacted in the history rewrite, not
          #   a credential.
          IDENTITY='[A-Za-z0-9._%+-]+@(gmail|ymail|yahoo|hotmail|outlook|proton(mail)?|icloud)\.[A-Za-z]|/Users/[a-z][a-z0-9._-]+'
          FILEXT='(md|py|sh|txt|json|yml|yaml|toml|js|ts|png|svg|csv|cfg|ini|lock)'
          SOFT='v(3|8|9|1[0-7]|18)\.[0-9]'
          FOUND=0; REPORT=""
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            MSG="$(git log -1 --format='%an%n%ae%n%cn%n%ce%n%B%n%(trailers:only,unfold)' "$sha")"
            HIT=0
            # (1) Personal email / home path — unchanged bare-presence detection.
            if printf '%s' "$MSG" | grep -qE "$IDENTITY"; then
              HIT=1
            fi
            # (2) Private-upstream slug — flag pmo-platform-<token> UNLESS the token is a filename.
            # A bracket-safe char class means surrounding punctuation ( ) , : etc. terminates the
            # token naturally; the file-extension carve-out exempts legitimate in-repo filenames.
            if [ "$HIT" -eq 0 ]; then
              while IFS= read -r slug; do
                [ -z "$slug" ] && continue
                if printf '%s' "$slug" | grep -qiE "\.${FILEXT}\.*$"; then
                  continue   # filename — legitimate, exempt
                fi
                HIT=1; break # non-file suffix — private-upstream leak
              done < <(printf '%s' "$MSG" | grep -oE 'pmo-platform-[A-Za-z0-9._-]+')
            fi
            if [ "$HIT" -eq 1 ]; then
              FOUND=1
              REPORT="${REPORT}${sha}: <redacted — personal email / home path / private-upstream in message or identity>"$'\n'
            fi
            if printf '%s' "$MSG" | grep -qE "$SOFT"; then
              echo "::notice::commit ${sha} message carries internal version lineage (v3 / v8-v18) — mild, redact during the history rewrite"
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo ":white_check_mark: Commit-message depersonalization — no personal data / private-upstream in PR commit messages" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## :x: Commit-message depersonalization gate FAILED"
            echo ""
            echo "A PR commit message (body, trailer, or author/committer identity) carries a personal"
            echo "email, an operator home path, or a private-upstream slug. The most common cause is a"
            echo "local prepare-commit-msg co-author injector rewriting the trailer into a personal"
            echo "address. Re-commit with that injector neutralized (clear the relevant git config),"
            echo "then amend and re-push (--force-with-lease). History trailers are purged separately by"
            echo "the rewrite runbook."
            echo ""
            echo "### Commits (redacted):"
            echo '```'
            printf '%s' "$REPORT"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Close-keyword scan of PR commit messages (parser-clean, commit-message arm)
        # Scope: pull requests whose head is a release branch. Scope lives in this one
        # condition and nowhere else — the tool takes a range and knows nothing of
        # branches. !cancelled() lets this step report even when the step above failed,
        # so one push shows both properties and neither masks the other.
        if: ${{ !cancelled() && startsWith(github.head_ref, 'release/') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # THIN CALLER. No pattern, keyword list or message handling lives in this file.
          # The self-test runs first, so a broken tool reports as a broken tool and never
          # as a clean range. Exit 0 = clean, 1 = finding, 3 = the range could not be
          # read; any non-zero exit fails this job.
          python3 core/deploy/tools/check-commit-close-keywords.py --self-test
          python3 core/deploy/tools/check-commit-close-keywords.py --base "$BASE_SHA" --head "$HEAD_SHA"
