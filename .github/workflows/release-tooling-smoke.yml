name: Release tooling smoke

# gate-efficacy: posture=advisory  enforcement=path-filtered  skip-semantics=absent-is-pass
#   invariant: the release tooling that must not rot unexercised runs its offline
#              checks when release tooling or the RELEASE_LOG schema changes — (1) the
#              Stage 13 close-out automation (self-test + corpus-path smoke), the
#              version allocator claim-version.sh --self-test, the release-body drift
#              check check-release-body-drift.sh --self-test, the Stage-13 close-out
#              learnings-register producer produce-learnings-register.sh --self-test
#              (whose assertions pin the read-model contract it feeds: every canonical
#              marker survives verbatim, and the L<n>/A<n> reflection rows stay
#              placeholder-bearing), the corpus-home tolerance conformance suite
#              (test_corpus_home_tolerance.sh — CH-1..CH-4 of
#              corpus-home-adapter-constraints.md; it ARMS STRUCTURALLY, by
#              grepping the comment-stripped text of automated-closeout.sh for
#              instance-corpus resolution vocabulary — pmo_instance_path,
#              PMO_INSTANCE_PATH, lib-instance-path, corpus_home, an inlined
#              .../personal/pmo-instance idiom — or, failing that, on fixture A
#              exiting 0; while neither holds it reports PENDING-SEAM and exits 0.
#              Once armed it asserts BY CONTENT rather than by exit code alone:
#              CH-1, an absent instance-corpus root exits 0 (any non-zero,
#              including a crash, fails); CH-2, a present one exits 0 AND fixture
#              A's capture carries a per-path resolution record for every corpus
#              label and no N/A token; CH-4, fixture B's capture carries a per-path
#              N/A record for every corpus label — a bare N/A somewhere in the
#              capture does not satisfy it. CH-3 (R1/R2) gates unconditionally,
#              armed or not. The per-path record vocabulary is derived at run time
#              from the in-tree baseline's own output rather than hardcoded, and the
#              arming detector's own non-vacuity is asserted in-suite against
#              planted / clean / comment-only controls. COVERAGE BOUNDARY, stated
#              because it is real: arming is a token match, so a resolver that names
#              none of that vocabulary AND leaves fixture A non-zero is not
#              detected — the residue is bounded by the needle, not by how many
#              channels the fixture seeds), AND the
#              blast-radius tool
#              family (doc-tracer default-path regression under a normalized diff + the
#              domain-fan-out software import-graph scanner), AND the
#              bundle-issues-parser regression suite
#              (test_bundle_issues_parser.py — 13 legs + 5 rank/sort assertions over
#              the committed frozen sample, paired with a precision probe that
#              narrows the priority detector's level class in a throwaway copy and
#              requires the T-13 liveness guard to fire; the suite previously had
#              ZERO executors, so ADR-111's "protected against regressing to
#              silence" claim rested on a guard nothing ran), AND the ADR `deciders:`
#              carve-out two-gate agreement suite (test_deciders_carveout.sh — asserts
#              that the depersonalization gate and the ADR durability lint return the
#              SAME verdict on their shared subject, the operator handle, over seven
#              committed synthetic fixtures; it drives the gate's OWN decision through
#              the sourced release/tools/lib/deciders-carveout.sh rather than a
#              re-implementation, and asserts structurally that repo-integrity.yml
#              still sources it), in the closeout-smoke job;
#              (2) EVERY tool that dispatches on --self-test across the two release
#              tool trees runs it — DISCOVERED, never rostered — in the
#              selftest-discovery job. The scope is declared once, in
#              core/deploy/allowlists/selftest-coverage-manifest.txt, as four
#              '# scope:' globs (release/tools/*.sh, release/tools/*.py,
#              core/deploy/tools/*.py, core/deploy/tools/*.sh); the discovered set is
#              derived from those globs by a predicate over the tools' own text, so a
#              tool that GROWS a self-test is covered with zero workflow edits and a
#              tool that LOSES one fails the gate. NO roster, count, predicate or glob
#              is re-encoded in this YAML — the engine is
#              release/tools/check-selftest-coverage.py and this workflow is a thin
#              caller, per the single-engine discipline deploy-check-ci.yml states.
#              The same manifest is a committed FLOOR: a path in it that still exists
#              on disk but is no longer discovered is a HARD failure, which is what
#              makes narrowing a '# scope:' glob unable to green a failing tool.
#              Runner affinity is declared AT THE TOOL ('# selftest-runner: macos'),
#              so the ubuntu/macOS split is derived too. The marker at the tool is the
#              authority; this paragraph is NOT a maintained census, so read the live
#              split from the engine — `check-selftest-coverage.py --list --runner
#              macos` (or `--runner ubuntu`) — rather than trusting a count written
#              here. Measured when this note was last reconciled: 57 discovered = 54
#              ubuntu + 3 macOS. All three macOS declarers live in release/tools/:
#              automated-closeout.sh (hard-exits at LOAD time, before argument
#              parsing, unless gh resolves at a Homebrew path), plus
#              check-release-body-drift.sh and reemit-release-bodies.sh (which share a
#              non-portable frontmatter-strip idiom that yields an EMPTY body under
#              GNU sed on the Linux runner). The drift check is worth naming rather
#              than leaving to a count: it is a live Stage-13 gate whose drift legs
#              (B, I) FAIL OPEN on Linux — reporting "no drift" when drift exists — so
#              an F1 triage that reads it as part of the ubuntu partition
#              misattributes both where it runs and how it fails.
#              SCOPE BOUNDARY, stated because it is real: release/tools/tests/** and
#              core/deploy/tools/tests/** are OUTSIDE this discovery scope. Those are
#              bare-invocation suites, not --self-test dispatchers — and the boundary
#              is a scope DECISION, not an emptiness claim: at least one suite there
#              does carry a real dispatch. Arm D surveils them for workflow wiring
#              instead and names every unwired suite on each in-scope PR; (3) the CIAC-3 relation holds — the
#              class set a downstream gate ASSERTS on is a subset of the MUST rows the
#              orchestration playbook INSTRUCTS (check-emission-contract-subset.sh over
#              the committed asserted set), with the lint's own --self-test run in the
#              same step so the lint cannot drift into always-passing; AND (4) each of
#              the four finops-usage-extractor scripts runs its committed --self-test —
#              the executable home of the store's conservation invariants and of the
#              CIAC / SM / SE fail-closed assertions — when that skill changes, in
#              the finops-selftest job — all asserted behaviorally by executing
#              the scripts' checks and gating on exit code.
#   falsification: on a PR touching the close-out tooling, break a corpus path the
#                  script asserts -> the closeout-smoke job fails; narrow
#                  bundle-issues-parser.py's PRIORITY_FIELD_RE level class to a range
#                  no fixture carries -> the parser suite's T-13 liveness guard fires
#                  (priority resolved 22/40 -> 0/40) and the closeout-smoke job fails;
#                  conversely, if that suite ever degraded to zero effective
#                  assertions the paired precision probe fails the job instead;
#                  regress a
#                  claim-version.sh or check-release-body-drift.sh self-test fixture ->
#                  the closeout-smoke job fails; make produce-learnings-register.sh seed
#                  a triple value into the register's L<n>/A<n> reflection rows (or drop
#                  a canonical marker from the rendered register) -> its T2 / T1
#                  assertions fail and the closeout-smoke job fails;
#                  make --check-paths instance-aware with a HARD-FAIL when the
#                  instance-corpus root is absent -> the corpus-home tolerance suite's
#                  structural detector arms and rule R3 fires on fixture B's non-zero
#                  exit, so the closeout-smoke job fails (falsifiable TODAY by running
#                  the suite with CLOSEOUT_SH_UNDER_TEST pointed at a copy patched
#                  that way); make it answer a PRESENT instance corpus with an
#                  unconditional exit 0 that resolves nothing -> R7 fires on fixture
#                  A's missing per-path records (CH-2); answer an ABSENT one by
#                  downgrading every path to OK alongside one unrelated N/A banner ->
#                  R4 fires on the missing per-path N/A records (CH-4); break the
#                  arming needle so it matches nothing, or drop its comment filter ->
#                  the suite's own P9 / P11 controls fail;
#                  or regress the in-tree baseline / stop detecting a broken corpus
#                  path -> its R1 / R2 rules fail today, with no seam required;
#                  break ANY discovered tool's --self-test (the probe does exactly
#                  this: it flips version-grammar.sh's F1 X.Y fixture expectation in a
#                  throwaway copy) -> the selftest-discovery job fails, and it fails
#                  via that tool's own named assertion, with a control arm on the
#                  unmutated copy proving the detection is attributable;
#                  narrow a '# scope:' glob in
#                  core/deploy/allowlists/selftest-coverage-manifest.txt to drop a
#                  failing tool out of discovery -> Arm B(i) fails and NAMES every
#                  dropped path, so greening the narrow requires deleting those lines
#                  in the same diff (the anti-narrowing probe asserts this today);
#                  give a tool a --self-test without regenerating the manifest ->
#                  Arm B(ii) fails; delete a tool's --self-test while it stays in the
#                  manifest -> Arm B(i) fails; add an exclusions entry with no written
#                  reason -> the engine's own --self-test fails on a parse error;
#                  break the schema-v1 emit so the doc
#                  tracer's normalized output changes -> the blast-radius tool-family
#                  test fails (that regression now runs against a COMMITTED golden
#                  fixture under release/tools/tests/fixtures/blast-radius-f1/ rather
#                  than a script reconstructed from git history at run time, so it is
#                  hermetic and reads no git; and the suite runs under
#                  BLAST_RADIUS_TESTS_STRICT so a skipped assertion is RED rather than a
#                  silent pass); revert the carve-out's un-carved re-test so the handle is
#                  suppressed again on a deciders: line -> the carve-out suite's FX-1 /
#                  FX-7 / AC-2' arms fail; "fix" the disagreement by deleting the
#                  carve-out so both gates go strict -> its FX-2 / AC-3' arms and its
#                  negative control fail; let repo-integrity.yml stop sourcing the
#                  shared library and grow a private copy again -> its structural
#                  binding assertion fails (all three falsifiable TODAY, and each was
#                  run as a mutation before the suite was committed); add a class to
#                  core/deploy/allowlists/decision-emission-asserted-set.txt that is not
#                  a MUST row of the playbook's EMISSION-CONTRACT block -> the CIAC-3
#                  step fails; drop the reserved "unknown" seed from extract-usage.sh's
#                  dim_agg so sum(by_X.*.tokens) no longer reconciles to session.tokens
#                  -> the finops-selftest job fails (its own precision probe asserts
#                  exactly that, in a temp copy); regress a node-graph tool's
#                  --self-test -> the selftest-discovery job fails (those six tools are
#                  now covered by discovery rather than by the retired roster); on an
#                  unrelated PR all three jobs are skipped and absence is treated as pass.
# Path-filtered, so ADVISORY by skip-semantics. (Per gate-efficacy-standard.md (b).)

# Smoke-tests the Stage 13 close-out automation on any PR that touches release
# tooling (or the RELEASE_LOG schema), so the script cannot rot unexercised — the
# exact failure mode where stale paths / a stale column index / de-identification
# escapes hid for several releases until the close-out was finally run.
#
# Two gates, BOTH offline (no git remote / gh / network call), so the job is
# deterministic and credential-free on a fresh runner:
#   1. --self-test  — the script's in-process unit checks (version / row-state /
#      milestone-slug / parser-clean parsing, JSON render, and a HARD assertion
#      that all four corpus paths resolve). Gates on exit code.
#   2. --check-paths — an offline corpus-path resolution probe that HARD-FAILS
#      (exit 1) if any of RELEASE_LOG / RELEASE_INDEX / RELEASE_DIGEST / notes-dir
#      does not resolve in THIS repo. Catches re-pathing drift before a release.
#
# A third step is a precision probe: it proves the path gate actually FAILS on a
# deliberately-broken corpus path (in a throwaway temp tree, never the checkout).
# A warn-only gate is blind to false negatives — this keeps the gate honest, the
# same discipline reference-durability.yml applies to its fragile-ref detector.
#
# The individual `<tool> --self-test` steps that used to sit in this job — the close-out
# script, the version allocator, the release-body drift check and the learnings-register
# producer — are GONE. Each was exactly what the discovery job now does for every tool,
# so keeping them would be duplicate execution AND a second enumeration: the same
# argument that retires the roster below applies to a hand-listed step.
#
# A second job — selftest-discovery — DISCOVERS every tool that dispatches on
# --self-test across the two release tool trees and runs it, replacing a hardcoded
# 6-tool roster that covered 6 of the 22 eligible core/deploy/tools python tools. A
# roster is a claim that drifts: a tool that grows a self-test is never added and a
# tool that loses one is never removed. The tool set now comes from four '# scope:'
# globs in a committed manifest and a predicate over the tools' own text, computed by
# release/tools/check-selftest-coverage.py. Those tools are pure-stdlib and
# OS-agnostic, so the job runs on ubuntu-latest, offline and credential-free, gating
# on exit code. A tool with a genuine OS requirement declares it AT THE TOOL with
# '# selftest-runner: macos' and is executed by the macOS job instead — a declaration,
# not a workflow exclusion, so a runner constraint can never masquerade as a coverage
# decision. NOTE: path filters are workflow-scoped, so a core/deploy/tools change also
# triggers the macOS closeout-smoke job below — a harmless, fast, offline over-trigger.
#
# Platform (closeout-smoke): macos-latest. automated-closeout.sh pins PATH to
# /usr/bin:/bin and resolves `gh` at the Homebrew (/opt/homebrew/bin) or Intel
# (/usr/local/bin) locations at load time — the macOS image is where those paths
# exist. This mirrors install-tests.yml, which runs the shell harness on macos-latest.
#
# Security: this workflow consumes NO untrusted github.event.* input (no issue
# titles, PR bodies, comment bodies, head refs). Every run: block is a static
# shell invocation against workspace files only.

on:
  pull_request:
    paths:
      - 'release/tools/**'
      - 'release/releases/RELEASE_LOG.md'
      - 'core/deploy/tools/**'
      # CIAC-3 inputs: the playbook owns the INSTRUCTED set, the allowlist file owns
      # the ASSERTED set. Without these two entries a PR that edits only the contract
      # block (or only the asserted set) would not trigger the subset check — the
      # residual path-filter gap, closed here rather than deferred.
      - 'release/skills/release-hub/references/orchestration-playbook.md'
      - 'core/deploy/allowlists/decision-emission-asserted-set.txt'
      # selftest-discovery inputs: the manifest owns the scope globs AND the expected
      # set; the exclusions file owns the suppressions. Without these two entries a PR
      # that narrowed a '# scope:' glob, or added a suppression, would not trigger the
      # gate that reads them — the same residual-path-filter reasoning as the CIAC-3
      # entries above, and the one that matters most here because narrowing the scope
      # is precisely the disposition this gate forbids.
      - 'core/deploy/allowlists/selftest-coverage-manifest.txt'
      - 'core/deploy/allowlists/selftest-coverage-exclusions.txt'
      # Procedure 7a gate-predicate inputs: the predicate itself is prose-embedded
      # in the bridge doc and the fixtures are built from the ledger template's
      # 13-field header. Without these two entries an edit to either could regress
      # the HARD GATE without ever triggering its regression suite.
      - 'release/references/how-to/hub-spoke-bridge.md'
      - 'release/releases/hub-state/action-items.md.template'
      # finops-selftest inputs: the four scripts and the store schema they encode.
      - 'core/skills/finops-usage-extractor/**'
      - 'core/schemas/finops-usage-store-schema.md'
      # deciders carve-out input: the suite asserts STRUCTURALLY that this workflow
      # still sources the shared decision library. Without this entry, a change that
      # dropped the sourcing (or the verdict call) would never re-run the assertion
      # that catches it — the library itself is already covered by 'release/tools/**'.
      - '.github/workflows/repo-integrity.yml'
      - '.github/workflows/release-tooling-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'release/tools/**'
      - 'release/releases/RELEASE_LOG.md'
      - 'core/deploy/tools/**'
      # CIAC-3 inputs: the playbook owns the INSTRUCTED set, the allowlist file owns
      # the ASSERTED set. Without these two entries a PR that edits only the contract
      # block (or only the asserted set) would not trigger the subset check — the
      # residual path-filter gap, closed here rather than deferred.
      - 'release/skills/release-hub/references/orchestration-playbook.md'
      - 'core/deploy/allowlists/decision-emission-asserted-set.txt'
      # selftest-discovery inputs — see the pull_request block above.
      - 'core/deploy/allowlists/selftest-coverage-manifest.txt'
      - 'core/deploy/allowlists/selftest-coverage-exclusions.txt'
      # Procedure 7a gate-predicate inputs — see the pull_request block above.
      - 'release/references/how-to/hub-spoke-bridge.md'
      - 'release/releases/hub-state/action-items.md.template'
      # finops-selftest inputs — see the pull_request block above.
      - 'core/skills/finops-usage-extractor/**'
      - 'core/schemas/finops-usage-store-schema.md'
      # deciders carve-out input — see the pull_request block above.
      - '.github/workflows/repo-integrity.yml'

permissions:
  contents: read

jobs:
  closeout-smoke:
    name: Close-out automation smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # RETAINED for this job's SIBLING self-tests, NOT for the blast-radius test.
          # After #3818 that test reads a committed golden fixture and makes ZERO git
          # history calls; it no longer justifies this line and is not why it stays.
          #
          # This job's macOS self-test partition reads origin/main and the tag set:
          #   automated-closeout.sh       — git diff / cat-file origin/main:…   (60 refs)
          #   check-release-body-drift.sh — git ls-tree origin/main -- …/notes  (39 refs)
          #   reemit-release-bodies.sh    — origin/main + tag reads             (10 refs)
          #
          # Reconciling this against the selftest-discovery job's stated doctrine below
          # ("a tool that later does need history is a tool whose self-test is not
          # hermetic; the fix is at that tool, not a blanket fetch-depth: 0"):
          #   1. That doctrine is APPLIED here, not overridden. The blast-radius test was
          #      the non-hermetic tool, and the fix landed AT THE TOOL — a committed
          #      golden — rather than by leaning on this line.
          #   2. It does not reach the three tools above. Their subject IS the
          #      relationship to origin/main (does the release body match the canonical
          #      note on main; does the close-out state match main's release corpus).
          #      Making them hermetic would delete what they check, not fix them.
          #   3. The failure mode is SILENT, which is why this cannot be left to discover
          #      itself. Verified: in a depth-1 single-branch checkout with origin/main
          #      absent, check-release-body-drift.sh --self-test still EXITS 0 while
          #      degrading its git-reading arms to "N/A (never FAIL)". Dropping this line
          #      turns those assertions into silent no-ops, not into failures — the exact
          #      success-without-checking shape #3818 exists to remove.
          #   4. The cost argument is job-scoped and stays satisfied: the
          #      selftest-discovery job keeps its shallow checkout, so nothing there is
          #      slowed to accommodate anything here.
          fetch-depth: 0

      - name: Verify prerequisites
        run: |
          set -euo pipefail
          uname -s
          command -v bash
          command -v python3
          command -v git

      - name: Discovered --self-tests, macOS partition (offline; discovery-based)
        # The macOS half of the discovery gate. A tool lands here ONLY by declaring
        # '# selftest-runner: macos' in its own first 40 lines; everything else runs in
        # the ubuntu selftest-discovery job. Today exactly one tool declares it —
        # automated-closeout.sh, which pins PATH to /usr/bin:/bin and resolves `gh` at
        # /opt/homebrew/bin or /usr/local/bin AT LOAD TIME, before its argument parser
        # is reached, so `--self-test` is literally unreachable on a runner that
        # installs gh elsewhere.
        #
        # That is why the declaration lives at the tool rather than as a workflow
        # exclusion: the requirement is a property of the script, and an exclusion
        # would let a runner constraint be recorded as a coverage decision. The engine
        # asserts the partition is TOTAL and DISJOINT, so a typo'd declaration cannot
        # silently drop a tool off both runners.
        #
        # This step REPLACES four hand-listed `<tool> --self-test` steps (close-out,
        # claim-version, check-release-body-drift, produce-learnings-register). Three
        # of those four now run in the ubuntu job by discovery; the fourth runs here.
        run: python3 release/tools/check-selftest-coverage.py --run --runner=macos

      - name: Blast-radius tool-family tests (schema-v1 lib + domain fan-out)
        # Exercises the blast-radius doc tracer's default-path regression against a
        # COMMITTED golden fixture (proves the shared-lib refactor is a no-op) AND the
        # domain-blast-radius software import-graph scanner + its field semantics.
        # Offline + deterministic — the F1 corpus is a committed fixture copied to a
        # mktemp tree and scanned via --root; no network, and after #3818 no git either.
        # Without this step, ZERO CI reference blast-radius — the tool could rot
        # unexercised. Requires jq (present on the macOS runner via /usr/bin/jq).
        #
        # STRICT makes a SKIP red. Every skip predicate in that suite is unreachable in a
        # well-formed checkout (the golden is a committed file; jq is on the image), so a
        # skip here means the harness or fixture is broken — not an environment
        # condition. This is what keeps the suite from reporting a clean exit 0 when the
        # assertion it exists to make did not run, which is the defect #3818 describes.
        # It is set on THIS STEP ONLY: locally a skip stays advisory so a developer
        # without jq is not blocked.
        env:
          BLAST_RADIUS_TESTS_STRICT: '1'
        run: bash release/tools/tests/test_domain_blast_radius.sh

      - name: ADR deciders carve-out — two-gate agreement suite
        # The depersonalization gate and the ADR durability lint both scan an ADR
        # `deciders:` line, and they used to return DIFFERENT verdicts on the handle:
        # the lint blocked it, the gate's whole-line skip let it through. The gate's
        # decision was INLINE in repo-integrity.yml, reachable only by a remote CI
        # trigger, so the only way to exercise it locally was to re-implement it — and
        # a re-implementation passes while the real gate diverges. The decision now
        # lives in release/tools/lib/deciders-carveout.sh, which the gate and this
        # suite BOTH source; the suite also asserts structurally that repo-integrity.yml
        # has not grown a private copy again.
        #
        # Seven committed fixtures, both gates. The load-bearing pair: the handle on a
        # `deciders:` line must be blocked by BOTH, and the literal NAME on the same
        # line must PASS both — the second arm is what stops the disagreement being
        # "resolved" by making both gates strict. Its negative control drives the
        # predicate with an EMPTY un-carved set and asserts the pre-fix defect
        # reproduces, so a suite that stopped discriminating fixed from broken fails
        # rather than greening.
        #
        # Every literal is synthetic (RFC 2606 .invalid for the email; the same
        # `octo-fixture` handle check-adr-durability.py drives its own self-test with) —
        # a fixture set encoding real identity values would be the defect the rule under
        # test exists to prevent. Hermetic: mktemp only, no network, no gh, no writes to
        # the checkout. Bash 3.2 compatible for this macOS runner. Gates on exit code.
        run: bash release/tools/tests/test_deciders_carveout.sh

      - name: Procedure 7a action-item gate predicate (escaped-pipe regression)
        # The Stage-13 HARD GATE predicate is PROSE-EMBEDDED — it lives in a bash
        # fence inside release/references/how-to/hub-spoke-bridge.md, so no runner
        # reaches it by default and it can rot silently. This suite extracts the
        # fence VERBATIM and exercises it, so the doc IS the unit under test.
        # Guards the defect that shipped once already: splitting the ledger on a
        # BARE pipe made a `status: open` row carrying a GFM-escaped `\|` in any
        # earlier free-text column read as terminal — a SILENT PASS of the gate.
        # Includes a negative control asserting the bare-pipe form still mis-reads
        # the fixture, so the suite cannot drift into passing vacuously.
        # Also exercises the § 4a.3 hub-state resolver (extracted verbatim from
        # orchestration-playbook.md) so the routing-point read sites keep finding
        # the ledger the canonical writer actually creates.
        # Offline + deterministic (mktemp fixtures; no network, no gh, no writes
        # to any operator-instance path). Gates on exit code.
        run: bash release/tools/tests/test_action_item_gate_predicate.sh

      - name: NC-NS-1 — spoke run-directory discipline (clause + behaviour)
        # The negative control for spoke output-path namespacing. A spawned
        # Stage-6 spoke once picked up a PRIOR spoke's leftover stage-comment
        # file from a shared temp parent and nearly posted it to the wrong
        # sub-task — a READ of a path it never wrote.
        # Two properties make this suite grade the DESIGN rather than a POSIX
        # guarantee, and both are why it is wired here rather than left as prose:
        #   (1) Deletion sensitivity. The six clause arms are re-run against a
        #       copy of hub-spoke-bridge.md with the run-directory section
        #       excised, and ALL SIX must fail there. An arm that survives the
        #       excision is asserting a file is non-empty, not that the contract
        #       clause is present — which is exactly how the first draft of this
        #       control would have passed with the clause deleted.
        #   (2) A deliberately NON-CONFORMING reader. One arm globs the shared
        #       temp parent and MUST find the prior run's leftover (non-zero).
        #       That reproduces the original defect on purpose, so the
        #       conforming arm's zero is a property of conformance rather than
        #       of there being no file to collide with.
        # Offline + deterministic (one mktemp tree; no network, no gh, no writes
        # to any operator-instance path or into the checkout). No workflow input
        # is interpolated — the step is a fixed command, so there is no
        # untrusted-data path into the shell. Gates on exit code.
        run: bash release/tools/tests/test_spoke_run_directory.sh

      - name: bundle-issues-parser regression suite (13 legs + 5 rank/sort assertions)
        # Wires a suite that shipped with ZERO executors. The release plan names
        # `test_bundle_issues_parser.py` as this card's "Executable regression" and
        # ADR-111 claims the T-13 guard "protects against regressing to silence" —
        # but no workflow, no shell script and no deploy.sh check invoked it, so it
        # fired only when a human typed the command. That is the SAME class of defect
        # the parser repair itself closed: the replaced label regex returned None on
        # every issue on every run and no test noticed, because no test asserted the
        # extraction was non-empty. A guard nothing executes cannot fire, so it cannot
        # fail — see the identical reasoning on the finops-selftest job below.
        # Offline and stdlib-only: reads the committed frozen sample
        # (conformant_bundleable_sample.json), no network, no gh, no writes outside
        # the checkout. Gates on exit code like its peers.
        run: python3 release/tools/tests/test_bundle_issues_parser.py

      - name: Precision probe — the parser suite actually FAILS on a dead detector
        # Without this, a suite that degraded to zero effective assertions would green
        # forever and this wiring would be decoration rather than a gate. Breaks the
        # exact property ADR-111 names — the T-13 liveness guard, which asserts the
        # priority detector resolves at least one P-level over the frozen sample — by
        # narrowing the detector's level class to a range no fixture carries. The
        # regex stays VALID, so the module still imports and the domain half of T-13
        # still passes; only liveness breaks. Mutation lands in a THROWAWAY temp copy,
        # never the checkout. A pass here would mean the gate is blind.
        run: |
          # -e is ON for every setup step: a failed mktemp / cp / injection must ABORT,
          # never fall through to a probe that silently tests nothing. It is relaxed
          # only around the one invocation that is EXPECTED to fail.
          set -euo pipefail
          probe="$(mktemp -d)"
          cp -R release/tools "$probe/tools"
          target="$probe/tools/bundle-issues-parser.py"

          # The anchor must match exactly once. If the implementation moves, this
          # exits non-zero and -e aborts the job — a probe that can no longer find
          # what it breaks reports that, rather than quietly passing.
          python3 - "$target" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]); s = p.read_text(encoding="utf-8")
          old = r"    r'P(?P<level>[1-4])\b',"
          new = r"    r'P(?P<level>[7-9])\b',"
          if s.count(old) != 1:
              sys.exit("probe anchor not found exactly once in bundle-issues-parser.py "
                       "(count=%d) — the probe would silently stop testing anything" % s.count(old))
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

          set +e
          python3 "$probe/tools/tests/test_bundle_issues_parser.py" > "$probe/probe.out" 2>&1
          probe_rc=$?
          set -e

          if [ "$probe_rc" -eq 0 ]; then
            echo "::error::Precision probe FAILED — test_bundle_issues_parser.py returned 0 with the priority detector narrowed to a level class no fixture carries. The T-13 liveness guard is not detecting a dead detector; this gate is blind."
            sed -n '1,40p' "$probe/probe.out"
            exit 1
          fi

          if ! grep -q 'T-13 liveness' "$probe/probe.out"; then
            echo "::error::Precision probe returned non-zero (exit $probe_rc) but NOT via the T-13 liveness assertion — the suite may be failing for an unrelated reason, which would mask a real detector regression."
            sed -n '1,40p' "$probe/probe.out"
            exit 1
          fi

          echo "Precision probe OK — a dead priority detector correctly failed the T-13 liveness guard (exit $probe_rc)."

      - name: CIAC-3 — emission-contract subset (asserted ⊆ instructed)
        # Wires the CIAC-3 lint that shipped with ZERO call sites. Without this step the
        # script is decorative: with no asserted-set file it takes a `SKIP: … return 0`
        # branch, so the mechanism built to make CIAC-3 mechanical would assert nothing.
        # This step asserts the LIVE relation only — the committed asserted set MUST be
        # a subset of the playbook's MUST rows (a gate asserting a class the playbook
        # never instructs can only ever fail). That is a claim about repo CONTENT and
        # nothing else runs it.
        #
        # The lint's own --self-test used to be a second line here. It is not gone: it
        # is now run by the selftest-discovery job, because check-emission-contract-subset.sh
        # is a release/tools/*.sh tool that dispatches on --self-test and is therefore
        # DISCOVERED. Naming it here as well would be duplicate execution and a second
        # enumeration — the same argument that retired the node-graph roster. The
        # "the lint cannot drift into always-passing" guarantee is unchanged; only its
        # executor moved from a hand-listed line to the discovery gate.
        # Offline, credential-free, no network — gates on exit code like its peers.
        run: |
          set -euo pipefail
          release/tools/check-emission-contract-subset.sh \
            core/deploy/allowlists/decision-emission-asserted-set.txt

      - name: Corpus path-resolution check (offline; hard-fail)
        # HARD-FAILS (exit 1) if any of the four corpus paths do not resolve in
        # THIS repo. Runs the offline --check-paths probe, before any gh/network
        # call, so the job is deterministic.
        run: bash release/tools/automated-closeout.sh --check-paths

      - name: Precision probe — broken path MUST fail the gate
        # Defends against a silently-rotting gate: copy the script into a throwaway
        # tree that is MISSING one corpus path and assert --check-paths exits
        # non-zero. The real checkout is never mutated. If a broken corpus stops
        # failing the gate, this step fails the PR.
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/release/tools" "$tmp/release/releases/notes"
          cp release/tools/automated-closeout.sh "$tmp/release/tools/"
          # Provide three of four corpus paths; deliberately OMIT RELEASE_LOG.md.
          : > "$tmp/release/releases/RELEASE_INDEX.md"
          : > "$tmp/release/releases/RELEASE_DIGEST.md"
          # RELEASE_LOG.md intentionally absent -> --check-paths must exit non-zero.
          set +e
          ( cd "$tmp/release/tools" && bash "$tmp/release/tools/automated-closeout.sh" --check-paths )
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::--check-paths returned 0 with a missing corpus path; the smoke gate is not detecting re-pathing drift."
            exit 1
          fi
          echo "Precision probe OK — broken corpus path correctly failed --check-paths (exit $rc)."

      - name: Corpus-home tolerance conformance (offline; structurally armed)
        # Asserts CH-1, CH-2 and CH-4 of
        # release/references/standards/corpus-home-adapter-constraints.md against the
        # real --check-paths probe once instance-aware resolution is DETECTED in it,
        # plus CH-3 unconditionally, using four hermetic mktemp fixtures.
        #
        # TODAY no instance-resolution vocabulary appears outside comments in
        # automated-closeout.sh, fixtures A and B are expected-red, the suite reports
        # PENDING-SEAM and exits 0 — it CANNOT redden a PR before the seam lands.
        #
        # Its gating rules run from day one: a regressed in-tree baseline (R1), a
        # --check-paths that stopped detecting a broken corpus path (R2), a
        # degenerate resolver (R5), or a broken doc<->test binding (R6) all exit 1.
        #
        # ARMING IS STRUCTURAL, not an exit-code proxy. The suite greps the
        # comment-stripped text of the script under test for instance-corpus
        # resolution vocabulary; it also arms behaviourally if fixture A exits 0. The
        # earlier `fixture A passes` proxy let an instance-aware resolver through
        # whenever it read a channel the fixture does not seed, resolved a layout the
        # fixture does not model, or crashed — three green escapes that are now red.
        # Once armed the tolerance rules read the fixtures' OUTPUT, not just their
        # exit codes, so a resolver that returns 0 while resolving nothing (CH-2) or
        # that downgrades unresolved paths to OK behind a single N/A banner (CH-4)
        # cannot reach PASS-SEAM-LANDED. No cutoff date to set, no flag to flip, and
        # no reviewer who has to remember the standard exists. That matters because
        # --check-paths is a REQUIRED step of this job: a HARD-FAIL-on-absence
        # resolver would redden every PR raised from a fresh clone or a CI runner,
        # for a condition that is not a defect.
        #
        # Coverage boundary: a resolver naming none of that vocabulary AND leaving
        # fixture A non-zero is not detected. Extending ARMING_NEEDLE in the suite is
        # the one-line remedy; the suite asserts that needle's non-vacuity itself.
        #
        # Hermetic: mktemp fixtures only; no network, no gh, no git remote, no write
        # to the checkout. HOME / CLAUDE_WORKSPACE_ROOT are pinned to an empty temp
        # dir per fixture so an ambient operator instance cannot leak in and defeat
        # the absence fixture.
        run: bash release/tools/tests/test_corpus_home_tolerance.sh

      - name: platform-toggle resolver truth table (13 arms + identity + 2 broken-state mutations)
        # Guards the absent-key contract of release/tools/lib/platform-toggle.sh: the
        # no-op default is a TERMINAL IN-CODE CONSTANT, not a value read from a config
        # file. That distinction is load-bearing rather than pedantic — the runtime
        # platform-config.toml does not exist on a stock instance and the update path
        # does not create it, so a template default alone never reaches a consumer, and
        # the repo's 5-rung reader returns EMPTY (not false) when a field is absent
        # everywhere. The suite asserts the property that follows: an install that never
        # received the file, a fresh install, and an install setting the key explicitly
        # false are behaviourally indistinguishable.
        #
        # It also asserts the reader is SECTION-AWARE with an `=` terminator, so neither
        # a same-named key under another section, a same-PREFIX key, nor a dotted
        # subtable header can resolve the toggle.
        #
        # This step exists because a committed suite that no runner reaches cannot fail,
        # and a check that cannot fail is indistinguishable in the artifact from a clean
        # one (core/standards/gate-efficacy-standard.md, condition R2).
        #
        # NOT VACUOUS BY CONSTRUCTION: the suite mutates the library into each of the two
        # shapes it exists to rule out — a section-blind unterminated reader, and a
        # flipped terminal default — and FAILS if the truth table does not turn red on
        # each. A table that cannot tell a broken resolver from a working one fails the
        # job rather than reporting a pass.
        #
        # Hermetic: mktemp fixtures only; no network, no gh, no git, no write to the
        # checkout. PMO_PLATFORM_CONFIG_ROOT is pinned per fixture, so the operator's
        # real ~/.config is never read. Gates on exit code.
        run: bash release/tools/tests/test_platform_toggle.sh

  selftest-discovery:
    name: Discovered tool self-tests (Ubuntu)
    # THE DISCOVERY GATE. Replaces a hardcoded 6-tool roster that covered 6 of the 22
    # eligible core/deploy/tools python tools — and left the rest, plus every
    # release/tools self-test, running only when a human typed the command. Every
    # "self-test PASS" recorded in a release was therefore a hand-run claim, not an
    # enforced gate; two real defects reached acceptance review behind exactly that
    # gap, because a self-test nothing executes cannot fire, so it cannot fail.
    #
    # A roster does not fix that — it reproduces it one level up. A tool that GROWS a
    # self-test is never added to the roster; a tool that LOSES one is never removed.
    # So the tool set is DISCOVERED: four '# scope:' globs declared in
    # core/deploy/allowlists/selftest-coverage-manifest.txt, filtered by a predicate
    # over each tool's own text, computed by release/tools/check-selftest-coverage.py.
    #
    # NO check predicate, glob, roster or count is re-encoded in this YAML. The engine
    # is committed, locally invocable (`--list` / `--run` / `--reconcile` work offline
    # from a clean checkout) and carries its own --self-test — the single-engine
    # thin-caller discipline deploy-check-ci.yml states outright, which every recent
    # gate in this repo follows. Writing the discovery loop inline here would make this
    # the one gate that re-implements its own predicate in YAML, reachable only by a
    # remote CI trigger and impossible to exercise locally except by re-implementing it
    # a third time — the exact failure the deciders-carveout library exists to prevent.
    #
    # The predicate distinguishes DISPATCH from MENTION. This is not a detail: a naive
    # `grep -l -- --self-test` counts files whose only occurrence is comment prose, and
    # it produced two wrong published figures for this very tree before the engine was
    # written. Comment-only mentions are not advertisers.
    #
    # Pure-stdlib and OS-agnostic, so ubuntu-latest — no pip install, no network, no
    # gh/credentials, no git-history read, so the default shallow checkout suffices.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Default (shallow) depth, and this is MEASURED rather than assumed: at first
        # enablement all 53 tools in this partition passed under a shallow checkout.
        # The engine itself reads no git history — no network, no gh, no git-log — so
        # nothing here needs a deeper clone. A tool that later does need history is a
        # tool whose self-test is not hermetic; the fix is at that tool, not a blanket
        # fetch-depth: 0 that slows every run to accommodate one.

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Engine self-test (must pass BEFORE the engine is trusted to gate)
        # Ordering is load-bearing: a broken engine must not be able to green the gate.
        # An engine whose discovery silently returned the empty set would report
        # "0 of 0 passed" and this job would be decoration. These fixtures assert the
        # properties that would hide such a failure — dispatch-vs-mention, the
        # anti-narrowing floor and its control, the runner partition, and the refusal
        # of a probe flag against the real checkout — each with a control arm, because
        # a detection whose control also fires proves nothing.
        run: python3 release/tools/check-selftest-coverage.py --self-test

      - name: The discovered set (roster visible in the log, derived not declared)
        # Printed so a reviewer can audit WHAT ran without reading YAML or the manifest.
        # This is the affordance the retired roster provided by accident; here it is
        # derived, so it cannot disagree with what actually executes.
        run: python3 release/tools/check-selftest-coverage.py --list --explain

      - name: Arm A — run every discovered --self-test (offline, stdlib-only)
        # No fail-fast: one run reports every regression, not just the first, matching
        # the sibling finops loop. Emits a ::error:: annotation per failing tool and a
        # ::group:: per tool, and exits non-zero if any failed.
        run: python3 release/tools/check-selftest-coverage.py --run --runner=ubuntu

      - name: Arms B/C/D — the meta-assertions
        # Arm B is the answer to "a tool advertising --self-test but not discovered
        # must fail the gate", and it is deliberately NOT computed from the same glob
        # as Arm A. If both sides came from one grep, "advertises but is not
        # discovered" would be the empty set BY CONSTRUCTION and the assertion would
        # assert nothing. Arm A's set is a runtime glob; Arm B's is the committed
        # manifest. They can disagree, which is what gives it teeth:
        #   B(i)  a manifest path still on disk but no longer discovered -> HARD FAIL.
        #         Catches BOTH a narrowed '# scope:' glob and a tool that silently lost
        #         its --self-test.
        #   B(ii) a discovered path missing from the manifest -> HARD FAIL. A new
        #         self-testing tool must land in the manifest in the same PR.
        # Arm C (warn) reconciles repo-wide against a DIFFERENT denominator — every
        # tracked *.sh/*.py — so an advertiser outside both declared trees is either
        # wired by a named workflow step or written down with a reason.
        # Arm D (warn) names every committed tests/ suite that no workflow runs. Those
        # suites are OUTSIDE this gate's scope by decision, not because they are empty
        # of dispatch — at least one of them does dispatch — so surveillance, not
        # silence, is the honest treatment.
        run: python3 release/tools/check-selftest-coverage.py --reconcile

      - name: Precision probe — a deliberately broken self-test MUST fail the gate
        # Without this the gate is a claim about itself. Breaks a real fixture
        # expectation in version-grammar.sh (F1 X.Y: PASS -> REJECT) inside a THROWAWAY
        # copy, never the checkout, and requires the gate to fail VIA THAT ASSERTION
        # and to NAME the tool — not merely to exit non-zero, which any unrelated
        # breakage would also do.
        #
        # The control arm runs FIRST, unmutated. A negative test whose control also
        # fails proves nothing, and running it first means a probe fixture that is
        # broken for an unrelated reason aborts loudly instead of masquerading as a
        # detection.
        #
        # --only is refused by the engine unless --root is given, so it cannot be used
        # to narrow the real gate steps above; it exists so this probe's failure is
        # attributable to the one tool it broke.
        run: |
          # -e is ON for every setup step: a failed mktemp / cp / injection must ABORT,
          # never fall through to a probe that silently tests nothing. It is relaxed
          # only around the one invocation that is EXPECTED to fail.
          set -euo pipefail
          probe="$(mktemp -d)"
          mkdir -p "$probe/release" "$probe/core/deploy"
          cp -R release/tools "$probe/release/tools"
          cp -R core/deploy/tools "$probe/core/deploy/tools"
          cp -R core/deploy/allowlists "$probe/core/deploy/allowlists"
          subject="release/tools/version-grammar.sh"

          set +e
          python3 release/tools/check-selftest-coverage.py \
            --run --root "$probe" --runner=ubuntu --only "$subject" > "$probe/control.out" 2>&1
          control_rc=$?
          set -e
          if [ "$control_rc" -ne 0 ]; then
            echo "::error::Control arm FAILED — ${subject} --self-test does not pass in the UNMUTATED probe copy (exit $control_rc), so the mutated arm below would prove nothing."
            sed -n '1,40p' "$probe/control.out"
            exit 1
          fi
          if grep -q 'FAIL \[F1 X.Y\]' "$probe/control.out"; then
            echo "::error::Control arm already reports the F1 X.Y failure with no mutation applied; the probe cannot discriminate."
            exit 1
          fi
          echo "Control OK — the unmutated copy passes."

          # The anchor must match exactly once. If the fixture moves, this exits
          # non-zero and -e aborts the job — a probe that can no longer find what it
          # breaks reports that, rather than quietly passing.
          python3 - "$probe/$subject" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]); s = p.read_text(encoding="utf-8")
          old = '_vg_t_canon "v2.12"      PASS   "F1 X.Y"'
          new = '_vg_t_canon "v2.12"      REJECT "F1 X.Y"'
          if s.count(old) != 1:
              sys.exit("probe anchor not found exactly once in version-grammar.sh "
                       "(count=%d) — the probe would silently stop testing anything" % s.count(old))
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

          set +e
          python3 release/tools/check-selftest-coverage.py \
            --run --root "$probe" --runner=ubuntu --only "$subject" > "$probe/probe.out" 2>&1
          probe_rc=$?
          set -e

          if [ "$probe_rc" -eq 0 ]; then
            echo "::error::Precision probe FAILED — the coverage gate returned 0 with a deliberately broken self-test. A broken self-test does not fail the PR; this gate is blind."
            sed -n '1,40p' "$probe/probe.out"
            exit 1
          fi
          if ! grep -q 'FAIL \[F1 X.Y\]' "$probe/probe.out"; then
            echo "::error::Precision probe returned non-zero (exit $probe_rc) but NOT via the mutated assertion — the gate may be failing for an unrelated reason, which would mask a real regression."
            sed -n '1,40p' "$probe/probe.out"
            exit 1
          fi
          if ! grep -q "FAIL: $subject" "$probe/probe.out"; then
            echo "::error::Precision probe returned non-zero but the gate did not NAME ${subject} in its failure list; a failure nobody can attribute is not actionable."
            sed -n '1,40p' "$probe/probe.out"
            exit 1
          fi
          echo "Precision probe OK — a deliberately broken self-test failed the gate (exit $probe_rc), via the mutated assertion, naming the tool."

      - name: Precision probe — narrowing a '# scope:' glob MUST fail the gate
        # This is the guard on the guard. AC-8 forbids resolving a first-enablement
        # failure by narrowing discovery; without this probe, "Arm B(i) catches
        # narrowing" would itself be an unexercised claim — which is the precise defect
        # class this release exists to close.
        #
        # Deletes one '# scope:' directive in a throwaway copy of the manifest and
        # requires --reconcile to fail VIA Arm B(i) and to NAME a dropped path. That
        # naming is what makes narrowing self-defeating: greening it requires deleting
        # the listed paths in the same diff, directly beneath the directive that was
        # narrowed, in the reviewer's eye.
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          mkdir -p "$probe/release" "$probe/core/deploy"
          cp -R release/tools "$probe/release/tools"
          cp -R core/deploy/tools "$probe/core/deploy/tools"
          cp -R core/deploy/allowlists "$probe/core/deploy/allowlists"
          manifest="$probe/core/deploy/allowlists/selftest-coverage-manifest.txt"

          set +e
          python3 release/tools/check-selftest-coverage.py --reconcile --root "$probe" > "$probe/control.out" 2>&1
          control_rc=$?
          set -e
          if [ "$control_rc" -ne 0 ]; then
            echo "::error::Control arm FAILED — --reconcile does not pass on the UNMUTATED probe copy (exit $control_rc), so the narrowing arm below would prove nothing."
            sed -n '1,60p' "$probe/control.out"
            exit 1
          fi
          echo "Control OK — the unmutated manifest reconciles."

          # The victim path is DERIVED from the manifest, never named here. Hardcoding a
          # tool name in this workflow would re-introduce, in the probe, the very
          # enumeration the gate exists to retire — and CIAC-3's method greps this file
          # for exactly that. The probe deletes the LAST '# scope:' directive and reads
          # back the first path that directive owned.
          victim="$(python3 - "$manifest" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]); lines = p.read_text(encoding="utf-8").splitlines()
          idx = [i for i, l in enumerate(lines) if l.strip().startswith("# scope:")]
          if not idx:
              sys.exit("no '# scope:' directive in the manifest — the probe would "
                       "silently stop testing anything")
          cut = idx[-1]
          owned = []
          for l in lines[cut + 1:]:
              if l.strip().startswith("#"):
                  break
              if l.strip():
                  owned.append(l.strip())
          if not owned:
              sys.exit("the last '# scope:' directive owns no paths — the probe would "
                       "silently stop testing anything")
          del lines[cut]
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(owned[0])
          PY
          )"
          echo "Narrowed the last '# scope:' directive; expecting the gate to name ${victim} as dropped."

          set +e
          python3 release/tools/check-selftest-coverage.py --reconcile --root "$probe" > "$probe/probe.out" 2>&1
          probe_rc=$?
          set -e

          if [ "$probe_rc" -eq 0 ]; then
            echo "::error::Anti-narrowing guard FAILED — deleting a '# scope:' directive did not fail --reconcile. Narrowing discovery would silently green a failing tool; this gate is blind."
            sed -n '1,60p' "$probe/probe.out"
            exit 1
          fi
          if ! grep -q 'Arm B(i) MANIFEST FLOOR' "$probe/probe.out"; then
            echo "::error::--reconcile returned non-zero (exit $probe_rc) but NOT via Arm B(i) — the manifest floor is not what caught the narrowing."
            sed -n '1,60p' "$probe/probe.out"
            exit 1
          fi
          if ! grep -q "DROPPED: $victim" "$probe/probe.out"; then
            echo "::error::Arm B(i) fired but did not NAME ${victim} among the dropped paths; a narrowing the reviewer cannot see in the diff is not deterred."
            sed -n '1,60p' "$probe/probe.out"
            exit 1
          fi
          echo "Anti-narrowing guard OK (exit $probe_rc) — a narrowed scope failed Arm B(i) and named every dropped path."

  finops-selftest:
    name: FinOps usage-extractor script self-tests (Ubuntu)
    # The four finops-usage-extractor scripts carry the ONLY executable form of the
    # store's conservation invariants (sum(by_X.*.tokens) == session.tokens leaf by
    # leaf; sum(stop_reason.*) == turns) and of the CIAC-1/1b ground-truth + SM-*/SE-*
    # fail-closed assertions. Before this job, NO workflow and NO deploy.sh check ran
    # them: a fail-closed predicate that nothing executes cannot fire, so it cannot
    # fail — the same class of defect the release itself was closing.
    #
    # Hermetic: every self-test builds its store in a mktemp dir OUTSIDE the checkout,
    # reads only the committed synthetic test-fixtures, and makes no network or gh
    # call. Dependencies are jq + git, both present on the runner image. Gate on exit
    # code, exactly like the two sibling jobs above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Default depth: each --self-test reads committed fixtures from the working
        # tree, not git history — a shallow checkout is sufficient.

      - name: Verify prerequisites
        run: |
          set -euo pipefail
          command -v bash
          command -v jq
          command -v git

      - name: finops script --self-tests (offline, synthetic fixtures only)
        # Runs all four (no fail-fast) so one run reports every regression; emits a
        # ::error:: annotation per failing script and exits non-zero if any failed.
        run: |
          set -uo pipefail
          rc=0
          for s in extract-usage rollup-attribution report-usage estimate-usage; do
            echo "::group::${s}.sh --self-test"
            if bash "core/skills/finops-usage-extractor/scripts/${s}.sh" --self-test; then
              echo "OK: ${s}"
            else
              echo "::error::${s}.sh --self-test FAILED"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Precision probe — the self-test actually FAILS on a broken invariant
        # Without this, a self-test that silently degraded to zero assertions would
        # green forever and this job would be the tenth fail-open, not the fix for the
        # ninth. Breaks a real invariant the schema declares — the reserved "unknown"
        # seed in dim_agg, which is what makes sum(by_X.*.tokens) == session.tokens
        # hold for a partial dimension — in a THROWAWAY temp copy, never the checkout,
        # and asserts a non-zero exit. A pass here would mean the gate is blind.
        run: |
          # -e is ON for every setup step: a failed mktemp / cp / injection must ABORT,
          # never fall through to a probe that silently tests nothing. It is relaxed
          # only around the one invocation that is EXPECTED to fail.
          set -euo pipefail
          probe="$(mktemp -d)"
          cp -R core/skills/finops-usage-extractor "$probe/finops-usage-extractor"
          target="$probe/finops-usage-extractor/scripts/extract-usage.sh"

          # The anchor must match exactly once. If the implementation moves, this
          # exits non-zero and -e aborts the job — a probe that can no longer find
          # what it breaks reports that, rather than quietly passing.
          python3 - "$target" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]); s = p.read_text(encoding="utf-8")
          old = '({ "unknown": [] }; . + { ($e.k): ((.[$e.k] // []) + [$e.r]) })'
          new = '({}; . + { ($e.k): ((.[$e.k] // []) + [$e.r]) })'
          if s.count(old) != 1:
              sys.exit("probe anchor not found exactly once in extract-usage.sh "
                       "(count=%d) — the probe would silently stop testing anything" % s.count(old))
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

          set +e
          bash "$target" --self-test > "$probe/probe.out" 2>&1
          probe_rc=$?
          set -e

          if [ "$probe_rc" -eq 0 ]; then
            echo "::error::Precision probe FAILED — extract-usage.sh --self-test returned 0 with the reserved \"unknown\" seed removed. The conservation assertions are not detecting a broken dimension partition; this gate is blind."
            sed -n '1,40p' "$probe/probe.out"
            exit 1
          fi

          if ! grep -q 'analysis-dimension invariants' "$probe/probe.out"; then
            echo "::error::Precision probe returned non-zero (exit $probe_rc) but NOT via the analysis-dimension invariant assertion — the self-test may be failing for an unrelated reason, which would mask a real conservation regression."
            sed -n '1,40p' "$probe/probe.out"
            exit 1
          fi

          echo "Precision probe OK — a broken reserved-\"unknown\" seed correctly failed the conservation assertions (exit $probe_rc)."
