          p = pathlib.Path(sys.argv[1]); s = p.read_text(encoding="utf-8")
          t3 = ('    elif $t3v != null then\n'
                '      { work_item: ("milestone:" + $t3v), work_item_kind: "milestone",\n'
                '        attribution_tier: "hub-state-lineage", reproducible: true,\n'
                '        attribution_basis: ("hub-state worktree " + $wt + " -> milestone " + $t3v) }\n')
