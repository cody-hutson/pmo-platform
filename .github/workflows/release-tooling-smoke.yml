name: Release tooling smoke

# gate-efficacy: posture=advisory  enforcement=path-filtered  skip-semantics=absent-is-pass
#   invariant: the Stage 13 close-out automation runs (self-test + offline smoke)
#              when release tooling or the RELEASE_LOG schema changes — asserted
#              behaviorally by executing the script's checks.
#   falsification: on a PR touching the close-out tooling, break a corpus path the
#                  script asserts -> the closeout-smoke job fails; on an unrelated
#                  PR it is skipped and absence is treated as pass.
# Path-filtered, so ADVISORY by skip-semantics. (Per gate-efficacy-standard.md (b).)

# Smoke-tests the Stage 13 close-out automation on any PR that touches release
# tooling (or the RELEASE_LOG schema), so the script cannot rot unexercised — the
# exact failure mode where stale paths / a stale column index / de-identification
# escapes hid for several releases until the close-out was finally run.
#
# Two gates, BOTH offline (no git remote / gh / network call), so the job is
# deterministic and credential-free on a fresh runner:
#   1. --self-test  — the script's in-process unit checks (version / row-state /
#      milestone-slug / parser-clean parsing, JSON render, and a HARD assertion
#      that all four corpus paths resolve). Gates on exit code.
#   2. --check-paths — an offline corpus-path resolution probe. Post-ADR-032 the
#      release corpus is operator-instance CONTENT, absent in a fresh clone / CI, so
#      on the CI checkout this probe records N/A (exit 0) — instance-absence is not a
#      defect (mirrors deploy.sh Check 26 / pmo_instance_path). It still HARD-FAILS
#      (exit 1) on a genuine path-resolution defect when the instance corpus IS
#      present. Catches re-pathing drift before a release.
#
# A third step is a precision probe: it proves the path gate actually FAILS on a
# deliberately-broken corpus path WHEN A CORPUS IS PRESENT (it seeds a throwaway
# instance corpus via PMO_INSTANCE_PATH, omits one path, and asserts non-zero). A
# warn-only gate is blind to false negatives — this keeps the gate honest, the same
# discipline reference-durability.yml applies to its fragile-ref detector.
#
# Platform: macos-latest. automated-closeout.sh pins PATH to /usr/bin:/bin and
# resolves `gh` at the Homebrew (/opt/homebrew/bin) or Intel (/usr/local/bin)
# locations at load time — the macOS image is where those paths exist. This
# mirrors install-tests.yml, which runs the shell harness on macos-latest.
#
# Security: this workflow consumes NO untrusted github.event.* input (no issue
# titles, PR bodies, comment bodies, head refs). Every run: block is a static
# shell invocation against workspace files only.

on:
  pull_request:
    paths:
      - 'release/tools/**'
      - 'release/releases/RELEASE_LOG.md'
      - '.github/workflows/release-tooling-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'release/tools/**'
      - 'release/releases/RELEASE_LOG.md'

permissions:
  contents: read

jobs:
  closeout-smoke:
    name: Close-out automation smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify prerequisites
        run: |
          set -euo pipefail
          uname -s
          command -v bash
          command -v python3
          command -v git

      - name: Self-test (offline unit checks + parser-clean)
        # Pure helpers only — must NOT reach gh auth / network. Gate on exit code.
        run: bash release/tools/automated-closeout.sh --self-test

      - name: Corpus path-resolution check (offline; instance-absent N/A on CI)
        # Post-ADR-032 the corpus is operator-instance content, absent on a fresh CI
        # checkout, so this records N/A (exit 0) — instance-absence is not a defect.
        # Runs the offline --check-paths probe before any gh/network call, so the job
        # is deterministic. It still HARD-FAILS on a real defect when a corpus IS
        # present (proven by the precision probe below).
        run: bash release/tools/automated-closeout.sh --check-paths

      - name: Precision probe — broken path MUST fail the gate (corpus present)
        # Defends against a silently-rotting gate. Post-ADR-032 the corpus root is the
        # operator-instance path; seed a throwaway instance via PMO_INSTANCE_PATH that
        # is PRESENT but MISSING one corpus path, and assert --check-paths exits
        # non-zero. The real checkout is never mutated. If a broken corpus stops
        # failing the gate, this step fails the PR. (Separately, the step above proves
        # an ABSENT instance records N/A rather than a false FAIL.)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # Seed a PRESENT instance corpus root, but omit RELEASE_LOG.md.
          export PMO_INSTANCE_PATH="$tmp/pmo-instance"
          mkdir -p "$PMO_INSTANCE_PATH/releases/notes"
          : > "$PMO_INSTANCE_PATH/releases/RELEASE_INDEX.md"
          : > "$PMO_INSTANCE_PATH/releases/RELEASE_DIGEST.md"
          # RELEASE_LOG.md intentionally absent, root present -> must exit non-zero.
          set +e
          bash release/tools/automated-closeout.sh --check-paths
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::--check-paths returned 0 with a present corpus root and a missing path; the smoke gate is not detecting re-pathing drift."
            exit 1
          fi
          echo "Precision probe OK — broken corpus path correctly failed --check-paths (exit $rc)."

      - name: Instance-absent tolerance probe — absent corpus MUST be N/A (exit 0)
        # Proves the caveat-7 tolerance: when the instance corpus ROOT is absent
        # (fresh clone / CI), --check-paths records N/A and exits 0 rather than a
        # false HARD-FAIL. Point PMO_INSTANCE_PATH at an empty dir (no releases/).
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          export PMO_INSTANCE_PATH="$tmp/absent-instance"   # no releases/ under it
          set +e
          bash release/tools/automated-closeout.sh --check-paths
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::--check-paths returned $rc on an absent instance corpus; it must record N/A (exit 0) per the instance-absence convention."
            exit 1
          fi
          echo "Instance-absent tolerance OK — absent corpus correctly recorded N/A (exit 0)."
