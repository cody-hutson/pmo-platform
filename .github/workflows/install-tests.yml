        # the pre-fix predicate and passes on the post-fix one, exercising BOTH the enforce
        # ladder AND the predicate-script-missing error path — a one-arm test reproduces the
        # original defect as a PASS, because the defect was precisely that one arm worked.
        # Wired explicitly because this workflow enumerates its test files rather than
