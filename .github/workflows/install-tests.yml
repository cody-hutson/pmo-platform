        run: bash core/deploy/tests/test_check36_drift_classes.sh

      - name: Run package-freshness exit-code regression (test_package_freshness_exit_codes.sh)
        # #4183: the --check-package-freshness probe used to map a warn-mode STALE
        # verdict to exit 0, so a caller reading the exit status got a false PASS.
        # This test asserts the verdict -> exit contract DIRECTLY in a subprocess
        # (FRESH=0, STALE+warn=2 advisory, STALE+enforce=1, unexpected=1) against a
        # throwaway `git archive HEAD` sandbox with HOME redirected. It normalizes
        # that sandbox to FRESH before injecting its own staleness, so it tests the
        # MAPPING and never double-gates committed-tree freshness (which Check 7 and
        # the skill-package-freshness CI gate already own).
        run: bash core/deploy/tests/test_package_freshness_exit_codes.sh

      - name: Run template-sync resolver regression (test_resolve_canonical_source.sh)
        # #2158: the canonical-source resolver is single-sourced in
        # core/deploy/lib-template-sync-source.sh and sourced by BOTH deploy.sh and
        # build-skill-packages.sh. This test sources the real fragment, pins the
        # 3-arm fixture table (incl. the #94 regression-checks.md case that broke the
        # rebuild), and drift-guards that neither consumer re-inlines a divergent copy.
        run: bash core/deploy/tests/test_resolve_canonical_source.sh

      - name: Run Check 45(b) governing_doc name-match fixture self-test (test_check45_governing_doc_name_match.sh)
        # #4177: Check 45(b) validated a design-principle-register governing_doc pin
        # by asserting only that the file existed and the pinned line was non-empty,
        # so a pin that had drifted onto a DIFFERENT principle passed silently. This
        # test builds a synthetic register + charter in a tmpdir (the live corpus is
        # never read or mutated by the assertions) and pins all three failure
        # branches apart — NAME-MATCH, RESOLVE, EMPTY-NAME — plus an anti-vacuity
        # control and a reproduction of the pre-fix silent pass. Its drift guard
        # greps deploy.sh by the `# (b) FMF-1` inline MARKER, never a line number, so
        # a silent edit to the live predicate fails this test rather than passing it
        # stale.
        run: bash core/deploy/tests/test_check45_governing_doc_name_match.sh

      - name: Run Check 31 override-marker probe determinism test (test_check31_marker_probe_determinism.sh)
        # #3833: Check 31's two per-file override-marker probes piped the stripped
        # file body into a quiet grep under deploy.sh's `set -euo pipefail`. The grep
        # exits on its first match, the writer takes SIGPIPE, and pipefail promotes
        # that 141 to the pipeline — so a SUCCESSFUL match reported failure and the
        # file's override marker was silently ignored. The reported saturation count
        # therefore varied run to run on a byte-identical corpus. A single-run count
        # assertion cannot fail on that defect, so this test asserts run-to-run
        # EQUALITY across 5 runs, plus completeness against an independent census.
        # Its T3 negative control runs the pre-fix form on the same above-capacity
        # fixture and requires it to FAIL, so a fixture that stopped reproducing the
        # defect fails the test rather than passing it vacuously.
        run: bash core/deploy/tests/test_check31_marker_probe_determinism.sh

      - name: Run Check 73 bundle-metrics discrimination fixtures — G3-14 / G3-15 (test_check73_bundle_metrics_discrimination.sh)
        # #6298: G3-14 (Mode-A combined-clean parse-rate floor) and G3-15
        # (per-milestone risk-weighted size bound) shipped as prose-declared
        # predicates with NO RUNNER ON ANY SURFACE — zero executable artifacts
        # implemented either one. Building the runner is only half the job: a
        # runner that answers the same way to a breaching and a conforming
        # population is not a gate, it is a constant that reads green. This suite
        # extracts the verdict bodies from deploy.sh AT RUN TIME (no re-encoded
        # copy to drift) and drives both directions of each gate against committed
        # boundary fixtures — the parse rate sits exactly AT the floor and
        # effective_pts exactly AT the band bound, so a `>=`->`>` or `<=`->`<`
        # mutation flips exactly one arm. Its assert_arms_ran control fails unless
        # all four arms executed AND each gate produced an opposite-verdict pair,
        # so deleting the arm that contradicts another cannot green the suite.
        #
        # THIS STEP IS THE UNCONDITIONALLY-BLOCKING HALF of Check 73. It carries no
        # continue-on-error and this workflow carries no paths: filter, so a
        # discrimination failure is a genuine red check-run on every pull request,
        # independent of the .github/deploy-check-ci.enforce sentinel that governs
        # the required-subset half. That is what lets this milestone ship a real
        # blocking pre-merge assertion about these gates WITHOUT flipping any gate
        # warn -> enforce.
        #
        # Security: consumes NO github.event.* input — a static invocation against
        # workspace files, no ${{ }} interpolation inside the run: block.
        run: bash core/deploy/tests/test_check73_bundle_metrics_discrimination.sh

      - name: Run Check 54 ownership-collision teeth suite (test_check54_ownership_collision_teeth.sh)
        # Check 54's ADR-044 I3 and I4 invariants both key on a `Maintains-entity:`
        # marker in core/schemas/per-skill-output-contracts.md, and until this
        # milestone the corpus carried zero of them — so the escalate predicate was
        # zero-ESCALATE by construction and the check read as coverage while
        # enforcing nothing. The primitive's own --self-test does not close that: it
        # asserts I1-fires / I3-fires against three-row fixtures written inline in
        # its own source, which shows the predicate compiles, never that it fires on
        # the real 19-entity owning-agent matrix. This suite runs every arm against
        # COPIES of the live corpus with one mutation each: specificity arms require
        # the unmutated corpus to exit 0, sensitivity arms require exit 1 AND that
        # the output names the invariant, the declaring skill, the entity, and the
        # section-6 owner. A vacuity guard re-reads section 6 at run time, so a
        # future ownership change fails this suite instead of letting the I3 arm
        # pass against a marker that no longer contradicts anything. A mutation
        # guard asserts each fixture actually differs from its source, since a
        # transform that silently matched nothing would leave the specificity arms
        # passing for the wrong reason. Its placement arm relocates the contracts
        # file's own worked marker example into a skill section and requires a
        # collision — the example is inert only because it sits above the first
        # skill header, and an editor who tidies it into the catalogue would
        # otherwise arm a false I3 silently.
        #
        # Hermetic: fixtures under mktemp -d, the durable corpus read-only, no gh,
        # no network. Consumes no workflow event input — a static invocation
        # against workspace files, no interpolation of any kind inside the run: block.
        run: bash core/deploy/tests/test_check54_ownership_collision_teeth.sh

      - name: Run warn-log JSON-escape suite (test_warn_log_json_escape.sh)
        # deploy.sh's warn-log `detail` serialization folded a backslash and a
        # double-quote and nothing else, while RFC 8259 §7 requires every
        # U+0000–U+001F in a JSON string to be escaped. 659 rows of the live family
        # were therefore invalid JSON and invisible to any parsing drain — absent
        # from both the numerator and the denominator of every count over the file.
        #
        # The suite EXTRACTS the shipped json_escape_detail() out of deploy.sh and
        # evaluates it, so the function under test is the one that ships rather than
        # a copy — a copy is the defect class this suite exists to keep retired.
        #
        # A4 is the arm that makes the rest mean anything: it reproduces the pre-fix
        # two-substitution serialization on the SAME input through the SAME emit
        # format and requires the row to FAIL to parse. A zero there is a broken
        # probe, not a clean result, and it says so. A5 bounds A4 by requiring a
        # control-character-free input to parse under both arms. A7/A8/A9 carry the
        # name- and keyword-agnostic completeness matcher, its reconstructed 9 / 0 / 0
        # pre-fix null arm, and the demonstration that the retired
        # `local _detail_escaped=` instrument reads only 7 of the 9 sites.
        #
        # Hermetic: every row under mktemp -d, the live warn-log family and the
        # durable corpus read-only, no gh, no network. Consumes NO workflow event
        # input — a static invocation against workspace files, with no interpolation
        # of any kind inside the run: block.
        run: bash core/deploy/tests/test_warn_log_json_escape.sh

      - name: Run Check 22 G1-06 priority-carrier regression (test_g1_06_priority_carrier.sh)
        # Check 22's G1-06 criterion used to bind one priority carrier and was
        # therefore blind to every body the intake form renders. The fix delegates
        # to the shared carrier-agnostic detector rather than authoring a fourth
        # matcher, so the property worth guarding is the DELEGATION, not the
        # library behind it. This test extracts the delegate program from the live
        # deploy.sh and executes it against fixture JSON; its drift guard is
        # restricted to NON-COMMENT lines because the change's own comment names
        # the delegated function, and a bare substring grep therefore stays green
        # on a deleted delegation. Its arm F constructs that exact regressed state
        # and fails if the guard cannot tell the two apart. Hermetic: no gh, no
        # network — which is the only option available, since Check 22 itself
        # requires a live tracker and is correctly excluded from the
        # network-free required-check subset. Consumes no workflow event input.
        run: bash core/deploy/tests/test_g1_06_priority_carrier.sh

      - name: Run Check 22 G1-01 title-floor regression (test_g1_title_floor.sh)
        # Pre-existing test that had never been CI-wired. A regression net that
        # never executes cannot hold anything in place, so it is wired here
        # alongside its sibling rather than left as a file that only ever runs by
        # hand. No change to the test itself. Consumes no workflow event input.
        run: bash core/deploy/tests/test_g1_title_floor.sh

      - name: Run Check 22 form-family scope regression (test_g1_form_family.sh)
        # Check 22 terminated every kind-form card at its intake-tier label count
        # with a verdict whose remediation told a correctly-labelled author to
        # relabel. The fix partitions the population into four form families
        # before any criterion runs, and derives which criteria read a kind-form
        # card from that card's OWN declared body sections rather than from a
        # family-wide assertion — because field presence varies within the family.
        # Two properties are worth guarding and neither is visible by reading the
        # code: the partition is TOTAL (a fixture per live pack kind, plus the
        # multi-tier cell that is empty on the live population and would otherwise
        # rot unobserved), and applicability is DERIVED (a kind-form body carrying
        # acceptance criteria is graded; one without is not). The test extracts and
        # executes the shipped evaluation region between the deploy.sh C22-EVAL
        # sentinels, so it exercises the shipped path rather than a copy, and it
        # reads its kind vocabulary from the pack SSOT so it names no kind either.
        # Hermetic: no gh, no network. Consumes no workflow event input.
        run: bash core/deploy/tests/test_g1_form_family.sh

      - name: Run Check 22 release-identity resolver regression (test_g1_release_resolver.sh)
        # Check 22 now evaluates the milestone BEING DEPLOYED, so a resolver
        # decides the population on every run. Its load-bearing property is not
        # visible by reading the code: the milestone read must be PAGINATED,
        # because `gh api` does not auto-paginate and GitHub's default page is
        # 30 rows, while the open-milestone population sits within one row of
        # that boundary — an un-paginated read starts calling a legitimate
        # in-flight release "absent" with no code change at all. The test
        # extracts the shipped resolver between the deploy.sh C22-RESOLVER
        # sentinels, drives it against a stubbed `gh` that honours the real
        # API's pagination semantics over a 201-row fixture, and grades the
        # pagination arms against a deliberately REGRESSED copy that must go
        # red — a probe that cannot fail on the defect it names is not
        # evidence. It also holds the provenance split (an operator-ASSERTED
        # candidate fails closed; a branch-DETECTED one degrades to advisory)
        # and the three verdicts that must never be rendered as a missing
        # milestone: unreachable validator, empty read, unrecognized branch
        # form. Hermetic: no gh, no network. Consumes no workflow event input.
        run: bash core/deploy/tests/test_g1_release_resolver.sh

      - name: Run Check 56 M2 advisory-class regression (test_check56_m2_advisory.sh)
        # Check 56's M2 leg is documented as unable to gate. A static read of the
        # call site cannot demonstrate the ABSENCE of gating, so this test proves
        # it by running it: it extracts the real emitter bodies, the real mode
        # resolver, the real input-building block and the M1/M2 emit region from
        # deploy.sh between the C56-EMIT sentinels, and executes them against a
        # real failure counter — deliberately WITHOUT stubbing the emitters,
        # because here the emitter's escalation behaviour IS the assertion and a
        # stub would make "M2 did not gate" trivially true. The arms that make
        # the zero usable are the controls: an M1 finding driven through the same
        # region at the same enforce mode must raise the counter and print a
        # failure line (sensitivity), and the same fixture at warn mode must
        # resolve `warn` and raise nothing (specificity), so the M2 zero cannot
        # be an artefact of a mode file that was never read. Hermetic: no gh, no
        # network — the TSV under test is produced by the primitive's own
        # --fixture path. Consumes no workflow event input.
        run: bash core/deploy/tests/test_check56_m2_advisory.sh

      - name: Run advisory-emitter contract regression (test_advisory_emitter_contract.sh)
        # flag_advisory_only requires a third argument naming the SCOPE of its
        # non-gating claim — id-non-gating or arm-non-gating. THIS STEP IS WHERE
        # THAT REQUIREMENT IS LOUD. It cannot be loud in the emitter: raising
        # there needs an escalation path in that body, and the ABSENCE of one is
        # the emitter's class guarantee — the property its header states, ADR-134
        # D3 fixes, and the sibling step above executes against a real failure
        # counter. So the contract is graded statically, here, instead.
        #
        # What rots without it: the defect that motivated the contract was a
        # per-caller fact hardcoded into shared code — one check's gate
        # identifier, plus a check-level enforce-capability claim, appended to
        # every caller's line and therefore wrong for most of them. Nothing
        # structural prevents that returning. Unrun, a caller may omit the
        # posture token (the emitter degrades silently to the class-true clause,
        # by design, so a missing token is INVISIBLE at runtime) or declare a
        # posture its own check_id's behaviour contradicts, and both ship green.
        #
        # The arms that make its zeros usable are its controls: flipping one
        # arm-non-gating site to id-non-gating on a mutated copy must make the
        # contradiction arm report >=1 (sensitivity), dropping one site's third
        # argument must make the census arm report >=1 (sensitivity), and the
        # escalation census over the unmutated tree must be non-empty and must
        # discriminate (specificity), so a zero cannot be an artefact of a census
        # that measured nothing. Denominators are reported, never pinned — a
        # pinned call-site count is a drift alarm, not a conformance gate.
        #
        # Hermetic: no gh, no network. Every region under assertion is extracted
        # from deploy.sh at run time, never pasted. Consumes no workflow event
        # input.
        run: bash core/deploy/tests/test_advisory_emitter_contract.sh

      - name: Run Check 16 status-label invariant fixture self-test (test-status-label-invariant.sh)
        # Invokes core/deploy/tools/tests/test-status-label-invariant.sh, which asserts
        # the four invariants (I1 mutex, I2 presence, I3 proposed+milestone, I4
        # orphaned bundle) across five arms:
        #   0  the gh stub honours --label — prerequisite for C and D, because a
        #      scope-blind stub serves the same population to both fetch shapes and
        #      makes the parity arms read GREEN on the scope defect
        #   A  the real subject under `--check`, asserted as exact issue-number sets
        #   B  a no-op subject through the same harness — A's PASS is subject-caused
        #   C  the real subject under `--report`, asserted for population parity with
        #      A: deploy.sh has TWO Check 16 surfaces and #6165 made them share one
        #      population body after they had silently drifted three ways
        #   D  a MUTATED subject carrying the pre-#6165 inline report block, which C's
        #      comparison must go red against — an unfalsified parity check is the
        #      same defect one layer up
        #
        # What rots without it: the suite EXECUTES deploy.sh Check 16 and asserts
        # against the real emissions of that run. It carries NO copy of Check 16's
        # four inline jq filters — the copies were deleted, and nothing here obliges a
        # future editor to re-create them or to keep any copy "in lockstep". What is
        # lost when nothing runs it is the only thing that can catch Check 16 moving:
        # the assertions bind to the subject's observable output, so they report a
        # drift in the subject only when they are executed against it.
        #
        # WHY THIS JOB and not the closeout-smoke job in release-tooling-smoke.yml,
        # where the sibling release/tools/tests/ suites live. Two reasons stand, the
        # second decisive; a third has been RETIRED and is recorded as retired rather
        # than deleted, because it was once called decisive and a reader who remembers
        # it deserves to know what happened to it:
        #   1. Governed routing. The runtime suite-selection map routes core/deploy/**
        #      to the deploy run: steps in THIS workflow. The narrower row that could
        #      have claimed it globs core/deploy/tools/*.sh, and `*` does not cross `/`,
        #      so it does not reach this tests/ subtree.
        #   2. Genre — DECISIVE. shell-tests is already the established home for
        #      deploy.sh check-fixture-efficacy suites (Checks 22, 31, 36, 39, 45); this
        #      is the Check 16 member of that family. "Close-out automation smoke" is
        #      not, and that is unaffected by anything below.
        #   3. TRIGGER — RETIRED, no longer true. This reason read: release-tooling-
        #      smoke.yml is path-filtered and its filter does NOT list
        #      core/deploy/deploy.sh, so wiring a Check 16 mirror-test there would bind
        #      it to a trigger blind to its own subject. That gap has since been closed
        #      at the source — core/deploy/deploy.sh is now in BOTH of that workflow's
        #      rosters — so the sibling workflow does fire on a deploy.sh edit and this
        #      reason no longer discriminates. Reason 2 alone now carries the placement.
        #      This workflow still carries no paths: filter at all, so every pull
        #      request runs it; that half was never contingent on reason 3.
        #
        # Depends on the "Ensure jq" step above, and that dependency is load-bearing:
        # the suite's jq guard fails CLOSED (exit 1, "0 passed, 1 failed"), so an
        # environment without jq reddens this step instead of reporting a success it
        # never earned. This job installs jq defensively; closeout-smoke only assumes
        # the image ships it.
        #
        # Hermetic: synthetic in-memory fixtures only; no gh, no network, no write to
        # the checkout. Consumes no workflow event input. Gates on exit code.
        run: bash core/deploy/tools/tests/test-status-label-invariant.sh

      - name: Run gate-efficacy declaration conformance ratchet (test_gate_efficacy_declarations.py)
        # Asserts the biconditional that core/standards/gate-efficacy-standard.md
        # Requirement (b) states and that § Verdict-Input Closure makes load-bearing:
        # always-reports=yes <=> no on.<event>.paths, skip-semantics=absent-is-pass <=>
        # a filter is present, the two fields never co-occur, and every workflow carries
        # a gate-efficacy: header at all.
        #
        # WHAT ROTS WITHOUT IT: before this step nothing in the tree asserted that
        # relationship. Outside .github/workflows/, `skip-semantics` occurred in exactly
        # two tracked files — the standard itself, and one gate-efficacy: annotation in
        # deploy.sh — and NOT ONE occurrence was an assertion; every one was prose or a
        # declaration ABOUT the field. A header and a trigger were therefore two
        # independent strings kept in agreement by hand. The change that breaks the
        # invariant — adding a paths: key without touching the header, or deleting one
        # and leaving skip-semantics=absent-is-pass behind — was precisely the change no
        # gate could see, and under absent-is-pass the resulting miss reads as a pass.
        # A one-time measurement is not a ratchet; this step is the ratchet.
        #
        # WHY THIS JOB. The ratchet must NOT be path-filtered. A conformance gate on
        # trigger declarations, hosted behind a trigger filter, would be skippable by
        # the very class of change it polices — the defect reproduced one level up. This
        # workflow carries no paths: filter at all, so the step runs on every pull
        # request. It is a step in an existing job rather than a new job, so it adds no
        # runner and no branch-protection context: the marginal cost is the scan itself.
        #
        # It asserts a SECOND invariant too: that a declaration's reach is the JOB, not
        # the file. A workflow can satisfy the biconditional above — well-formed header,
        # agreeing with its own trigger — while publishing check-runs no header names at
        # all, which is a third class distinct from declared-but-unregistered. The arm is
        # scoped to workflows whose headers already name at least one check-run, because
        # a workflow naming none declares its posture by CONTAINMENT; that scope is the
        # specificity arm made structural. Matrix jobs are resolved to their expanded
        # check-run names first, since a matrix job publishes one check-run per leg.
        #
        # AND A THIRD: that a `posture=required` declaration names `branch-protection`,
        # the only enforcement surface on this host that makes a red verdict block a
        # merge (operator decision D-13). The first two invariants read the trigger and
        # the jobs; neither reads the posture and the enforcement key TOGETHER, so a
        # declaration could claim an enforcement the repository was not delivering and
        # pass every arm. THIS FILE'S OWN HEADER CARRIED EXACTLY THAT DEFECT while
        # hosting the ratchet: it declared `enforcement=ci-enforce` for six contexts
        # that branch protection does in fact require, and the suite running in this
        # very job reported green, because posture/enforcement agreement was the one
        # pairing it never graded. A missing predicate, not a wiring accident.
        #
        # NOT VACUOUS BY CONSTRUCTION, and the harness runs by DEFAULT rather than behind
        # a flag — a falsification harness nothing passes a flag to runs once, at
        # implementation, and certifies nothing thereafter. Every invocation mutates
        # in-memory copies of the LIVE workflow population and requires the detector to
        # react: six sensitivity arms on the header invariant, ONE PER FINDING BRANCH
        # (that arm-per-branch constraint was added after mutation-grading found two
        # branches deletable with the suite still green), a reach arm that mutates a
        # NON-FIRST declaration, two sensitivity arms on the per-job invariant —
        # orphaning a job by renaming its declared context, and breaking one leg of a
        # matrix expansion — and two on the posture invariant, one per graded field
        # (repointing a `required` declaration at a non-blocking surface, and promoting
        # an advisory one to `required` without touching its enforcement), plus a
        # specificity arm for each invariant, on the same non-empty input, that must
        # stay clean. Arms are derived from the live population at run time, never from
        # hardcoded workflow names, so a rename cannot silently empty one, and a
        # partition too small to build an arm is a reported NOSET rather than a skip.
        #
        # Exit contract: 0 clean / 1 declared-vs-actual mismatch / 2 the harness could
        # not assert (fail-closed). Depends on the Ensure PyYAML step above: the trigger
        # read is STRUCTURAL, because a raw-text scan for 'paths:' over-counts comment
        # and run:-body occurrences. It exits 2 rather than guessing if yaml is missing.
        #
        # Hermetic: reads the workflow files, mutates only in-memory copies, writes
        # nothing. No gh, no network. Consumes no workflow event input.
        run: /usr/bin/python3 core/deploy/tests/test_gate_efficacy_declarations.py

  hook-tests:
    name: Hook test harness (macOS)
    # The core/hooks/tests/*.test.sh files + their test-runner.sh exercise the
    # bypass-mode PreToolUse hooks against the DEPLOYED runtime layout — the hooks
    # resolve their allowlist + .mode from ${HOOK_DIR}/.. (co-located, token-
    # resolved). A bare source checkout has no such layout, so this job
    # materializes one in a sandbox via setup-ci-layout.sh, then runs the runner
    # against it as the final gating step. A non-zero runner exit (any test file
    # FAIL) fails this step → fails the job → red CI. Distinct job (not a step)
    # so a hook failure is attributable separately from a deploy-test failure.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure jq
        # jq is the hook dependency (bypass-mode-readiness.md Recovery § "Missing
        # jq"); install defensively so the harness has a known baseline.
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi
          jq --version

      - name: Run hook test harness against materialized deployed layout — gating
        # setup-ci-layout.sh materializes hooks + token-resolved allowlists +
        # sandbox .mode + the test files under a /tmp sandbox .claude/hooks/
        # (R-8: never touches the live ~/Claude/.claude/), and prints the
        # sandbox tests dir on stdout. The runner is the final command, so its
        # exit code gates the job.
        run: |
          TESTS_DIR="$(bash core/hooks/tests/setup-ci-layout.sh)"
          echo "Materialized hook test layout at: ${TESTS_DIR}"
          bash "${TESTS_DIR}/test-runner.sh"

  install-regression:
    name: Install/onboarding/update regression suite (macOS)
    # The standing install/onboarding/update regression suite (#706 / epic #325
    # ticket C8). run-install-regression.sh aggregates the install/onboarding/
    # update deploy-test subset PLUS the #319 hook-test floor behind one verdict
    # and exits non-zero on any failure → red CI. This is the named gate the
    # Stage 9 Phase A5 deployment-readiness checklist reads. Distinct job (not a
    # step in shell-tests/hook-tests) so the standing verdict is attributable as
    # its own required check. Event emission is suppressed (no operator-instance
    # log in CI); the job-exit is the authoritative gate.
    #
    # NOTE (deliberate, vs the Stage 5 spec's "add a paths: filter"): a
    # workflow-level paths: filter would scope ALL jobs in this shared file,
    # narrowing the unconditional shell-tests + hook-tests (#319) triggers — a
    # behavior change to #319's wiring this change must not make. GitHub paths:
    # is workflow-level only, and no per-job path-gate action is in this repo's
    # approved posture, so the suite runs unconditionally on PR/push to main like
    # its sibling jobs. The path-scoping optimization is intentionally deferred.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure jq
        # Shared dependency of the install/deploy harness + the hook floor.
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi
          jq --version

      - name: Run standing install/onboarding/update regression suite — gating
        # The aggregating entrypoint owns the member list (REGRESSION_MEMBERS +
        # the hook floor), so this is a single step. Its non-zero exit on any
        # member failure fails the job → red CI. PMO_REGRESSION_EMIT=0 disables
        # the test-run event emission (CI has no operator-instance event log).
        env:
          PMO_REGRESSION_EMIT: '0'
        run: bash core/deploy/tests/run-install-regression.sh

      - name: Precision probe — a broken fixture MUST fail the suite
        # Gate-honesty proof (modeled on release-tooling-smoke.yml): a deliberately
        # FAILING member must make the runner exit non-zero. Built in a throwaway
        # tree; the real checkout is never mutated. If a failing member stops
        # reddening the gate, this step fails the PR.
        env:
          PMO_REGRESSION_EMIT: '0'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/core/deploy/tests" "$tmp/core/hooks/tests"
          echo "v0.0-probe" > "$tmp/.version"
          # A single always-FAIL member.
          cat > "$tmp/core/deploy/tests/test_broken_fixture.sh" <<'PROBE'
          #!/usr/bin/env bash
          printf '  FAIL: deliberately-broken fixture (precision probe)\n'
          printf 'test_broken_fixture.sh: 0 passed, 1 failed (probe)\n'
          exit 1
          PROBE
          chmod +x "$tmp/core/deploy/tests/test_broken_fixture.sh"
          # A stub hook floor that PASSES, so the probe isolates the broken member.
          cat > "$tmp/core/hooks/tests/setup-ci-layout.sh" <<'STUB'
          #!/usr/bin/env bash
          d="$(mktemp -d)"; mkdir -p "$d/.claude/hooks/tests"
          cat > "$d/.claude/hooks/tests/test-runner.sh" <<'INNER'
          #!/usr/bin/env bash
          echo "AGGREGATE: PASS=1  FAIL=0"
          exit 0
          INNER
          chmod +x "$d/.claude/hooks/tests/test-runner.sh"
          echo "$d/.claude/hooks/tests"
          STUB
          chmod +x "$tmp/core/hooks/tests/setup-ci-layout.sh"
          : > "$tmp/core/hooks/tests/test-runner.sh"
          chmod +x "$tmp/core/hooks/tests/test-runner.sh"
          # Probe runner: a copy whose manifest is ONLY the broken fixture.
          sed -e 's#^REGRESSION_MEMBERS=(.*#REGRESSION_MEMBERS=(#' \
              -e '/^REGRESSION_MEMBERS=($/a\
            "test_broken_fixture.sh"
          ' core/deploy/tests/run-install-regression.sh \
            | sed '/^  "test_sandbox_roots.sh"/d;/^  "test_install_end_to_end.sh"/d;/^  "test_deploy_sandbox.sh"/d;/^  "test_upgrade_config_durability.sh"/d;/^  "test_install_exit_propagation.sh"/d;/^  "test_detect_install_path_spaces.sh"/d;/^  "test_lib_composition.sh"/d' \
            > "$tmp/core/deploy/tests/run-install-regression.sh"
          chmod +x "$tmp/core/deploy/tests/run-install-regression.sh"
          set +e
          PMO_REGRESSION_EMIT=0 bash "$tmp/core/deploy/tests/run-install-regression.sh" >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::run-install-regression.sh returned 0 with a deliberately-broken member; the regression gate is not detecting failures."
            exit 1
          fi
          echo "Precision probe OK — broken fixture correctly failed the suite (exit $rc)."

  cross-platform:
    name: Cross-platform install/QA (${{ matrix.os }})
    # #304 (v3.91): the cross-platform install/QA regression matrix. The three
    # jobs above gate the macOS bash install path; THIS job gates the PORTABLE
    # surface across macOS + Linux + Windows — #299's QA-as-code suite (./qa.sh /
    # python -m qa) and #303's Windows entry-points (install.ps1 / update.ps1
    # -DryRun).
    #
    # TIERED, not symmetric (the load-bearing gate-honesty decision): deploy.sh is
    # macOS-only by platform design (BSD stat -f / md5) and the bash deploy-test
    # suites self-skip on non-Darwin, so a symmetric 3-OS matrix would go
    # VACUOUSLY GREEN (a check that asserts nothing). Each leg runs ONLY what
    # genuinely exercises on that OS:
    #   macOS   (full)     — ./qa.sh + the pytest-free qa-module self-test + the
    #                        FULL Phase-5 non-repo-root update (#382 regression).
    #   Linux   (portable) — ./qa.sh + the pytest-free qa-module self-test + the
    #                        DryRun/portable non-repo-root update (update.sh
    #                        --dry-run).
    #   Windows (pwsh)     — install.ps1 -DryRun + python -m qa + update.ps1
    #                        -DryRun from a non-repo-root cwd + a broken-fixture
    #                        precision probe (the Windows gate MUST redden on a
    #                        defect).
    # The Linux/Windows legs are the honest v1 portable tier; they EXPAND as
    # deploy.sh OS-portability (#342 / #44) + orchestrate.sh phase decomposition
    # (#301) land under milestones #47 / #48.
    #
    # CIAC-2: ./qa.sh (POSIX legs) AND install.ps1 (Windows leg) are both
    #         exercised across the three OSes (grep-resolvable in this file).
    # CIAC-3: the update flow runs from a NON-repo-root cwd on every OS — full
    #         Phase-5 on macOS, DryRun/portable on Linux/Windows.
    #
    # fail-fast: false so one OS's failure never masks the others' verdicts.
    #
    # Security: like the jobs above, this job consumes NO untrusted github.event.*
    # inputs; every run: block is a static invocation on workspace files only.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # #303 opt-in relaxation of the two non-Darwin gates (setup-workspace.sh
      # check_platform + validate-install.sh). A no-op on macOS (both gates only
      # fire when uname != Darwin); it lets the Linux leg's update flow proceed.
      PMO_ALLOW_NON_DARWIN: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # --- POSIX legs (macOS + Linux): #299 QA-as-code ---
      - name: QA-as-code suite — ./qa.sh (POSIX)
        if: runner.os != 'Windows'
        run: ./qa.sh

      - name: QA-module registry self-test — pytest-free (POSIX)
        # test_qa_module.py self-runs its test_* functions when executed directly
        # (no pytest needed) — the runner may not have pytest installed.
        if: runner.os != 'Windows'
        run: python3 core/deploy/tests/test_qa_module.py

      # --- macOS leg: full Phase-5 non-repo-root update (#382 / CIAC-3 full) ---
      - name: Update from a non-repo-root cwd — full Phase 5 (macOS)
        # test_update_nonrepo_root_cwd.sh drives the real setup-workspace.sh +
        # deploy.sh Phase 5 (Darwin-only); it sandboxes via --workspace-root /
        # --config-root and never touches the live ~/.claude (R-8).
        if: runner.os == 'macOS'
        run: bash core/deploy/tests/test_update_nonrepo_root_cwd.sh

      # --- Linux leg: DryRun/portable non-repo-root update (CIAC-3 portable) ---
      - name: Update from a non-repo-root cwd — DryRun/portable (Linux)
        # deploy.sh is macOS-only, so the Linux update path is the DryRun proxy:
        # update.sh --dry-run reaches Phase 5 (dry-run) WITHOUT invoking deploy.sh.
        # Asserts it completes from a NON-repo-root cwd (exit 0/64) with the
        # repo-root guard SILENT — the #382 cross-OS assertion. PMO_ALLOW_NON_DARWIN
        # (job env) relaxes the Phase-5c setup-workspace.sh platform gate.
        #
        # THE SANDBOX IS INSTALLED BEFORE IT IS UPDATED, and that is a precondition
        # rather than a convenience. update.sh is a MAINTENANCE tool: it regenerates
        # and refreshes an existing install and can never create one — Phase 3 says so
        # itself, once per absent target ("fresh install needed via setup-workspace.sh").
        # Pointing it at a bare `mkdir` directory asks it to maintain a workspace that
        # was never installed, and the verdict it returns is about that, not about cwd.
        # The macOS sibling for this same #382 property
        # (core/deploy/tests/test_update_nonrepo_root_cwd.sh) has always run a real
        # setup-workspace.sh first, in a step whose own comment gives the reason —
        # "so update.sh reaches Phase 5 with real targets". This leg was written as an
        # inline shortcut that skipped it, and nothing observed the omission until the
        # install-completeness gate started reporting an incomplete install as
        # incomplete. The gate is right; the fixture was not.
        #
        # It seeds the HOOK-TIER composition surfaces specifically, because those are
        # what the completeness gate is scoped to: a hook-tier surface is the escape
        # half of a security control whose enforcement half Phase 5c installs, so an
        # absent one is a real asymmetry. Instance-tier surfaces are operator data with
        # no paired enforcement half and are correctly out of that scope. Seeding stays
        # inside the portable tier this leg is declared to be — it does NOT run the
        # macOS-only installer, which is the OS-portability work deferred to #342 / #44.
        #
        # The seed is DERIVED FROM THE MANIFEST, never a copied list of filenames. The
        # manifest's own contract is that adding a surface costs one row and no other
        # code change; a hardcoded list here would break that quietly, by under-seeding
        # a surface added later and reddening this leg for a reason that has nothing to
        # do with what it tests.
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          sbx="$(mktemp -d)"
          mkdir -p "$sbx/ws/.claude" "$sbx/cfg" "$sbx/home" "$sbx/nonrepo"
          {
            printf '%s\n' '[meta]' 'schema_version = 1' 'managed_by = "pmo-platform"'
            printf '%s\n' '[identity]' 'operator_name = "CI Operator"'
            printf '%s\n' 'operator_email = "ci@example.com"' 'operator_git_email = "ci@example.com"'
            printf '%s\n' 'operator_github = "ci-handle"' 'operator_phone = ""'
            printf '%s\n' 'operator_role_title = "CI"' 'operator_organization = "CI"'
            printf '%s\n' '[paths]'
            printf 'claude_workspace_root = "%s/ws"\n' "$sbx"
            printf 'operator_homedir_path = "%s/home"\n' "$sbx"
            printf '%s\n' 'cowork_install_path = "/tmp/ci-cowork"' 'pmo_platform_repo_name = "pmo-platform"'
            printf '%s\n' '[platform]' 'work_board = "github"' 'comms_platform = ""'
          } > "$sbx/cfg/operator.toml"
          chmod 600 "$sbx/cfg/operator.toml"
          # Seed the hook-tier composition surfaces from the shared manifest — the
          # same array update.sh and setup-workspace.sh both source, so this fixture
          # cannot drift from the population the completeness gate reads. Copying the
          # real source file rather than touching an empty one keeps Phase 3's
          # regeneration comparison meaningful.
          . "$GITHUB_WORKSPACE/core/deploy/composition-surface-manifest.sh"
          seeded=0
          for entry in "${COMPOSITION_SURFACE_FILES[@]}"; do
            src="${entry%%|*}"
            rest="${entry#*|}"
            [ "${rest%%|*}" = "hook" ] || continue
            cp "$GITHUB_WORKSPACE/$src" "$sbx/ws/.claude/$(basename "$src")" || {
              echo "::error::could not seed hook-tier surface $src into the sandbox"
              exit 1
            }
            seeded=$((seeded + 1))
          done
          # Anti-vacuity: a manifest that sourced to nothing would seed nothing, and
          # the step would then fail at the completeness gate for a reason that looks
          # like a product defect. Fail here instead, where the cause is legible.
          if [ "$seeded" -eq 0 ]; then
            echo "::error::seeded 0 hook-tier composition surfaces; the manifest resolved to an empty population, so this leg would assert nothing about the update flow"
            exit 1
          fi
          echo "Seeded $seeded hook-tier composition surface(s) into the sandbox."
          cd "$sbx/nonrepo" || exit 1
          set +e
          out="$(bash "$GITHUB_WORKSPACE/update.sh" --dry-run --workspace-root "$sbx/ws" --config-root "$sbx/cfg" 2>&1)"
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 64 ]; then
            echo "::error::update.sh --dry-run from a non-repo-root cwd exited $rc (expected 0 or 64) on $(uname -s)"
            exit 1
          fi
          # Here-string, not `printf | grep -qF`: grep -q stops at its first match, so
          # piped it is a short-circuiting reader whose early exit breaks the writer's
          # pipe, and under pipefail the writer's failure becomes the pipeline's — a
          # MATCH would report non-zero and this guard would read "guard silent" while
          # the guard had in fact fired. It is a size latch that only closes once $out
          # exceeds pipe capacity, and seeding the sandbox grows $out, so this moves
          # toward it rather than away. A here-string has no writer to signal.
          if grep -qF -- "Must run from pmo-platform repo root" <<<"$out"; then
            echo "::error::repo-root guard fired from a non-repo-root cwd -- #382 partial-update regression on $(uname -s)"
            exit 1
          fi
          echo "Linux non-repo-root update DryRun OK (exit $rc; repo-root guard silent)."

      # --- Windows leg: #303 entry-points (pwsh) ---
      - name: Windows install DryRun — install.ps1 (CIAC-2)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -DryRun

      - name: QA-as-code module — python -m qa (Windows)
        # Windows uses `python` (python3 is not reliably aliased) and the qa
        # module directly (qa.sh's bash shebang + python3 coupling is POSIX-only).
        #
        # HOME shim (the #303 Windows compose.py invocation contract): the qa
        # suite's F4 check drives compose.py resolve_tokens, which reads $HOME
        # (compose.py:152) to self-heal [OPERATOR_HOMEDIR_PATH]. On Windows $HOME
        # is unset (%USERPROFILE% is the home var), so — exactly as
        # lib-dryrun-proxy.ps1 Get-PmoHome does before every Windows compose.py
        # call — set HOME to the user profile first. Without this, F4 fails with
        # "resolve_tokens left unresolved: [OPERATOR_HOMEDIR_PATH]". The durable
        # fix (compose.py falling back to %USERPROFILE%) is owned by the deferred
        # native-Windows arc (#47 / #48); this shim mirrors #303's call sites.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $profileHome = [System.Environment]::GetFolderPath('UserProfile')
          if ([string]::IsNullOrEmpty($profileHome)) { $profileHome = $env:USERPROFILE }
          $env:HOME = $profileHome
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/core/deploy"
          python -m qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Update from a non-repo-root cwd — DryRun (Windows / CIAC-3)
        # update.ps1 anchors on $PSScriptRoot, so it must run cleanly from a
        # non-repo-root cwd (the PowerShell analog of the #382 cwd fix).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE/update.ps1" -DryRun

      - name: Precision probe — a broken Windows fixture MUST fail install.ps1 -DryRun
        # Gate-honesty proof (DD-5; modeled on the install-regression precision
        # probe above): run install.ps1 -DryRun against a deliberately-broken clone
        # (its lib present so the DryRun contract runs, but .version + compose.py
        # OMITTED so the preflight + compose round-trip fail). If the DryRun proxy
        # ever went vacuous (always exit 0), this step reddens the PR.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'   # do not throw on the child's non-zero exit
          $broken = Join-Path $env:RUNNER_TEMP ("broken-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path (Join-Path $broken "core/deploy") -Force | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/install.ps1" (Join-Path $broken "install.ps1")
          Copy-Item "$env:GITHUB_WORKSPACE/core/deploy/lib-dryrun-proxy.ps1" (Join-Path $broken "core/deploy/lib-dryrun-proxy.ps1")
          pwsh -NoProfile -File (Join-Path $broken "install.ps1") -DryRun
          $probeExit = $LASTEXITCODE
          if ($probeExit -eq 0) {
            Write-Output "::error::install.ps1 -DryRun exited 0 on a deliberately-broken fixture (missing .version + compose.py); the Windows DryRun gate is vacuous."
            exit 1
          }
          Write-Output "Precision probe OK — broken Windows fixture correctly failed install.ps1 -DryRun (exit $probeExit)."
          exit 0
