name: Security

# gate-efficacy: posture=required  enforcement=branch-protection:"Workflow SAST (actionlint)","Python SAST (bandit)","Python deps (pip-audit)","Secret scanning (gitleaks)"  always-reports=yes
#   invariant: no workflow-injection / Python-SAST finding, no vulnerable pinned
#              dependency, and no committed secret — asserted by running the SAST
#              and secret-scanning tools over repository content.
#   falsification: commit a high-entropy AWS-key-shaped string -> the gitleaks job
#                  fails; add an actionlint-flagged injection pattern -> actionlint fails.
# (Posture realized per core/standards/gate-efficacy-standard.md Requirement (b).)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  actionlint:
    name: Workflow SAST (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          # actionlint binary installer (upstream-recommended path)
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.1
          ./actionlint -version
      - name: Run actionlint
        # The -ignore flag suppresses shellcheck SC2016 propagation from
        # pr-body-parser-clean.yml. Single-quoted regex anchors (`'^...$'`) are
        # intentional — the trailing `$` is an end-of-line regex anchor, not an
        # unexpanded variable. actionlint v1.7.1 does NOT support the `paths`
        # config schema, so .github/actionlint.yaml is forward-compatible
        # documentation only; the runtime -ignore flag is the load-bearing
        # suppression on the current v1.7.1 pin.
        run: |
          ./actionlint -color -ignore 'shellcheck reported issue in this script: SC2016:.+'

  bandit:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install bandit==1.7.10
      - name: Run bandit
        run: |
          # v2 layout: Python files live in core/deploy/tools/, release/tools/, release/skills/pmo-skill-refiner/scripts/
          # Scan all directories containing Python files; bandit -r walks recursively.
          bandit -r core/ release/ --severity-level high --confidence-level medium

  semgrep:
    name: Custom SAST (semgrep template-context-XSS)
    # gate-efficacy: posture=required  enforcement-surface=branch-protection:"Custom SAST (semgrep template-context-XSS)"  always-reports=yes
    #   invariant: no serialized/untrusted data reaches an inline-<script> template placeholder
    #              or a raw-HTML DOM sink without context-aware encoding or a reviewed
    #              nosemgrep: <rule-id> -- xss-sink-reviewed annotation -- asserted by running the
    #              custom template-context-XSS ruleset (R1 transport-taint / R2 raw-HTML DOM sink /
    #              R3 script-context placeholder) over the HTML-emitting surface.
    #   falsification: revert generate_review.py's < > & escape chain, OR add a new un-annotated
    #                  raw-HTML sink assignment / script-context placeholder -> the semgrep job fails.
    #   posture note: posture=required records intent per gate-efficacy-standard.md Requirement (b);
    #                 the branch-protection required-set registration + the file-level header list
    #                 above are an operator repo-settings action (Stage 12), reconciled by audit.
    # (Posture realized per core/standards/gate-efficacy-standard.md Requirement (b).)
    runs-on: ubuntu-latest
    env:
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # setuptools pinned so pkg_resources resolves: semgrep 1.136.0 imports it (via
      # opentelemetry.instrumentation), and GitHub's py3.12 runner image no longer
      # pre-installs setuptools; 75.8.2 still ships pkg_resources (removed in 81+).
      - run: pip install semgrep==1.136.0 setuptools==75.8.2
      - name: Rule self-test (positive control -- rules fire RED on the vulnerable fixtures)
        run: semgrep --test --config core/security/semgrep/rules/ core/security/semgrep/tests/
      - name: Run custom template-context-XSS ruleset (blocking)
        # Scan scope = the HTML-emitting surface (all five generate_* / *.html emitters).
        # The tests/ fixtures live under core/security/semgrep/tests/ (outside this scope) so
        # the deliberately-vulnerable fixture never reddens the blocking scan; it is exercised
        # only by the --test positive control above.
        run: >-
          semgrep scan --error --strict
          --config core/security/semgrep/rules/
          release/skills/pmo-skill-refiner/ core/deploy/tools/

  pip-audit:
    name: Python deps (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.7.3
      - name: Run pip-audit
        run: |
          # v2 layout adaptation: no requirements.txt at any standard path (verified at Stage 6
          # via gh api recursive tree query — no pyproject.toml / setup.py / setup.cfg / Pipfile /
          # requirements*.txt at root or any subdir).
          # Discover any requirements*.txt / pyproject.toml that may land in future commits.
          # When none exists (v2 ships stdlib-only Python tooling) the repo DECLARES nothing to
          # audit, so skip — do NOT audit the runner's ambient env (it only flags the CI toolchain's
          # own pip/setuptools, unrelated to what pmo-platform ships, making this required gate a
          # perpetual false-red that blocks every PR merge).
          REQS=$(find . -type f \( -name "requirements*.txt" -o -name "pyproject.toml" \) -not -path "./.git/*" 2>/dev/null || true)
          if [ -n "$REQS" ]; then
            echo "Discovered manifests:"
            echo "$REQS"
            for req in $REQS; do
              if echo "$req" | grep -q "requirements"; then
                echo "Auditing $req"
                pip-audit --requirement "$req" --strict
              fi
            done
          else
            echo "::notice::No Python dependency manifest in the repo (no requirements*.txt / pyproject.toml) — nothing to audit; skipping."
            exit 0
          fi

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Run gitleaks (full history)
        run: gitleaks detect --source . --no-banner --redact --verbose

  hook-dep-hardening:
    name: Hook dependency fail-closed (GHSA-9cjm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert no jq fail-open drift in security hooks
        # Guards GHSA-9cjm-v22x-4x33: no hook may hard-code /usr/bin/jq or carry the
        # legacy blanket fail-open — jq is resolved via lib/dep-resolve.sh and a
        # missing jq fails closed (enforce) or degrades per mode.
        run: bash core/hooks/tests/check-hook-dep-hardening.sh

  eval-viewer-security:
    name: Eval-viewer security (GHSA-fxcr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Symlink-read / PII-redaction / CSRF regression
        # Guards GHSA-fxcr-7x63-3g94: the eval-viewer generator must confine file reads
        # to the workspace root, cap + redact embedded output, and gate POST
        # /api/feedback behind a loopback Host + same-origin Origin + per-run CSRF token.
        # #3408 (milestone #271) extends eval-viewer CI with the GHSA-rw36 XSS tests.
        run: python3 release/skills/pmo-skill-refiner/eval-viewer/test_generate_review.py
