name: Skill license check

# gate-efficacy: posture=advisory  enforcement=path-filtered  skip-semantics=absent-is-pass
#   invariant: every .skill package carries the canonical BSL LICENSE member —
#              asserted by check-skill-licenses.py over the changed packages.
#   falsification: on a PR touching packages/**, strip the LICENSE from a .skill ->
#                  this gate fails; on a PR touching no package path it is skipped
#                  and absence is treated as pass.
# Path-filtered (paths: packages/**), so ADVISORY by skip-semantics. (Per gate-efficacy-standard.md (b).)

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'release/skills/pmo-skill-refiner/scripts/package_skill.py'
      - 'release/tools/check-skill-licenses.py'
      - '.github/workflows/skill-license-check.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'release/skills/pmo-skill-refiner/scripts/package_skill.py'
      - 'release/tools/check-skill-licenses.py'
      - '.github/workflows/skill-license-check.yml'

permissions:
  contents: read

jobs:
  license-check:
    name: Verify BSL LICENSE in every .skill package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run skill-package license checker
        run: python3 release/tools/check-skill-licenses.py
