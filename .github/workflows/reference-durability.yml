name: Reference durability

# gate-efficacy: posture=required  enforcement=branch-protection:"Durable-corpus fragile-reference delta"  always-reports=yes
#   invariant: no durable-corpus change adds a fragile reference (markdown link
#              sequence, version-cutover apparatus, mis-placed/empty bare issue
#              ref, or raw github.com issue/pull/milestone URL) on its added lines.
#   falsification: add a markdown link sequence or a version-cutover clause to a
#                  durable-corpus file in a PR -> this gate turns red on that line.
# (Posture realized per core/standards/gate-efficacy-standard.md Requirement (b).)

# Runs on EVERY pull request (no paths filter), so this required status check always
# reports a result and never blocks a PR as required-but-absent. The job's internal
# is_durable() predicate selects which changed files to scan, so a PR that changes no
# durable-corpus file completes as a clean empty scan and passes; durable-corpus PRs
# scan identically. Scans ONLY added lines (the net-new delta), so pre-existing corpus
# rot does not fail an unrelated PR. Drops the `edited` trigger (a PR-body-only edit
# never touches a durable file), avoiding the shared-release-PR double-run that the
# parser-clean workflow incurs. Enforces the reference-durability standard: Class L
# (markdown links), Class V (version-cutover apparatus), and the positional
# issue-reference rule. Class U (raw github.com/.../{issues,pull,milestone} URLs) ships
# WARN-MODE-INITIAL — it is reported in the run summary but does not fail the PR until
# the operator's flip-to-enforce at a Stage 13 close (the ref-permitted ledger surfaces
# are categorically exempt via is_ledger_exempt).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  reference-durability:
    name: Durable-corpus fragile-reference delta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base commit for the added-lines delta

      - name: Detector precision probe (fixture self-test)
        run: |
          set -euo pipefail
          # Per the CDF-2 amendment: a warn-log is blind to false negatives, so the
          # detector's precision is gated on a checked-in fixture with a labeled
          # expected-match set. A fixture regression fails the PR — the detector is broken.
          if [ -x core/hooks/run-fragile-ref-fixtures.sh ] && [ -f core/hooks/testdata/cutover-fixtures.txt ]; then
            core/hooks/run-fragile-ref-fixtures.sh core/hooks/testdata/cutover-fixtures.txt
          else
            echo "::warning::reference-durability fixture probe unavailable (missing runner or fixture)"
          fi

      - name: Scan added durable-corpus lines for net-new fragile refs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Detectors — byte-identical to core/hooks/block-fragile-refs.sh.
          LINK_RE='\]\('
          CUTOVER_RE='v[0-9]+\.[0-9]+[a-z]?(-[a-z0-9-]+)?[^.\n]{0,40}merge SHA|v[0-9]+\.[0-9]+[a-z]?(-[a-z0-9-]+)?([[:space:]]+(release|itself|is))*[[:space:]]+(is[[:space:]]+)?exempt|([Aa]pplies to releases|[Cc]utover[[:space:]]+(applies|discipline|per))[^.\n]{0,80}v[0-9]+\.[0-9]+|reflexive-pipeline-loop'
          URL_RE='github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/(issues|pull|milestone)s?([/#?]|$)'
          REFBLOCK_RE='^#{1,6}[[:space:]]+([Ii]ssue [Rr]eferences|[Rr]eferences|[Pp]rovenance|[Ss]ources?)[[:space:]]*:?[[:space:]]*$'
          ISSUEREF_RE='#\[?[0-9]+\]?'
          ALLOWLIST='core/hooks/reference-durability-allowlist.txt'
          # Shared positional-issue-ref classifier (single source of the positional
          # decision; the hook and the fixture-runner invoke this same file via `awk -f`).
          # The CI was the surface that drifted (position-blind existence check); routing
          # the decision through this lib is what fixes it and keeps it from re-drifting.
          POSITIONAL_LIB='core/hooks/lib/positional-issueref.awk'

          # map_added_lines — diff-hunk -> file-line mapper. Reads a `git diff` on stdin and
          # emits "<TRUE_FILE_LINE>\t<CONTENT>" for each ADDED ('+') line, computing the line
          # position in the NEW file from each `@@ -a,b +c,d @@` hunk header. This is the fix
          # for the real bug: the previous CI compared an added-DELTA-line index (its awk NR)
          # against a head-file line number (REFBLOCK_LINE) — two different coordinate spaces.
          # The mapper puts added lines into true-file-line space so the comparison is valid.
          # Lines inside fenced code blocks are NOT emitted (detectors must not fire on fenced
          # example content) but still advance the counter (a fenced line occupies a file line),
          # so positions stay aligned with the head-file REFBLOCK_LINE.
          map_added_lines() {
            awk '
              /^@@/ {
                m = $0
                sub(/^@@ -[0-9]+(,[0-9]+)? \+/, "", m)
                split(m, a, /[ ,]/)
                newline = a[1] + 0
                in_hunk = 1
                fence = 0
                next
              }
              in_hunk && /^\+\+\+/ { next }
              in_hunk && /^\+/ {
                content = substr($0, 2)
                if (content ~ /^[[:space:]]*```/) { fence = !fence; newline++; next }
                if (!fence) { printf "%d\t%s\n", newline, content }
                newline++
                next
              }
              in_hunk && /^-/ { next }
              in_hunk && /^ /  { newline++; next }
            '
          }

          # Durable-corpus path predicate (mirrors the hook scope gate).
          is_durable() {
            case "$1" in
              core/rules/*.md|core/standards/*.md|core/specs/*.md|core/disciplines/*.md|core/schemas/*.md) return 0 ;;
              release/references/*.md|release/governance/*.md|release/standards/*.md|release/specs/*.md|release/schemas/*.md) return 0 ;;
              */skills/*/SKILL.md|skills/*/SKILL.md) return 0 ;;
              */skills/*/references/*.md|skills/*/references/*.md) return 0 ;;
              release/releases/plans/*_RELEASE_PLAN.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Ledger-surface exemption predicate (Class U scope guard). The ref-permitted
          # ledger surfaces (the five named in the universal-vs-release-pipeline split
          # rule) are categorically exempt from the raw-URL class — a ledger URL is native
          # provenance there, exactly like the release/releases/* exemption the
          # repo-integrity gates carry. is_durable() already excludes release/releases/*
          # and top-level CHANGELOG.md (neither matches a durable glob), so at today's
          # scope this predicate is defense-in-depth + self-documentation: it stays the
          # active Class-U guard if raw-URL scanning is ever widened beyond is_durable().
          is_ledger_exempt() {
            case "$1" in
              release/releases/*) return 0 ;;
              CHANGELOG.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Path-allowlist predicate (glob-per-line; trailing slash = directory).
          is_allowlisted() {
            local f="$1" g
            [ -f "$ALLOWLIST" ] || return 1
            while IFS= read -r g || [ -n "$g" ]; do
              g="${g%%#*}"; g="$(printf '%s' "$g" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              [ -z "$g" ] && continue
              case "$g" in
                */) case "$f" in *"$g"*) return 0 ;; esac ;;
                *)  case "$f" in "$g"|*"/$g") return 0 ;; esac ;;
              esac
            done < "$ALLOWLIST"
            return 1
          }

          # Changed durable files in this PR.
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" -- '*.md' 2>/dev/null || true)

          FOUND=0
          REPORT=""
          URL_FOUND=0      # Class U is warn-mode-initial — tracked separately from FOUND
          URL_REPORT=""

          for f in "${CHANGED[@]}"; do
            [ -z "$f" ] && continue
            is_durable "$f" || continue
            is_allowlisted "$f" && continue
            [ -f "$f" ] || continue   # deleted file — nothing to scan

            # Per-file override markers (whole-file, on the head version).
            ALLOW_LINK=0; ALLOW_VERSION=0; ALLOW_URL=0
            grep -qE '<!--[[:space:]]*reference-durability:[[:space:]]*allow-link[[:space:]]*-->' "$f" && ALLOW_LINK=1
            grep -qE '<!--[[:space:]]*reference-durability:[[:space:]]*allow-version-ref[[:space:]]*-->' "$f" && ALLOW_VERSION=1
            grep -qE '<!--[[:space:]]*reference-durability:[[:space:]]*allow-url[[:space:]]*-->' "$f" && ALLOW_URL=1

            # Added lines for this file, mapped to TRUE file-line numbers ("<line>\t<content>"),
            # fenced code excluded. ADDED_MAPPED carries the positions the positional rule needs;
            # ADDED is the content-only projection the Class L / Class V grep detectors use (their
            # behavior is unchanged — they never needed line numbers).
            ADDED_MAPPED="$(git diff "$BASE_SHA"..."$HEAD_SHA" -- "$f" | map_added_lines)"
            [ -z "$ADDED_MAPPED" ] && continue
            ADDED="$(printf '%s\n' "$ADDED_MAPPED" | sed 's/^[0-9]*\t//')"

            # locate a reference-block header in the head file (block-relative positional rule)
            REFBLOCK_LINE="$(grep -nE "$REFBLOCK_RE" "$f" | head -1 | cut -d: -f1 || true)"
            [ -z "$REFBLOCK_LINE" ] && REFBLOCK_LINE=0

            if [ "$ALLOW_LINK" -eq 0 ]; then
              LM="$(printf '%s\n' "$ADDED" | grep -nE "$LINK_RE" || true)"
              if [ -n "$LM" ]; then
                FOUND=1
                REPORT="${REPORT}### ${f} — Class L (markdown link)"$'\n''```'$'\n'"${LM}"$'\n''```'$'\n'
              fi
            fi
            if [ "$ALLOW_VERSION" -eq 0 ]; then
              VM="$(printf '%s\n' "$ADDED" | grep -nE "$CUTOVER_RE" || true)"
              if [ -n "$VM" ]; then
                FOUND=1
                REPORT="${REPORT}### ${f} — Class V (version-cutover apparatus)"$'\n''```'$'\n'"${VM}"$'\n''```'$'\n'
              fi
            fi

            # Class U — raw ledger URL (WARN-MODE-INITIAL). Suppressed by the allow-url
            # marker OR by ledger-surface exemption. Findings accumulate into a SEPARATE
            # warn report and deliberately do NOT set FOUND=1 — Class U is reported in the
            # run summary but does not fail the PR until the operator's flip-to-enforce.
            # Uses the content-only ADDED projection (Class U needs no line numbers), so it
            # composes unchanged with the shared-classifier positional rule below.
            if [ "$ALLOW_URL" -eq 0 ] && ! is_ledger_exempt "$f"; then
              UM="$(printf '%s\n' "$ADDED" | grep -nE "$URL_RE" || true)"
              if [ -n "$UM" ]; then
                URL_FOUND=1
                URL_REPORT="${URL_REPORT}### ${f} — Class U (raw github.com/.../{issues,pull,milestone} URL)"$'\n''```'$'\n'"${UM}"$'\n''```'$'\n'
              fi
            fi

            # Positional issue-reference rule via the SHARED classifier (the exact file the
            # hook and fixture-runner invoke). Feed the file-line-mapped added lines and the
            # head-file REFBLOCK_LINE: a ref ABOVE the block (or with no block) flags
            # OUTSIDE-BLOCK; a bare ref in-block flags CONTENT-FREE-IN-BLOCK; a self-describing
            # ref BELOW the block stays clean. This replaces the previous position-blind
            # existence check (`hasblock == 0`) — the divergence the hook caught and the CI
            # missed — and routing through the lib guarantees hook⇄CI agreement going forward.
            IM="$(printf '%s\n' "$ADDED_MAPPED" \
              | awk -f "$POSITIONAL_LIB" \
                  -v issuere="$ISSUEREF_RE" -v refline="$REFBLOCK_LINE" -v minwords=3 \
              || true)"
            if [ -n "$IM" ]; then
              FOUND=1
              REPORT="${REPORT}### ${f} — issue-reference placement"$'\n''```'$'\n'"${IM}"$'\n''```'$'\n'
            fi
          done

          # Class U — raw ledger URL findings (WARN-MODE-INITIAL): reported in the run
          # summary but NON-FAILING. Emitted regardless of FOUND so the warning surfaces
          # even on a PR that otherwise passes the enforcing classes. Flip-to-enforce
          # (move Class U into the FOUND/exit-1 path) follows the bypass-mode-readiness.md
          # Shakedown -> Enforce ladder at an operator-signed Stage 13 close.
          if [ "$URL_FOUND" -eq 1 ]; then
            {
              echo "## :warning: Reference durability — Class U (raw ledger URL) — WARN-MODE (not blocking)"
              echo ""
              echo "Net-new raw \`github.com/.../{issues,pull,milestone}\` URL(s) on added lines in durable-corpus files."
              echo "A raw ledger URL is durability-ladder rung-6 — it rots on any repository move or migration."
              echo ""
              printf '%s\n' "$URL_REPORT"
              echo "### Remediation"
              echo ""
              echo "- Summarize the referenced content inline (durability-ladder rung 1-2) rather than linking the URL."
              echo "- The ref-permitted ledger surfaces (RELEASE_LOG / RELEASE_INDEX / RELEASE_DIGEST / RELEASE_NOTES / CHANGELOG) are categorically exempt."
              echo "- Override for a durable file that genuinely needs a raw ledger URL: add \`<!-- reference-durability: allow-url -->\` anywhere in the file."
              echo ""
              echo "This class is warn-mode-initial — reported but not blocking until flip-to-enforce. See \`core/standards/reference-durability-standard.md\`."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo ":white_check_mark: Reference durability — no net-new fragile references in durable corpus (enforcing classes L/V/issue-ref)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## :x: Reference durability check FAILED"
            echo ""
            echo "Net-new fragile reference(s) on added lines in durable-corpus files."
            echo "These constructs break on the events the platform performs (renumber, migration, history rewrite)."
            echo ""
            printf '%s\n' "$REPORT"
            echo "### Remediation"
            echo ""
            echo "- **Class L (links):** summarize the linked content inline (durability-ladder rung 1-2); name the file by its content rather than linking a path."
            echo "- **Class V (version-cutover apparatus):** state the rule unconditionally — remove the version-cutover clause from durable rule text."
            echo "- **Issue-reference placement:** confine a bare issue reference to a designated reference block (an 'Issue References' / 'References' / 'Provenance' / 'Sources' heading) and pair it with an inline summary."
            echo ""
            echo "See \`core/standards/reference-durability-standard.md\`."
            echo ""
            echo "### Override (an unavoidable provenance link or version reference)"
            echo ""
            echo "Add an HTML-comment marker anywhere in the file:"
            echo ""
            echo '`<!-- reference-durability: allow-link -->`, `<!-- reference-durability: allow-version-ref -->`, or `<!-- reference-durability: allow-url -->`'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
