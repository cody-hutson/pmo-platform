name: Repository integrity

# gate-efficacy: posture=required  enforcement=branch-protection:"Depersonalization gate","Issue-reference validity gate","Dead-file-reference gate"  always-reports=yes
#   invariant: no changed file introduces operator/collaborator personal data in
#              the C6 domains (depersonalization), an unresolvable or mis-placed
#              issue reference (issue-ref), or a dead markdown file/anchor link
#              (dead-file-ref). All three assert by scanning changed-file content.
#   falsification: add the operator name/email to a core/ file -> depersonalization
#                  red; add "#999999" outside a reference block -> issue-ref red;
#                  add "[x](missing.md)" -> dead-file-ref red.
# (Three gates, three checks; posture per core/standards/gate-efficacy-standard.md (b).)
#
# gate-efficacy: posture=advisory  enforcement=ci-enforce:"SIGPIPE-idiom gate" (no WARN_MODE — a finding turns the check RED)  always-reports=yes
#   invariant: no added line in a changed *.sh / *.bash introduces a writer piped
#              into a short-circuiting reader (any writer | grep -q, any grep | head)
#              outside the three declared exemption tiers; a file whose git status is
#              A or R is scanned WHOLE, closing the rename blind spot.
#   falsification: add `printf '%s' "$x" | grep -q y` to any changed .sh -> the job
#                  FAILS (exit 1); add the same line carrying
#                  `# sigpipe-idiom: allow — <reason>` -> the job PASSES and the line
#                  is listed in the SUPPRESSED block of the run summary.
#   posture note: `advisory`, not `required`, is the HONEST declaration today —
#                 Requirement (b') makes `required` unavailable until the context is
#                 registered in branch protection, which a PR cannot do. The gate is
#                 ENFORCING (it exits non-zero on a finding); it is not yet BLOCKING.
#                 Registering "SIGPIPE-idiom gate" as a required check flips this row
#                 to posture=required enforcement=branch-protection with no code change.

# Three PR-time integrity gates as three named jobs on one workflow, on the
# proven parser-clean scaffold (override-marker -> locate-anchor -> scan-changed-
# files -> teach-block -> exit 1). PER-GATE SCOPE: there is NO single shared
# allowlist. The depersonalization gate runs ONLY over the C6 governance domains
# (core/ release/ operations/ packages/) — the surface where personal data is
# forbidden — so legally/structurally-mandatory identity in LICENSE, SECURITY.md,
# README.md, and .github/* (CODEOWNERS, dependabot, the PR template) is exempt by
# the cited policy authority, not by enumeration. The dead-file-ref gate STILL
# covers README/docs/.github (user-facing link integrity matters everywhere).
# Each job scans only the files changed in the PR (the base..head delta), so
# pre-existing corpus rot in unchanged files is never re-flagged.
#
# `edited` is intentionally absent: every gate scans file content, which is
# invariant under PR body/title edits — including `edited` would only add
# redundant runs (the shared-release-PR double-run the parser-clean workflow
# incurs).
#
# Injection-safety: every github-context value (actor, sender type, base/head
# SHA, secrets) is bound through env: and referenced as "$VAR" in run blocks;
# no github-context expression is ever inlined into a run command.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read            # issue-ref resolves #N via gh api

jobs:
  # ---------------------------------------------------------------------------
  # GATE 1 — Depersonalization (C6-domain scope; github.actor + input identity;
  #          bot-skip; fail-loud-on-canonical for BOTH required inputs).
  # ---------------------------------------------------------------------------
  depersonalization:
    name: Depersonalization gate
    runs-on: ubuntu-latest
    env:
      CANONICAL_REPO: cody-hutson/pmo-platform
      # github.actor is the login that initiated the run — ALWAYS present, no
      # checkout/config dependency, and yields the canonical handle. NOT git
      # config user.name (unset on actions/checkout -> exit 1 under set -e) and
      # NOT commit %an (may be a bot or a divergent literal).
      ACTOR: ${{ github.actor }}
      SENDER_TYPE: ${{ github.event.sender.type }}            # 'Bot' for dependabot/Claude
      OPERATOR_IDENTITY: ${{ secrets.OPERATOR_IDENTITY }}     # operator full name + email (one per line); canonical FAILS LOUD if unset
      COLLABORATOR_NAMES: ${{ secrets.COLLABORATOR_NAMES }}   # OPTIONAL full-name entries (one per line); unset = solo-operator (collaborator scanning dormant)
      FORK_OPTOUT: ${{ vars.REPO_INTEGRITY_FORK_OPTOUT }}     # fork-only: explicit opt-out of a dimension
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base commit for the changed-files delta

      - name: Scan C6-domain changed files for operator and collaborator personal data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          OVERRIDE='<!--[[:space:]]*repo-integrity:[[:space:]]*allow-depersonalization[[:space:]]*-->'

          # The literal-escaper and the ADR `deciders:` carve-out decision are
          # defined ONCE, in a sourced library that the committed fixture suite
          # (release/tools/tests/test_deciders_carveout.sh) exercises through the
          # same entry point. An inline copy here would pass its own tests while
          # this gate diverged — the shadow-source failure the carve-out
          # reconciliation exists to end.
          . "${GITHUB_WORKSPACE:-.}/release/tools/lib/deciders-carveout.sh"

          # --- 0. FAIL-LOUD-ON-CANONICAL (OPERATOR_IDENTITY required; ----------
          #        COLLABORATOR_NAMES optional — solo-operator). -----------------
          # A PII control that silently scans nothing is indistinguishable from a
          # passing one. On the canonical repo, an unset OPERATOR_IDENTITY is the
          # DESIGNED loud failure (the same posture the gitleaks secret-scan uses)
          # — not a set -e abort. COLLABORATOR_NAMES is optional: unset is the
          # solo-operator state (collaborator scanning dormant, surfaced as a notice).
          IS_CANONICAL=0
          [ "${GITHUB_REPOSITORY:-}" = "$CANONICAL_REPO" ] && IS_CANONICAL=1

          # Fork opt-out: a repo variable OR a committed sentinel disables a
          # dimension on a fork (announced in the summary). Absent the marker, a
          # fork with unset inputs ALSO fails loud.
          FORK_OPTED_OUT=0
          if [ "$IS_CANONICAL" -eq 0 ]; then
            if [ -n "${FORK_OPTOUT:-}" ] || [ -f .repo-integrity-fork ]; then
              FORK_OPTED_OUT=1
              echo "::notice::repo-integrity depersonalization: fork opt-out active (REPO_INTEGRITY_FORK_OPTOUT or .repo-integrity-fork present); a dimension with an unset input is skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "$IS_CANONICAL" -eq 1 ] && [ -z "${OPERATOR_IDENTITY:-}" ]; then
            {
              echo "## :x: Depersonalization gate misconfigured"
              echo ""
              echo "Required secret unset on the canonical repository: \`OPERATOR_IDENTITY\`."
              echo "This gate enforces C6 Personal data (see \`core/standards/secrets-handling-policy.md\`)."
              echo "A depersonalization control that scans nothing is indistinguishable from a passing one,"
              echo "so on canonical an unset OPERATOR_IDENTITY is a hard failure — set it in repo secrets."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::Depersonalization gate misconfigured: OPERATOR_IDENTITY unset on canonical repo"
            exit 1
          fi

          # Solo-operator: COLLABORATOR_NAMES is OPTIONAL. When unset on canonical,
          # the operator dimension still runs and collaborator scanning is dormant
          # (the scan below is guarded on a non-empty COLLABORATOR_NAMES). Surfaced
          # as a notice so the dormant state is observable.
          if [ "$IS_CANONICAL" -eq 1 ] && [ -z "${COLLABORATOR_NAMES:-}" ]; then
            echo "::notice::repo-integrity depersonalization: COLLABORATOR_NAMES unset — solo-operator mode (collaborator scanning dormant; set the secret if collaborators are added)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # --- 1. SCOPE (per-gate): changed files INTERSECTED with C6 domains --
          #     core/ release/ operations/ packages/ ONLY. Everything else
          #     (LICENSE, SECURITY.md, README.md, .github/*) is out of scope by
          #     secrets-handling-policy.md C6 — no per-file allowlist needed.
          mapfile -t ALL_CHANGED < <(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" 2>/dev/null || true)
          CHANGED=()
          for f in "${ALL_CHANGED[@]}"; do
            [ -z "$f" ] && continue
            case "$f" in
              release/releases/*) : ;;   # tracking surface (RELEASE_LOG/INDEX/DIGEST/NOTES/plans) — PR-URLs (operator handle) + #N are native provenance; exempt, mirroring the reference-durability gate
              core/*|release/*|operations/*|packages/*) CHANGED+=("$f") ;;
              *) : ;;   # out of C6 scope — intentional-identity files exempt
            esac
          done

          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo ":white_check_mark: Depersonalization — no changed files under the C6 domains (core/ release/ operations/ packages/)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- 2. OPERATOR-SELF dimension (CD-B) -------------------------------
          #     handle = $ACTOR (always present); name/email from OPERATOR_IDENTITY.
          #     BOT-SKIP: a bot-authored PR must not blind the gate by resolving
          #     the operator literal to the bot's identity.
          BOT=0
          case "$ACTOR" in *'[bot]') BOT=1 ;; esac
          [ "${SENDER_TYPE:-}" = "Bot" ] && BOT=1

          # Build the operator-literal pattern list (one literal per line). The
          # handle comes from the actor; name/email lines come from the input.
          # HANDLE_LITERAL is tracked separately from OP_LITERALS because the ADR
          # `deciders:` carve-out partitions them: §1.2 sanctions the NAME there and
          # never the handle, so the handle must stay matchable inside the carve-out
          # branch. Same source, same resolution conditions — one variable, two uses.
          OP_LITERALS=""
          HANDLE_LITERAL=""
          if [ "$BOT" -eq 0 ]; then
            if [ "$IS_CANONICAL" -eq 1 ] || [ "$FORK_OPTED_OUT" -eq 0 ]; then
              if [ -n "${ACTOR:-}" ]; then
                OP_LITERALS="$ACTOR"
                HANDLE_LITERAL="$ACTOR"
              fi
              if [ -n "${OPERATOR_IDENTITY:-}" ]; then
                OP_LITERALS="$(printf '%s\n%s\n' "$OP_LITERALS" "$OPERATOR_IDENTITY")"
              fi
            fi
          else
            echo "::notice::repo-integrity depersonalization: actor is a bot — operator-self matching skipped (collaborator dimension still runs)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # Collaborator dimension reads a fixed input, not the actor — it runs
          # regardless of bot status.
          COLLAB_LITERALS=""
          if [ -n "${COLLABORATOR_NAMES:-}" ]; then
            COLLAB_LITERALS="$COLLABORATOR_NAMES"
          fi

          # Compose the case-sensitive, word-boundary pattern set. Each non-empty
          # line is matched as a literal (regex-escaped) with \b boundaries.
          # esc_lines comes from the sourced carve-out library above, so this gate and
          # its fixture suite build their pattern sets with identical escaping.
          PATTERN_FILE="$(mktemp)"
          esc_lines "$OP_LITERALS" >> "$PATTERN_FILE"
          esc_lines "$COLLAB_LITERALS" >> "$PATTERN_FILE"

          # NOT-CARVED partition — the literals the ADR `deciders:` carve-out does
          # NOT cover. Built through the SAME esc_lines helper as PATTERN_FILE, so
          # the two sets cannot drift into different escaping. Empty when no handle
          # resolves (bot actor / opted-out fork), which the carve-out predicate
          # treats as "fall back to the shipped whole-line behaviour" rather than
          # inventing a verdict for a dimension that is already dark.
          NOT_CARVED_FILE="$(mktemp)"
          esc_lines "$HANDLE_LITERAL" >> "$NOT_CARVED_FILE"

          if [ ! -s "$PATTERN_FILE" ]; then
            echo ":white_check_mark: Depersonalization — no operator/collaborator literals resolved for this run (bot actor and/or no inputs); nothing to match" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- 3 + 4. Scan each in-scope changed file (case-sensitive, word-
          #     boundary). Lines bearing the override marker are suppressed +
          #     reported (line-scoped). NO line-level safe-phrase exclusion.
          FOUND=0
          REPORT=""
          SUPPRESSED=""
          for f in "${CHANGED[@]}"; do
            [ -f "$f" ] || continue   # deleted file — nothing to scan
            # NET-NEW DELTA: scan only lines ADDED since the base (the same
            # added-lines posture the issue-ref + reference-durability gates use),
            # so a pre-existing operator/collaborator literal in a file the PR
            # touched for unrelated reasons is never re-flagged. Keyed by head-file line.
            ADDED_LINES="$(git diff --unified=0 "$BASE_SHA"..."$HEAD_SHA" -- "$f" \
              | awk '
                /^@@/ { plus = $3; sub(/^\+/, "", plus); split(plus, pc, ","); newln = pc[1] + 0; next }
                /^\+\+\+/ { next }
                /^\+/ { print newln ":" substr($0, 2); newln++ ; next }
                /^-/ { next }
              ' || true)"
            [ -z "$ADDED_LINES" ] && continue
            # case-sensitive (no -i); match PII patterns against the added LINENO:CONTENT lines.
            HITS="$(printf '%s\n' "$ADDED_LINES" | grep -E -f "$PATTERN_FILE" || true)"
            [ -z "$HITS" ] && continue
            while IFS= read -r hit; do
              [ -z "$hit" ] && continue
              LN="${hit%%:*}"
              CONTENT="${hit#*:}"
              # Per-line verdict — the line-scoped override AND the ADR `deciders:`
              # carve-out, decided in the sourced library so the committed fixture
              # suite asserts against this code path rather than a look-alike.
              #
              # The carve-out is NAME-SCOPED. depersonalization-spec.md §1.2 sanctions
              # the operator's literal NAME on a frontmatter `deciders:` line inside
              # an ADR and nothing more; the GitHub handle is never sanctioned, on any
              # line, `deciders:` included. The skip therefore fires iff the file is
              # an ADR (core/ADRs/*.md or release/ADRs/*.md) AND the added line
              # matches ^deciders: AND the line carries no un-carved literal.
              # Suppressions reuse the SUPPRESSED channel so exempted lines are
              # reported, not silent, and the whole decision sits BEFORE FOUND=1 so it
              # can never short-circuit a match outside the carve-out.
              #
              # KNOWN RESIDUAL, recorded rather than silently carried: the not-carved
              # set holds the handle only, so the operator email and the collaborator
              # dimension are still suppressed whole-line on a `deciders:` line. §1.2
              # declares both blocked. Closing that half was scoped out of this change
              # deliberately, not overlooked.
              case "$(depersonalization_line_verdict \
                        "$f" "$CONTENT" "$PATTERN_FILE" "$NOT_CARVED_FILE" "$OVERRIDE")" in
                CLEAN)
                  continue ;;
                SUPPRESSED-OVERRIDE)
                  SUPPRESSED="${SUPPRESSED}${f}:${LN} (override-suppressed)"$'\n'
                  continue ;;
                SUPPRESSED-CARVEOUT)
                  SUPPRESSED="${SUPPRESSED}${f}:${LN} (deciders carve-out — name-scoped)"$'\n'
                  continue ;;
              esac
              # redact: echo only the line number + a short redacted marker, never
              # the full PII value (mirror gitleaks --redact).
              FOUND=1
              REPORT="${REPORT}${f}:${LN}: <redacted — operator/collaborator personal data match>"$'\n'
            done <<< "$HITS"
          done
          rm -f "$PATTERN_FILE" "$NOT_CARVED_FILE"

          if [ -n "$SUPPRESSED" ]; then
            {
              echo "### Override-suppressed depersonalization matches (reported for visibility):"
              echo '```'
              printf '%s' "$SUPPRESSED"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo ":white_check_mark: Depersonalization — no operator/collaborator personal data in changed C6-domain files" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## :x: Depersonalization gate FAILED"
            echo ""
            echo "A changed file under a C6 governance domain (\`core/\`, \`release/\`, \`operations/\`, \`packages/\`)"
            echo "contains the operator's identifying values or a known collaborator's full name."
            echo ""
            echo "### Matches (file:line — value redacted):"
            echo '```'
            printf '%s' "$REPORT"
            echo '```'
            echo ""
            echo "### Why"
            echo ""
            echo "Personal data is C6 (see \`core/standards/secrets-handling-policy.md\`): kept outside the workspace"
            echo "or encrypted-at-rest, never inline in a tracked \`core/\`/\`release/\`/\`operations/\`/\`packages/\` file."
            echo "Author against the depersonalization tokens (\`[OPERATOR_NAME]\`, \`[OPERATOR_GITHUB]\`, …) instead of a literal."
            echo ""
            echo "See [\`core/rules/git-workflow.md\` § Repository-Integrity Gates](../blob/main/core/rules/git-workflow.md)."
            echo ""
            echo "### Override (a legitimately-required identity literal)"
            echo ""
            echo 'Add the marker on the SAME line as the literal:'
            echo '`<!-- repo-integrity: allow-depersonalization -->`'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  # ---------------------------------------------------------------------------
  # GATE 2 — Issue-reference validity (true per-#N resolution; exclude PRs;
  #          detect transferred issues; IMP-NNN always invalid; placement).
  # ---------------------------------------------------------------------------
  issue-ref:
    name: Issue-reference validity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate and place-check issue references in changed markdown
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          OVERRIDE='<!--[[:space:]]*repo-integrity:[[:space:]]*allow-issue-ref[[:space:]]*-->'
          # Designated reference-block headers (reuse the parser-clean anchor family).
          # The `Source(s)` arm is explicit: `[Ss]ources?` matches `Source` and
          # `Sources` but NOT `Source(s)`, whose parenthetical then hit the `$` anchor
          # and failed — while this gate's own failure message, core/ADRs/README.md,
          # and reference-durability-standard.md all NAME `### Source(s)` as
          # recognized. That was a specification-versus-implementation defect, not a
          # policy choice, so the implementation is corrected to the stated set.
          #
          # `Related ADRs` is deliberately NOT recognized. It is a cross-ADR-link
          # section, where core/standards/adr-authoring-guide.md § Issue references in
          # ADRs forbids a bare #N outright (zone 1) — recognizing it would move the
          # placement cut point ABOVE that section and make this gate accept exactly
          # the placement the authoring guide prohibits.
          REFBLOCK_RE='^#{1,6}[[:space:]]+([Ii]ssue [Rr]eferences|[Rr]eferences|[Rr]elated|[Pp]rovenance|[Ss]ources?|[Ss]ource\(s\))[[:space:]]*:?[[:space:]]*$'

          # SCOPE: every changed .md MINUS the self-doc files that necessarily
          # quote worked-example #N (they carry a file-top allow-issue-ref).
          mapfile -t ALL_CHANGED < <(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" -- '*.md' 2>/dev/null || true)

          # Per-run resolution cache for #N (path under /tmp).
          CACHE_DIR="$(mktemp -d)"
          # resolve_issue: prints "valid" or a reason token. NO -L (a 3xx is
          # unresolvable-in-this-repo). The gh exit code is the precise signal:
          #   non-zero (404, or a 3xx redirect that gh will NOT follow) -> the
          #   number does not resolve to a 200 issue in this repo -> unresolvable.
          # On a genuine 200 (exit 0), the payload is then branched:
          #   .pull_request != null -> pr-number (the issues endpoint 200s for PRs);
          #   .repository_url not ending in this repo -> transferred (a transfer
          #   that returns the destination payload — the NF-2 belt-and-suspenders);
          #   otherwise -> valid.
          # gh prints a JSON error body to STDOUT on 404 (with .status "404"), so
          # branching on the exit code — not on body emptiness — is what keeps a
          # 404 from being mis-labeled transferred.
          resolve_issue() {
            local n="$1" cf="$CACHE_DIR/$1"
            if [ -f "$cf" ]; then cat "$cf"; return; fi
            local body rc verdict repo_url is_pr
            set +e
            body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${n}" 2>/dev/null)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              verdict="unresolvable"   # 404 or un-followed 3xx
            else
              repo_url="$(printf '%s' "$body" | jq -r '.repository_url // ""' 2>/dev/null || true)"
              is_pr="$(printf '%s' "$body" | jq -r 'if .pull_request == null then "issue" else "pr" end' 2>/dev/null || echo "issue")"
              if [ "$is_pr" = "pr" ]; then
                verdict="pr-number"
              elif ! printf '%s' "$repo_url" | grep -qE "/${GITHUB_REPOSITORY}\$"; then
                verdict="transferred"
              else
                verdict="valid"
              fi
            fi
            printf '%s' "$verdict" > "$cf"
            printf '%s' "$verdict"
          }

          FOUND=0
          REPORT=""
          for f in "${ALL_CHANGED[@]}"; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            case "$f" in
              core/rules/git-workflow.md|.github/PULL_REQUEST_TEMPLATE.md) continue ;;  # self-doc (file-top allow-issue-ref)
              release/releases/*) continue ;;  # tracking surface (RELEASE_LOG/INDEX/DIGEST/NOTES/plans) — #N + PR-refs are native provenance; exempt, mirroring the reference-durability gate
            esac
            # whole-file override
            if grep -qE "$OVERRIDE" "$f"; then
              echo "::notice::repo-integrity issue-ref: a changed file carries allow-issue-ref — skipped." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # locate a designated reference block (first occurrence)
            REFBLOCK_LINE="$(grep -nE "$REFBLOCK_RE" "$f" | head -1 | cut -d: -f1 || true)"
            [ -z "$REFBLOCK_LINE" ] && REFBLOCK_LINE=0

            # NET-NEW DELTA: scan only lines ADDED since the base (the same
            # added-lines posture the reference-durability gate uses), so a
            # pre-existing reference in a file the PR touched for unrelated
            # reasons is never re-flagged. The added text is keyed by its
            # head-file line number.
            ADDED_LINES="$(git diff --unified=0 "$BASE_SHA"..."$HEAD_SHA" -- "$f" \
              | awk '
                /^@@/ {
                  # @@ -a,b +c,d @@ -> new-file hunk starts at c
                  plus = $3; sub(/^\+/, "", plus); split(plus, pc, ","); newln = pc[1] + 0; next
                }
                /^\+\+\+/ { next }
                /^\+/ { print newln ":" substr($0, 2); newln++ ; next }
                /^-/ { next }
              ' || true)"
            [ -z "$ADDED_LINES" ] && continue

            IN_FENCE=0
            while IFS= read -r entry || [ -n "$entry" ]; do
              [ -z "$entry" ] && continue
              LN="${entry%%:*}"
              line="${entry#*:}"
              # fenced code: a ``` on an added line toggles fence state.
              case "$line" in
                '```'*) IN_FENCE=$((1 - IN_FENCE)); continue ;;
              esac
              [ "$IN_FENCE" -eq 1 ] && continue

              # IMP-NNN is always invalid in file content (deprecated).
              if printf '%s' "$line" | grep -qE '\bIMP-[0-9]+\b'; then
                IMPS="$(printf '%s' "$line" | grep -oE '\bIMP-[0-9]+\b' || true)"
                for imp in $IMPS; do
                  FOUND=1
                  REPORT="${REPORT}${f}:${LN}: ${imp} — deprecated IMP-NNN reference (use a GitHub issue number)"$'\n'
                done
              fi

              # A #N rendered as a markdown link (e.g. [#N](...) or any
              # [text](...N...) whose target is an issue URL) carries an INLINE
              # PROVENANCE MARKER and is exempt from the reference-block placement
              # rule (per the placement spec's inline-marker alternative). The
              # link form is still validity-checked below.
              HAS_PROVENANCE=0
              printf '%s' "$line" | grep -qE '\]\([^)]*\)' && HAS_PROVENANCE=1

              # #NNNN tokens on this line.
              NUMS="$(printf '%s' "$line" | grep -oE '#[0-9]+' | tr -d '#' || true)"
              [ -z "$NUMS" ] && continue
              for n in $NUMS; do
                V="$(resolve_issue "$n")"
                case "$V" in
                  valid)
                    # placement: a valid #N must sit inside a designated
                    # reference block OR carry an inline provenance marker
                    # (a markdown link on the same line).
                    if [ "$HAS_PROVENANCE" -eq 0 ] && { [ "$REFBLOCK_LINE" -eq 0 ] || [ "$LN" -lt "$REFBLOCK_LINE" ]; }; then
                      FOUND=1
                      REPORT="${REPORT}${f}:${LN}: #${n} resolves but is placed outside a designated reference block and carries no inline provenance marker"$'\n'
                    fi
                    ;;
                  unresolvable)
                    FOUND=1
                    REPORT="${REPORT}${f}:${LN}: #${n} does not resolve to an issue in this repo (404 or redirect)"$'\n'
                    ;;
                  transferred)
                    FOUND=1
                    REPORT="${REPORT}${f}:${LN}: #${n} resolves to a DIFFERENT repository (transferred issue)"$'\n'
                    ;;
                  pr-number)
                    FOUND=1
                    REPORT="${REPORT}${f}:${LN}: #${n} is a pull-request number, not an issue"$'\n'
                    ;;
                esac
              done
            done <<< "$ADDED_LINES"
          done
          rm -rf "$CACHE_DIR"

          if [ "$FOUND" -eq 0 ]; then
            echo ":white_check_mark: Issue-reference validity — all #N in changed markdown resolve in-repo and sit in reference blocks" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## :x: Issue-reference validity gate FAILED"
            echo ""
            echo "A changed markdown file references an issue that does not resolve to a real"
            echo "issue IN THIS REPO, or a resolving reference sits outside a designated reference block."
            echo ""
            echo "### Findings (file:line):"
            echo '```'
            printf '%s' "$REPORT"
            echo '```'
            echo ""
            echo "### Categories"
            echo ""
            echo "- **does not resolve / redirect** — a 404 or a redirect to another repo (a transferred issue does not resolve here)."
            echo "- **different repository** — the number resolves to a TRANSFERRED issue now living in another repo."
            echo "- **pull-request number** — the number is a PR, not an issue."
            echo "- **deprecated IMP-NNN** — the legacy improvement id; use a GitHub issue \`#N\`."
            echo "- **placed outside a reference block** — a valid \`#N\` must sit under a recognized heading, at any level: \`Issue References\` / \`References\` / \`Related\` / \`Provenance\` / \`Source\` / \`Sources\` / \`Source(s)\`. In an ADR the designated block is \`## References\`; \`## Related ADRs\` is NOT recognized, because a bare \`#N\` is prohibited there outright."
            echo ""
            echo "See [\`core/rules/git-workflow.md\` § Repository-Integrity Gates](../blob/main/core/rules/git-workflow.md) and [\`core/standards/adr-authoring-guide.md\` § Issue references in ADRs](../blob/main/core/standards/adr-authoring-guide.md)."
            echo ""
            echo "### Override — a RARE exception, not the default remedy"
            echo ""
            echo 'Adding the marker `repo-integrity: allow-issue-ref` (wrapped in an HTML comment) anywhere in a file skips this gate for the WHOLE file — placement AND validity, so a 404, a redirect, a transferred issue and a PR number all pass unexamined.'
            echo ""
            echo 'It is warranted only when BOTH limbs hold: (1) the file DISPLAYS an issue-reference construct as its subject matter — self-documentation, a template, a worked example, a test fixture — or its numbers are synthetic / out-of-repo and cannot resolve by construction; AND (2) neither remedy is available — the reference cannot be relocated into a designated reference block, and it cannot be replaced by an inline summary without destroying what the file is for.'
            echo ""
            echo 'A marker declared under this criterion carries a trailing rationale INSIDE the comment naming which limb applies. A bare marker is a silenced warning, not a declaration. Carrying provenance is not demonstration: move the reference into a reference block with a summary noun phrase instead.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  # ---------------------------------------------------------------------------
  # GATE 3 — Dead-file-reference (PRESERVED design: generalized link checker +
  #          github-slugger anchors warn-mode + images). Scans the CHANGED delta
  #          only (--files) so pre-existing corpus rot is not re-flagged; the
  #          bare release-link-check.yml invocation keeps every new flag OFF.
  # ---------------------------------------------------------------------------
  dead-file-ref:
    name: Dead-file-reference gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Resolve link and image targets and anchors across the changed corpus delta
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          OVERRIDE='<!--[[:space:]]*repo-integrity:[[:space:]]*allow-dead-file-ref[[:space:]]*-->'

          # Changed markdown in this PR; drop deleted files and per-file overrides.
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" -- '*.md' 2>/dev/null || true)
          FILES=()
          for f in "${CHANGED[@]}"; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            if grep -qE "$OVERRIDE" "$f"; then
              echo "::notice::repo-integrity dead-file-ref: a changed file carries allow-dead-file-ref — skipped." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            FILES+=("$f")
          done

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo ":white_check_mark: Dead-file-reference — no changed markdown to check" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Scope stays BROAD (README/docs/.github covered) but the --files
          # restriction limits the candidate set to the changed files, and
          # --diff-base limits the actual link checks to lines ADDED since the
          # base — so a pre-existing link in a file the PR touched for unrelated
          # reasons is never re-flagged (the net-new added-lines posture the
          # reference-durability gate uses). Anchors ship warn-mode (no
          # --anchors-hard-fail) during calibration; images are checked. The
          # bare release-link-check.yml invocation keeps every new flag OFF, so
          # its contract is byte-for-byte unchanged.
          set +e
          python3 release/tools/check-release-links.py \
            --roots core release docs .github --top-level-md \
            --check-anchors --images \
            --diff-base "$BASE_SHA" \
            --files "${FILES[@]}" | tee /tmp/dead-file-ref.out
          RC=${PIPESTATUS[0]}
          set -e

          {
            echo "### Dead-file-reference check output"
            echo '```'
            cat /tmp/dead-file-ref.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RC" -ne 0 ]; then
            {
              echo "## :x: Dead-file-reference gate FAILED"
              echo ""
              echo "A changed markdown file has a \`[text](path)\` link or \`![alt](path)\` image whose"
              echo "target file is missing (anchors are warn-mode during calibration and do not fail the run)."
              echo ""
              echo "See [\`core/rules/git-workflow.md\` § Repository-Integrity Gates](../blob/main/core/rules/git-workflow.md)."
              echo ""
              echo "### Override (a deliberately-broken or placeholder link)"
              echo ""
              echo 'Add the marker anywhere in the file:'
              echo '`<!-- repo-integrity: allow-dead-file-ref -->`'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo ":white_check_mark: Dead-file-reference — all link/image targets in the changed delta resolve" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # GATE 4 — ADR-number integrity (one global ADR-NNN sequence across
  #          core/ADRs + release/ADRs; fail on duplicate or gap). Whole-tree
  #          check (not delta-scoped) — numbering is a global invariant.
  # ---------------------------------------------------------------------------
  adr-number-integrity:
    name: ADR-number integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Verify ADR numbers are platform-wide-unique and gap-free
        run: |
          set -euo pipefail

          # Self-test first — prove the checker still catches duplicate / gap /
          # malformed before trusting its verdict on the real tree.
          python3 release/tools/check-adr-numbers.py --self-test

          # Enforce the invariant across core/ADRs + release/ADRs (ONE global
          # ADR-NNN sequence — see core/ADRs/README.md § Naming convention).
          set +e
          python3 release/tools/check-adr-numbers.py | tee /tmp/adr-number.out
          RC=${PIPESTATUS[0]}
          set -e

          {
            echo "### ADR-number integrity check"
            echo '```'
            cat /tmp/adr-number.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RC" -ne 0 ]; then
            {
              echo "## :x: ADR-number integrity gate FAILED"
              echo ""
              echo "ADR files in \`core/ADRs/\` and \`release/ADRs/\` share ONE global \`ADR-NNN\` sequence."
              echo "A duplicate number or a gap was introduced. Renumber the later claimant to the next"
              echo "free slot; see \`core/ADRs/README.md\` § Naming convention."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo ":white_check_mark: ADR-number integrity — numbers are unique and contiguous" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Release ADR index is a faithful projection of the ADR file set
        run: |
          set -euo pipefail

          # Same two-layer posture as the numbering gate above: self-test FIRST, so a
          # projector that has stopped discriminating cannot certify the index. The
          # self-test carries three control arms (delete a row / hand-edit a derived
          # cell / orphan a row) plus three structural-failure arms.
          python3 release/tools/generate-adr-index.py --self-test

          # `release/ADRs/README.md`'s table is a DERIVED surface: every column is
          # projected from the ADR file set and each record's own frontmatter. This
          # step is the gate that makes a missing row or a stale Status structurally
          # impossible rather than merely currently-absent. Contract:
          # release/references/standards/release-corpus-schema.md § Derived-Surface
          # Contract. Founding record: ADR-117.
          set +e
          python3 release/tools/generate-adr-index.py --verify | tee /tmp/adr-index.out
          RC=${PIPESTATUS[0]}
          set -e

          {
            echo "### Release ADR index projection"
            echo '```'
            cat /tmp/adr-index.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # exit 3 = structural failure (markers gone, unparseable frontmatter) — the
          # projector could not compute an answer, which must never read as a clean one.
          if [ "$RC" -eq 3 ]; then
            echo "::error::The ADR index projector could not resolve its inputs — it verified nothing." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$RC" -ne 0 ]; then
            {
              echo "## :x: Release ADR index is out of date"
              echo ""
              echo "The table in \`release/ADRs/README.md\` is GENERATED. \`MISSING\` = a record with no row;"
              echo "\`ORPHAN\` = a row with no record; \`DRIFT\` = a hand-edited cell that contradicts the"
              echo "record's own frontmatter."
              echo ""
              echo "Fix: \`python3 release/tools/generate-adr-index.py --write\` and commit. Do NOT hand-edit a row."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo ":white_check_mark: Release ADR index — every column matches its record" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Merge-time ADR renumber — tool self-test + two-branch behavioural fixture
        run: |
          set -euo pipefail

          # Two complementary layers, and BOTH are required. The pure-function
          # self-test owns the citation-boundary property (renumbering ADR-010
          # must not corrupt ADR-100..109) — the fixture's small number range
          # cannot exercise it. The fixture owns the behavioural property the
          # card's AC-1 actually asserts: two branches author concurrently and
          # both merge, with T0 asserting the root cause directly (both
          # claimants PASS locally before the race resolves) and A7 proving the
          # suite fails when the renumber is done by hand.
          python3 release/tools/renumber-adr.py --self-test

          set +e
          bash release/tools/tests/test_renumber_adr.sh | tee /tmp/renumber-adr.out
          RC=${PIPESTATUS[0]}
          set -e

          {
            echo "### Merge-time ADR renumber fixture"
            echo '```'
            tail -20 /tmp/renumber-adr.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RC" -ne 0 ]; then
            {
              echo "## :x: ADR renumber fixture FAILED"
              echo ""
              echo "\`release/tools/renumber-adr.py\` is the sanctioned merge-time renumber"
              echo "(Stage 12 Phase A.5.7 / gate \`G-EX9\`). A failing assertion means a"
              echo "renumber would leave dangling citations, a stale index surface, or a"
              echo "missing \`## Status\` numbering-provenance note."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo ":white_check_mark: ADR renumber — six-step move verified end-to-end" | tee -a "$GITHUB_STEP_SUMMARY"

  draft-file:
    name: Draft-file gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Flag draft/scratch/proposal files added outside the governed corpus
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WARN_MODE: 'true'   # warn-mode initial; flip to 'false' to enforce after shakedown
        run: |
          set -euo pipefail

          # The A-status-delta MERGE-time companion to the edit-time
          # core/hooks/block-draft-files.sh hook (#411b): the hook acts on path-shape
          # per Write; this gate scopes to files ADDED in the PR. git-ignored files
          # never reach A-status, so the sanctioned-scratch tier (projects/, personal/,
          # */governance/roadmaps/, …) is excluded by construction. SHA inputs are
          # passed via env and used quoted (no untrusted-text interpolation in run:).
          DRAFT_SEG='(^|/)(proposals|drafts|draft|scratch|sandbox|wip)/'
          GOVERNED='^(core|release|operations|packages|docs|\.github)/'
          TOPLEVEL='^(README\.md|CHANGELOG\.md|LICENSE|SECURITY\.md|CONTRIBUTING\.md|install\.sh|update\.sh|\.gitignore|\.version)$'

          mapfile -t ADDED < <(git diff --name-only --diff-filter=A "$BASE_SHA"..."$HEAD_SHA" 2>/dev/null || true)
          FINDINGS=""
          for f in "${ADDED[@]}"; do
            [ -z "$f" ] && continue
            if echo "$f" | grep -qE "$DRAFT_SEG"; then
              FINDINGS="${FINDINGS}- \`$f\` — draft-shaped path segment in tracked corpus"$'\n'
            elif ! echo "$f" | grep -qE "$GOVERNED" && ! echo "$f" | grep -qE "$TOPLEVEL"; then
              FINDINGS="${FINDINGS}- \`$f\` — new tracked file outside the governed-corpus roots"$'\n'
            fi
          done

          if [ -z "$FINDINGS" ]; then
            echo ":white_check_mark: Draft-file gate — no draft/scratch files added outside the governed corpus" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Draft-file gate findings"
            echo ""
            echo "Draft / scratch / proposal content belongs in the issue tracker (\`observation.yml\` -> \`improvement.yml\`) or the git-ignored runtime tier — not the tracked public corpus. See \`core/rules/git-workflow.md\` § Draft / scratch content."
            echo ""
            printf '%s' "$FINDINGS"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$WARN_MODE" = "true" ]; then
            echo "::warning::Draft-file gate (warn-mode initial): findings reported, not blocking. Flip WARN_MODE to 'false' to enforce after shakedown."
            exit 0
          fi
          exit 1

  # ---------------------------------------------------------------------------
  # GATE 7 — Governance-file-map cross-check (#133). Regex-parses the
  #          `## Governance File Map` table in core/CLAUDE.md.template, extracts
  #          each CLAIMED repo path from the Location column, and asserts it
  #          resolves on disk. ASYMMETRIC by design:
  #            - FAIL  on an unresolvable CLAIMED path (recall — a broken map
  #                    path mis-routes agents; high blast radius).
  #            - WARN  on an on-disk governance file ABSENT from the map
  #                    (precision — a completeness nudge, not a PR break).
  #          Net-new posture: the FAIL assertion runs over the path claims on
  #          ADDED lines in the map (the same added-lines delta the other gates
  #          use), so a pre-existing broken claim in an unrelated PR is never
  #          re-flagged. Warn-mode-initial per core/rules/bypass-mode-readiness.md.
  #          A self-test (labeled expected-match fixture) runs FIRST and
  #          hard-fails INDEPENDENT of warn-mode — a mis-parsing detector that
  #          reads green is indistinguishable from a passing one (the CDF-2
  #          posture the skill-count-imp gate uses).
  #
  #          Repo-path resolution: the repo root IS `pmo-platform` (core/,
  #          release/, … live at root). A map token prefixed `pmo-platform/` is
  #          the unambiguous "this file lives in the repo at this path" claim;
  #          stripping the prefix yields the repo-relative path. Operator-
  #          instance / placeholder tokens (`projects/`, `Claude/`, `[WorkArea]/`,
  #          `<OPERATOR_*>`, `/roadmaps/`) are NOT repo paths and are skipped.
  #          A mid-path placeholder segment (`<...>` / `[...]`) is truncated to
  #          its static prefix before the existence test.
  #
  #          Injection-safety: BASE_SHA/HEAD_SHA are bound via env: and used only
  #          as "$VAR" in run blocks; no github-context expression is inlined.
  # ---------------------------------------------------------------------------
  governance-file-map:
    name: Governance-file-map cross-check gate
    runs-on: ubuntu-latest
    env:
      WARN_MODE: 'true'   # warn-mode initial; flip to 'false' to enforce after shakedown
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base commit for the added-lines delta

      - name: Parser self-test (labeled expected-match; hard-fail independent of warn-mode)
        run: |
          set -euo pipefail

          # The detector's correctness is gated on an in-tool self-test with a
          # labeled expected-match set. A self-test miss FAILS THE PR regardless
          # of WARN_MODE — a broken parser is not a warn-able finding. Mirrors
          # skill-count-imp-check.yml's --self-test step.

          # extract_location_paths — given a Governance File Map markdown table on
          # stdin, emit one CLAIMED repo path per line (the resolution candidates).
          # Reads the Location column (field 2), pulls backtick tokens, keeps only
          # `pmo-platform/`-prefixed tokens, strips the prefix + a trailing slash,
          # and truncates a `<...>`/`[...]` placeholder path-segment to its static
          # prefix. Header/separator rows are skipped.
          extract_location_paths() {
            awk -F'|' '
              # table rows only (leading pipe -> empty $1)
              $1 == "" && NF >= 3 {
                loc = $3
                # skip the header separator row (---|---)
                if (loc ~ /^[[:space:]]*:?-+:?[[:space:]]*$/) next
                # pull every `backtick token` from the Location cell
                while (match(loc, /`[^`]+`/)) {
                  tok = substr(loc, RSTART + 1, RLENGTH - 2)
                  loc = substr(loc, RSTART + RLENGTH)
                  # only pmo-platform/-prefixed tokens are repo-path claims
                  if (tok !~ /^pmo-platform\//) continue
                  sub(/^pmo-platform\//, "", tok)          # -> repo-relative
                  # truncate at the first placeholder segment (<...> or [...])
                  if (match(tok, /\/?[<\[]/)) tok = substr(tok, 1, RSTART - 1)
                  sub(/\/+$/, "", tok)                       # drop trailing slash
                  if (tok != "") print tok
                }
              }
            '
          }

          # Labeled fixture: a synthetic 4-row map (built inline so every line stays
          # indented inside the YAML block scalar). Rows 1-2 carry RESOLVABLE claims
          # (the static prefixes exist in this repo); row 3 is a BROKEN claim (must
          # be extracted so the resolver can FAIL it); row 4 is an operator-instance
          # path (must be SKIPPED — not a repo claim). The leading `|` on each row is
          # what marks it as a table row to the extractor.
          GOT="$(
            { printf '| Tier | Location | Files |\n'
              printf '|---|---|---|\n'
              printf '| A | `pmo-platform/core/governance/` | OPERATIONS.md |\n'
              printf '| B | `pmo-platform/analysis/<audit-name>-YYYY-MM-DD/` | SUMMARY.md |\n'
              printf '| C | `pmo-platform/core/THIS-PATH-DOES-NOT-EXIST/` | broken.md |\n'
              printf '| D | `projects/_config/` | PORTFOLIO.md |\n'
            } | extract_location_paths | sort | tr '\n' ' '
          )"
          # Expected (sorted, space-joined): the two resolvable + the broken claim,
          # with placeholders truncated; the operator-instance path absent.
          EXPECT="$(printf '%s\n' "analysis" "core/governance" "core/THIS-PATH-DOES-NOT-EXIST" | sort | tr '\n' ' ')"
          if [ "$GOT" != "$EXPECT" ]; then
            {
              echo "## :x: Governance-file-map parser self-test FAILED"
              echo ""
              echo "The map-table path extractor did not produce the labeled expected set."
              echo "Expected: \`$EXPECT\`"
              echo "Got:      \`$GOT\`"
              echo ""
              echo "A mis-parsing detector that reads green is indistinguishable from a passing one."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::governance-file-map parser self-test mismatch"
            exit 1
          fi
          echo ":white_check_mark: Governance-file-map parser self-test passed (4-row labeled fixture)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cross-check claimed map paths against disk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          OVERRIDE='<!--[[:space:]]*repo-integrity:[[:space:]]*allow-governance-map[[:space:]]*-->'
          MAP_FILE='core/CLAUDE.md.template'
          MAP_HEADER='^##[[:space:]]+Governance File Map[[:space:]]*$'

          if [ ! -f "$MAP_FILE" ]; then
            echo "::warning::repo-integrity governance-file-map: $MAP_FILE absent — nothing to cross-check." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Whole-file override.
          if grep -qE "$OVERRIDE" "$MAP_FILE"; then
            echo "::notice::repo-integrity governance-file-map: $MAP_FILE carries allow-governance-map — skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- extractor (identical body to the self-test) -----------------------
          extract_location_paths() {
            awk -F'|' '
              $1 == "" && NF >= 3 {
                loc = $3
                if (loc ~ /^[[:space:]]*:?-+:?[[:space:]]*$/) next
                while (match(loc, /`[^`]+`/)) {
                  tok = substr(loc, RSTART + 1, RLENGTH - 2)
                  loc = substr(loc, RSTART + RLENGTH)
                  if (tok !~ /^pmo-platform\//) continue
                  sub(/^pmo-platform\//, "", tok)
                  if (match(tok, /\/?[<\[]/)) tok = substr(tok, 1, RSTART - 1)
                  sub(/\/+$/, "", tok)
                  if (tok != "") print tok
                }
              }
            '
          }

          # --- isolate the Governance File Map section block ---------------------
          # From the map header to the next top-level (## ) heading.
          MAP_BLOCK="$(awk -v hdr="$MAP_HEADER" '
            $0 ~ hdr { inblk=1; next }
            inblk && /^##[[:space:]]/ { exit }
            inblk { print }
          ' "$MAP_FILE")"

          # --- RECALL (FAIL): claimed paths on ADDED lines must resolve ----------
          # Net-new posture — scan only the path claims introduced/changed on
          # ADDED lines in this PR, so a pre-existing broken claim in an unrelated
          # PR is not re-flagged. If the PR did not touch the map file, the added
          # set is empty and the FAIL assertion is a clean no-op (the inverse WARN
          # still runs).
          ADDED_MAP_LINES="$(git diff --unified=0 "$BASE_SHA"..."$HEAD_SHA" -- "$MAP_FILE" \
            | awk '/^\+/ && !/^\+\+\+/ { print substr($0, 2) }' || true)"
          ADDED_CLAIMS="$(printf '%s\n' "$ADDED_MAP_LINES" | extract_location_paths | sort -u || true)"

          FAIL_REPORT=""
          FAILED=0
          if [ -n "$ADDED_CLAIMS" ]; then
            while IFS= read -r p; do
              [ -z "$p" ] && continue
              if [ ! -e "$p" ]; then
                FAILED=1
                FAIL_REPORT="${FAIL_REPORT}- \`$p\` — claimed in the map (added/changed this PR) but does not resolve on disk"$'\n'
              fi
            done <<< "$ADDED_CLAIMS"
          fi

          # --- PRECISION (WARN): on-disk governance files absent from the map ----
          # Completeness nudge over the canonical governance HOMES the map names.
          # Each home's expected governance files: if a file present on disk is not
          # mentioned anywhere in the map block, warn (never fail). Scoped to the
          # named governance dirs to avoid noise from the whole tree.
          WARN_REPORT=""
          for home in core/governance release/governance; do
            [ -d "$home" ] || continue
            for gf in "$home"/*.md; do
              [ -f "$gf" ] || continue
              base="$(basename "$gf")"
              # The map names files by basename in the Files column; treat a
              # basename mention anywhere in the block as "mapped".
              if ! printf '%s' "$MAP_BLOCK" | grep -qF "$base"; then
                WARN_REPORT="${WARN_REPORT}- \`$gf\` — present on disk under a mapped governance home but its basename is not mentioned in the map"$'\n'
              fi
            done
          done

          if [ -n "$WARN_REPORT" ]; then
            {
              echo "## :warning: Governance-file-map — on-disk files absent from the map (WARN)"
              echo ""
              echo "These governance files exist under a mapped home but are not named in the map (precision nudge — not blocking):"
              echo ""
              printf '%s' "$WARN_REPORT"
              echo ""
              echo "Add a map row/mention if the file is governance, or move it if it is not. See \`core/CLAUDE.md.template\` § Governance File Map."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning::governance-file-map: on-disk governance file(s) absent from the map (precision nudge, non-blocking)."
          fi

          if [ "$FAILED" -eq 0 ]; then
            echo ":white_check_mark: Governance-file-map — every claimed path added this PR resolves on disk" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## :x: Governance-file-map cross-check gate FAILED"
            echo ""
            echo "The \`## Governance File Map\` table claims a repo path (added or changed in this PR)"
            echo "that does not resolve on disk. A broken map path mis-routes agents to a"
            echo "non-existent location."
            echo ""
            echo "### Unresolvable claimed paths (resolved relative to the repo root):"
            echo '```'
            printf '%s' "$FAIL_REPORT"
            echo '```'
            echo ""
            echo "### Fix"
            echo ""
            echo "Correct the path in the map's Location column, or create the missing file/dir."
            echo "Paths are claimed as \`pmo-platform/<repo-relative>\` and resolve by stripping the"
            echo "\`pmo-platform/\` prefix. See \`core/CLAUDE.md.template\` § Governance File Map."
            echo ""
            echo "### Override (a deliberately-forward-looking or external claim)"
            echo ""
            echo 'Add the marker anywhere in the file:'
            echo '`<!-- repo-integrity: allow-governance-map -->`'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$WARN_MODE" = "true" ]; then
            echo "::warning::Governance-file-map gate (warn-mode initial): findings reported, not blocking. Flip WARN_MODE to 'false' to enforce after shakedown."
            exit 0
          fi
          exit 1

  # ---------------------------------------------------------------------------
  # GATE 8 — Projects/ casing canonicalization (#135). Net-new capital-`P`
  #          `Projects/` path references are stale-drift: the canonical homes are
  #          `projects/_config/` (governance) and `projects/` (Layer-2). This gate
  #          FAILs on a net-new capital-`P` `Projects/` path in agent-readable
  #          corpus. Appended AFTER the #133 governance-file-map job (this is the
  #          same-file contention resolution — #133 writes first, this job second).
  #
  #          Precision (no false-positives on the historical "Projects" concept):
  #            - NET-NEW DELTA only — pre-existing corpus `Projects/` references
  #              (prose, the legacy guard, dated changelog entries) are never
  #              re-scanned, so the gate fires only on NEW drift.
  #            - The match requires a trailing `/` (a PATH, not the prose word
  #              "Projects") and a non-identifier char before the `P` (so
  #              `myProjects/` / `subProjects/` do not match).
  #            - The `Projects/[Project]/` operator-instance schema literal is
  #              content-exempt (a stable placeholder token, never genuine drift).
  #            - The `release/releases/*` ledger surface is path-exempt (release
  #              plans/notes legitimately quote the historical path when describing
  #              the canonicalization work), mirroring the other gates' ledger
  #              exemption.
  #            - WHOLE-FILE override: a file carrying `repo-integrity:
  #              allow-projects-casing` anywhere is skipped — the named legitimate-
  #              uppercase files (core/hooks/block-destructive.sh + its test) carry
  #              this marker, per the #135 prework allowlist.
  #          Scope: changed `*.md` PLUS the two named legitimate `.sh` hook files
  #          (so the allowlisted guard is in-scope and demonstrably file-exempted).
  #          Warn-mode-initial per core/rules/bypass-mode-readiness.md.
  #
  #          Injection-safety: BASE_SHA/HEAD_SHA bound via env: and used as "$VAR".
  # ---------------------------------------------------------------------------
  projects-casing:
    name: Projects/ casing canonicalization gate
    runs-on: ubuntu-latest
    env:
      WARN_MODE: 'true'   # warn-mode initial; flip to 'false' to enforce after shakedown
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base commit for the added-lines delta

      - name: Scan added lines for net-new capital-P Projects/ path references
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Whole-file override marker (any comment form — HTML or bare).
          OVERRIDE='repo-integrity:[[:space:]]*allow-projects-casing'
          # Capital-P Projects/ as a PATH: not preceded by an identifier char or a
          # dot or a slash (so subProjects/, ../Projects not matched as a fresh
          # token), followed immediately by the canonical-drift `/`.
          CASING_RE='(^|[^A-Za-z0-9._/])Projects/'
          # The operator-instance schema literal is content-exempt.
          SCHEMA_EXEMPT='Projects/\[Project\]'

          # Scope: changed *.md PLUS the two named legitimate-uppercase hook files
          # (in-scope so the allowlist marker is demonstrably honored).
          mapfile -t ALL_CHANGED < <(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" 2>/dev/null || true)
          FILES=()
          for f in "${ALL_CHANGED[@]}"; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            case "$f" in
              release/releases/*) continue ;;  # ledger surface — exempt (mirrors the other gates)
              *.md) FILES+=("$f") ;;
              core/hooks/block-destructive.sh|core/hooks/tests/block-destructive.test.sh) FILES+=("$f") ;;
              *) : ;;  # out of scope
            esac
          done

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo ":white_check_mark: Projects/ casing — no in-scope changed files" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          FOUND=0
          REPORT=""
          for f in "${FILES[@]}"; do
            # whole-file override
            if grep -qE "$OVERRIDE" "$f"; then
              echo "::notice::repo-integrity projects-casing: $f carries allow-projects-casing — file-exempt." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # NET-NEW DELTA: only lines ADDED since the base, keyed by head-file line.
            ADDED_LINES="$(git diff --unified=0 "$BASE_SHA"..."$HEAD_SHA" -- "$f" \
              | awk '
                /^@@/ { plus = $3; sub(/^\+/, "", plus); split(plus, pc, ","); newln = pc[1] + 0; next }
                /^\+\+\+/ { next }
                /^\+/ { print newln ":" substr($0, 2); newln++ ; next }
                /^-/ { next }
              ' || true)"
            [ -z "$ADDED_LINES" ] && continue

            while IFS= read -r entry || [ -n "$entry" ]; do
              [ -z "$entry" ] && continue
              LN="${entry%%:*}"
              line="${entry#*:}"
              # capital-P Projects/ present?
              printf '%s' "$line" | grep -qE "$CASING_RE" || continue
              # content-exempt: the operator-instance schema literal
              if printf '%s' "$line" | grep -qE "$SCHEMA_EXEMPT"; then
                # exempt ONLY if every Projects/ occurrence on the line is the schema literal;
                # strip the schema literal and re-test for any remaining bare Projects/.
                residual="$(printf '%s' "$line" | sed -E 's#Projects/\[Project\][^[:space:]]*##g')"
                printf '%s' "$residual" | grep -qE "$CASING_RE" || continue
              fi
              FOUND=1
              REPORT="${REPORT}${f}:${LN}: ${line}"$'\n'
            done <<< "$ADDED_LINES"
          done

          if [ "$FOUND" -eq 0 ]; then
            echo ":white_check_mark: Projects/ casing — no net-new capital-P Projects/ path references on added lines" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## :x: Projects/ casing canonicalization gate FAILED"
            echo ""
            echo "A changed file introduces a net-new capital-\`P\` \`Projects/\` path reference."
            echo "The canonical homes are \`projects/_config/\` (governance) and \`projects/\` (Layer-2)."
            echo ""
            echo "### Net-new findings (file:line):"
            echo '```'
            printf '%s' "$REPORT"
            echo '```'
            echo ""
            echo "### Fix"
            echo ""
            echo "Use the lowercase canonical path: \`projects/_config/\` for governance files,"
            echo "\`projects/\` for Layer-2 operational content. See CLAUDE.md § Platform vs. Working Content Boundary."
            echo ""
            echo "### Exemptions (already handled)"
            echo ""
            echo "- The \`Projects/[Project]/\` operator-instance schema literal is content-exempt."
            echo "- \`release/releases/*\` ledger files are path-exempt."
            echo "- An intentional legacy-uppercase line: add \`<!-- repo-integrity: allow-projects-casing -->\` anywhere in the file."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$WARN_MODE" = "true" ]; then
            echo "::warning::Projects/ casing gate (warn-mode initial): findings reported, not blocking. Flip WARN_MODE to 'false' to enforce after shakedown."
            exit 0
          fi
          exit 1

  # ---------------------------------------------------------------------------
  # GATE 9 — ADR durability lint (#1490). The sibling of GATE 4: that gate guards
  #          ADR *identity* (one global, gap-free ADR-NNN sequence); this one guards
  #          ADR *durability*. The rules are enumerated authoritatively in the module
  #          docstring of release/tools/check-adr-durability.py — read the roster there,
  #          not from this comment. In outline:
  #            R1 STATUS-ENUM     the `status:` leading token is Proposed | Accepted |
  #                               Deprecated | Superseded (a prose tail is allowed —
  #                               the schema's leading-token rule, not a closed enum).
  #            R2 STALE-ANCHOR    a hardcoded commit SHA or a live corpus-population
  #                               count baked into durable prose. The count half matches
  #                               a CLOSED vocabulary of population nouns and is
  #                               deliberately a HIGH-PRECISION PARTIAL NET: a green run
  #                               is not evidence that no live count is present. Its
  #                               admitted shapes, its three excluded classes, and the
  #                               command to re-derive the bound are stated in the
  #                               checker's R2-COUNT RECALL BOUND docstring block.
  #            R3 OPERATOR-HANDLE the operator's literal GitHub handle. The sanctioned
  #                               ADR carve-out is NAME-scoped (the literal name on a
  #                               `deciders:` line); the HANDLE is never sanctioned, so
  #                               R3 closes the gap the line-scoped depersonalization
  #                               skip would otherwise leave open.
  #            R4 IDENT-REF       a bare issue reference in an ADR identity frontmatter
  #                               field; see the checker's R4 SCOPE block.
  #
  #          DELTA-SCOPED + WARN-MODE: scans only ADR files changed in the PR, and only
  #          lines ADDED since the base (the net-new posture the other gates use), so
  #          pre-existing corpus rot in unchanged files is never re-flagged.
  #
  #          *** ENFORCE-FLIP IS DEFERRED AND HARD-GATED — DO NOT FLIP WARN_MODE HERE ***
  #          This lint LOCKS a clean baseline; it does not create one. The ADR corpus has
  #          not yet had its full structural-conformance pass, so flipping to enforce
  #          today would red-CI the existing corpus — the exact ordering the issue's own
  #          dependency note forbids ("guarding before cleaning would red-CI the existing
  #          corpus"). The flip is a POST-CONFORMANCE shakedown step: it becomes eligible
  #          only after the ADR full-conformance pass lands a clean baseline, and then
  #          only after the standard >=3-day warn-log review per
  #          core/rules/bypass-mode-readiness.md § Shakedown -> Enforce Transition.
  #
  #          Handle resolution: `github.repository_owner` — the repo's own owner segment,
  #          which is bot-invariant (unlike github.actor) and fork-correct. The handle is
  #          NEVER hardcoded, in this workflow or in the checker.
  #
  #          Self-test runs FIRST and hard-fails INDEPENDENT of warn-mode (the CDF-2
  #          posture the governance-file-map gate uses) — a mis-parsing detector that
  #          reads green is indistinguishable from a passing one.
  #
  #          Injection-safety: BASE_SHA/HEAD_SHA/HANDLE bound via env: and used as "$VAR";
  #          no github-context expression is inlined into a run command.
  # ---------------------------------------------------------------------------
  adr-durability:
    name: ADR durability gate
    runs-on: ubuntu-latest
    env:
      WARN_MODE: 'true'   # warn-mode ONLY — the enforce-flip is hard-gated on the ADR
                          # full-conformance pass landing a clean baseline first.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base commit for the added-lines delta
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Lint changed ADRs for status-enum, stale-anchor, and operator-handle violations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HANDLE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Self-test FIRST — hard-fails regardless of WARN_MODE.
          python3 release/tools/check-adr-durability.py --self-test

          OVERRIDE='<!--[[:space:]]*repo-integrity:[[:space:]]*allow-adr-durability[[:space:]]*-->'

          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" \
            -- 'core/ADRs/ADR-*.md' 'release/ADRs/ADR-*.md' 2>/dev/null || true)
          FILES=()
          for f in "${CHANGED[@]}"; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            if grep -qE "$OVERRIDE" "$f"; then
              echo "::notice::repo-integrity adr-durability: $f carries allow-adr-durability — skipped." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            FILES+=("$f")
          done

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo ":white_check_mark: ADR durability — no changed ADR files to lint" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          set +e
          python3 release/tools/check-adr-durability.py \
            --root . --handle "$HANDLE" --diff-base "$BASE_SHA" \
            --files "${FILES[@]}" | tee /tmp/adr-durability.out
          RC=${PIPESTATUS[0]}
          set -e

          {
            echo "### ADR durability lint output"
            echo '```'
            cat /tmp/adr-durability.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # exit 3 = input failure (the ADR tree moved) — fail loud regardless of warn-mode.
          if [ "$RC" -eq 3 ]; then
            echo "::error::ADR durability lint could not resolve the ADR tree — the checker scanned nothing."
            exit 1
          fi

          if [ "$RC" -eq 0 ]; then
            echo ":white_check_mark: ADR durability — changed ADRs carry no net-new durability violation" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## ADR durability gate findings"
            echo ""
            echo "A changed ADR introduces, on an added line, one of:"
            echo ""
            echo "- **R1** a \`status:\` value whose leading token is outside \`Proposed | Accepted | Deprecated | Superseded\`."
            echo "- **R2** a hardcoded commit SHA or a live corpus-population count in durable prose."
            echo "- **R3** the operator's literal GitHub handle (the ADR carve-out covers the literal *name* on a \`deciders:\` line — never the handle)."
            echo "- **R4** a bare issue reference \`#N\` in an identity frontmatter field (\`title:\` / \`release:\` / \`deciders:\`)."
            echo ""
            echo "…or, on the structural dimension (delta-scoped, WARN-MODE):"
            echo ""
            echo "- **R5-NEW** a NET-NEW ADR that does not carry the \`adr-schema.md\` §3 body-section set."
            echo "- **R5-LOST** a CHANGED ADR that has LOST a §3 section it carried at the base."
            echo ""
            echo "See \`core/standards/adr-authoring-guide.md\` and \`core/rules/git-workflow.md\` § Repository-Integrity Gates."
            echo ""
            echo "### Fixes"
            echo ""
            echo "- **R1** — use a Nygard enum token; a prose tail after it is fine."
            echo "- **R2** — state the fact so it survives: cite the deriving command instead of a count, summarize the change instead of a SHA, or anchor the number historically (\"as of authoring, ...\")."
            echo "- **R3** — write the operator's literal name, or the operator-name token, instead of the handle."
            echo "- **R4** — name the release by its slug and the deciders by role or literal name, and move the issue reference to \`source_observations:\` or to the ADR's designated \`## References\` block with a summary noun phrase. There is no marker for this one."
            echo "- **R5** — add the exact H2 string the finding names. A section declaring a single forced approach is conformant CONTENT; an ABSENT section is the defect. Position does not matter and neither does heading count — R5 asserts presence only."
            echo ""
            echo "### Exemptions (already handled)"
            echo ""
            echo "- Fenced code blocks, the \`source_observations:\` frontmatter block, historically-anchored lines, and \`Superseded\`/\`Deprecated\` records are R2-exempt by construction."
            echo "- R4 exempts fenced renderings, \`source_observations:\` (not an identity field), and frozen records — and NOTHING else. Neither override marker suppresses it."
            echo "- A file that genuinely needs a pinned anchor: add \`<!-- adr-durability: allow-anchor -->\` (R2 only — never R3, never R4)."
            echo "- Whole-file skip: \`<!-- repo-integrity: allow-adr-durability -->\`."
            echo "- **R5 is delta-only and has an empty population on the existing corpus by construction.** It never fires on a section a record was already missing before this PR — 29 of 111 sweepable records carry a §3 gap the conformance sweep scoped OUT with a named blocking authority, and warning on those would be guarding before cleaning. \`Superseded\`/\`Deprecated\` records are exempt (they can never conform, by policy), and neither override marker suppresses R5 — structure is not durability."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$WARN_MODE" = "true" ]; then
            echo "::warning::ADR durability gate (warn-mode): findings reported, not blocking. The enforce-flip is HARD-GATED on the ADR full-conformance pass landing a clean baseline first — do not flip WARN_MODE before then."
            exit 0
          fi
          exit 1

  # ---------------------------------------------------------------------------
  # GATE 10 — SIGPIPE idiom (#3832). A writer piped into a SHORT-CIRCUITING
  #           reader is a latent false-FAIL: `grep -q`, `grep -mN` and `head`
  #           exit on their first match, the writer is still writing, its next
  #           write fails on the broken pipe, and `pipefail` promotes ITS status
  #           to the pipeline's — so a SUCCESSFUL match reports failure. Written
  #           `if ! <pipeline>`, that inverts to "no match" and the gate silently
  #           passes what it exists to catch. It is not theoretical: deploy.sh
  #           Check 31 over-reported 5x (Class L 477 vs a true 93) on this shape.
  #
  #           THE FAILING STATUS IS NOT ALWAYS 141. Which non-zero code appears
  #           is a property of the writer's SIGPIPE disposition, not of the
  #           defect: 141 where the signal is fatal (a developer shell), and 1
  #           where the shell inherited SIGPIPE as SIG_IGN — which is what a
  #           GitHub-hosted runner hands the step. On CI the signature is
  #           therefore rc=1, INDISTINGUISHABLE from grep legitimately finding
  #           nothing. Anything downstream that hunts for "141" will miss the CI
  #           case; hunt for a non-zero status on a short-circuiting pipeline.
  #
  #           FIRING CONDITIONS (measured, not assumed): pipefail + the status
  #           consumed + a MULTI-LINE haystack + an early match + >~64 KiB of
  #           residual after the matched line. Single-line does not fire at 1 MB;
  #           multi-line fires between 61 KB (rc=0) and 92 KB (rc non-zero).
  #
  #           WHY IT GATES ADDED LINES AND NOT THE TREE: #3832 converts the whole
  #           pinned population in the same PR, so there is no pre-existing corpus
  #           left for a whole-tree scan to find — and a whole-tree arm would need
  #           a file:line exemption roster on day one, which is the second,
  #           drifting roster the design avoids. Added-lines-only is also the
  #           posture 4 of the 9 gates above already use.
  #
  #           RENAME BLIND SPOT, CLOSED: a `git mv` of a file carrying a site
  #           produces no added lines under a pure delta, so a file whose status
  #           is A (added) or R (renamed) is scanned WHOLE. That is the one place
  #           this job deliberately does not copy `projects-casing` verbatim.
  #
  #           EXEMPTIONS reuse the repo's existing THREE-TIER model — no new
  #           roster, no new vocabulary:
  #             T1 content-exempt  — the idiom lies entirely inside a single-quoted
  #                                  string (a test payload / case label). Detected
  #                                  by stripping quoted spans and re-testing the
  #                                  residual, the same technique GATE 8 uses for
  #                                  its schema literal. NOT applied when the line
  #                                  hands that string to `eval` or `sh -c`, which
  #                                  EXECUTE it — there the quotes delimit a shell
  #                                  program, not an inert fixture.
  #             T2 line-scoped     — `# sigpipe-idiom: allow — <reason>` on the
  #                                  line or the line above. This is the SAME
  #                                  rationale #3832's AC-3 already requires, so
  #                                  the string a reviewer reads and the string
  #                                  this gate parses are one string.
  #             T3 file-scoped     — `repo-integrity: allow-sigpipe-idiom`
  #                                  anywhere in the file.
  #           T2 and T3 are REPORTED via the SUPPRESSED channel, never silent.
  #
  #           POSTURE: enforce day one — no WARN_MODE. The ADR-durability lint
  #           above defers its flip because it would lock a clean baseline rather
  #           than create one; this gate CREATES its baseline in the same PR, so
  #           that deferral rationale does not apply. Warn-only here would exit 0
  #           while printing findings — the exit-0-with-warnings shape this
  #           release exists to eliminate.
  #
  #           Injection-safety: BASE_SHA/HEAD_SHA bound via env: and used as "$VAR".
  # ---------------------------------------------------------------------------
  sigpipe-idiom:
    name: SIGPIPE-idiom gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base commit for the added-lines delta

      - name: Scan added shell lines for writer-into-short-circuiting-reader pipelines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # DETECT THE READER, NOT THE WRITER. The first version of this gate named
          # its writers -- `(printf|echo|cat|print)` -- while declaring itself
          # "writer-agnostic by construction". It was neither: a four-word allowlist
          # with a single-hop `[^|]*` guard, defeated twelve ways (a `find`/`git`/
          # `sed`/function producer, a `--quiet` long option, a `-mN` reader, an
          # intervening filter stage, a backslash-continued pipeline, and -- the
          # widest hole -- ANY path-qualified command, `| /usr/bin/grep -q`, which
          # is the dominant form in the largest file in scope.
          #
          # The hazard is structural: a pipe feeding a reader that closes its input
          # early. A pipe implies a writer BY CONSTRUCTION, so anchoring on the
          # reader is writer-agnostic in fact and not merely in claim, and it is
          # stage-agnostic for free -- an intervening filter is just another pipe.
          #
          # Read `[^|]\|` as "a single pipe, not the second half of `||`". Each line
          # is tested with a leading space prepended (see NORMALISED below), so that
          # guard also admits a line that BEGINS with the pipe, which is how a
          # backslash-continued pipeline breaks across lines.
          # `([^|[:space:]]*/)?` is the path prefix. `e?grep` admits `egrep`.
          #
          # A: a pipe into a grep that STOPS EARLY -- `-q`/`--quiet`/`--silent`
          #    (quiet) or `-mN`/`--max-count` (bounded). `-m` belongs here because
          #    the sanctioned `| head -N` -> `-mN` rewrite only removes the hazard
          #    when the pipeline collapses to a SINGLE command; with a producer
          #    still upstream it merely relocates it (measured: rc non-zero).
          IDIOM_Q='^[^#]*[^|]\|[[:space:]]*([^|[:space:]]*/)?e?grep[[:space:]]([^|]*[[:space:]])?(-[A-Za-z]*[qm][A-Za-z]*([[:space:]]|[0-9]|$)|--quiet|--silent|--max-count)'
          # B: a pipe into head, from ANY producer. The trailing class closes the
          #    command-substitution form `$(… | head)`, where `head` is followed by
          #    `)` rather than by whitespace or end-of-line.
          IDIOM_H='^[^#]*[^|]\|[[:space:]]*([^|[:space:]]*/)?head([[:space:]]|$|\)|;|&|`)'
          # KNOWN RESIDUAL, stated rather than left to be discovered: `^[^#]*` is the
          # trailing-comment guard, so a `#` appearing BEFORE the pipe in live code
          # (`"${#arr[@]}" | grep -q x`) suppresses detection. It fails closed --
          # a miss, never a false alarm -- and is the price of not flagging every
          # comment that discusses the idiom.
          # T2/T3 markers. Un-anchored comment form, matching GATE 8's precedent.
          LINE_MARK='sigpipe-idiom:[[:space:]]*allow'
          FILE_MARK='repo-integrity:[[:space:]]*allow-sigpipe-idiom'

          # Scope: changed shell sources. Excluded: the ledger surface, build
          # artifacts, and this workflow's own YAML (whose regexes would match
          # themselves — the self-reference trap). The exclusion is deliberately
          # narrowed to `*.yml`/`*.yaml`: a real shell script living under
          # `.github/workflows/` used to be skipped along with them, which was a
          # hole rather than a design.
          #
          # A shell script need not carry a `.sh` extension. A changed file with no
          # recognised extension is admitted when its FIRST LINE is a shell shebang
          # — the only reliable signal, and the one that closed the extensionless
          # -script hole. `read` rather than `head` so the gate does not model the
          # very idiom it forbids.
          #
          # NOTE: a `while read` loop, not `mapfile`. `mapfile` is bash 4+, which
          # makes the gate body unrunnable on a bash-3.2 developer machine — and a
          # gate that can only be exercised by a remote CI trigger can only be
          # *proved* by re-implementing it, which is the shadow-source failure the
          # deciders-carveout library was extracted to end. This form lets the
          # both-direction proof run the SHIPPED body verbatim.
          CHANGED_LIST="$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" 2>/dev/null || true)"
          FILES=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            case "$f" in
              release/releases/*|packages/*) continue ;;
              .github/workflows/*.yml|.github/workflows/*.yaml) continue ;;
            esac
            case "$f" in
              *.sh|*.bash) FILES+=("$f"); continue ;;
              *.md|*.py|*.yml|*.yaml|*.json|*.toml|*.txt|*.skill|*.sha256) continue ;;
            esac
            SHEBANG=""
            IFS= read -r SHEBANG < "$f" 2>/dev/null || true
            case "$SHEBANG" in
              '#!'*sh|'#!'*sh[[:space:]]*|'#!'*"env "[bdkz]*sh*|'#!'*bash*|'#!'*zsh*|'#!'*ksh*|'#!'*dash*)
                FILES+=("$f") ;;
              *) : ;;
            esac
          done <<<"$CHANGED_LIST"

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo ":white_check_mark: SIGPIPE idiom — no in-scope changed shell files" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          FOUND=0
          REPORT=""
          SUPPRESSED=""
          EXEMPT_CONTENT=0

          for f in "${FILES[@]}"; do
            # T3 whole-file override.
            if grep -qE "$FILE_MARK" "$f"; then
              SUPPRESSED="${SUPPRESSED}${f}: whole file (T3 repo-integrity: allow-sigpipe-idiom)"$'\n'
              continue
            fi

            # A file that is ADDED or RENAMED carries no added-line delta for its
            # pre-existing content, so scan it whole. Anything else: added lines only.
            STATUS="$(git diff --name-status "$BASE_SHA"..."$HEAD_SHA" -- "$f" | cut -f1 | head -1 || true)"
            case "$STATUS" in
              A*|R*)
                SCAN="$(awk '{ print NR ":" $0 }' "$f")"
                ;;
              *)
                SCAN="$(git diff --unified=0 "$BASE_SHA"..."$HEAD_SHA" -- "$f" \
                  | awk '
                    /^@@/ { plus = $3; sub(/^\+/, "", plus); split(plus, pc, ","); newln = pc[1] + 0; next }
                    /^\+\+\+/ { next }
                    /^\+/ { print newln ":" substr($0, 2); newln++ ; next }
                    /^-/ { next }
                  ' || true)"
                ;;
            esac
            [ -z "$SCAN" ] && continue

            while IFS= read -r entry || [ -n "$entry" ]; do
              [ -z "$entry" ] && continue
              LN="${entry%%:*}"
              line="${entry#*:}"

              # NORMALISED: a leading space, so the `[^|]\|` guard that rejects `||`
              # also admits a line that BEGINS with the pipe.
              NORMALISED=" ${line}"

              # Does either idiom appear at all?
              MATCHED=""
              grep -qE "$IDIOM_Q" <<<"$NORMALISED" && MATCHED="writer | grep -q/-mN"
              if [ -z "$MATCHED" ]; then
                grep -qE "$IDIOM_H" <<<"$NORMALISED" && MATCHED="writer | head"
              fi

              # CONTINUATION JOIN. The other half of a broken pipeline: the WRITER
              # line ends in `|` (or `\`) and the reader sits alone on this line
              # with no pipe of its own. Only consulted when this line WOULD match
              # were a pipe prepended, so the extra file read costs nothing on the
              # overwhelming majority of lines.
              if [ -z "$MATCHED" ] && [ "$LN" -gt 1 ] 2>/dev/null; then
                if grep -qE "$IDIOM_Q" <<<" | ${line}" || grep -qE "$IDIOM_H" <<<" | ${line}"; then
                  PREVJ="$(sed -n "$((LN - 1))p" "$f" 2>/dev/null || true)"
                  case "$PREVJ" in
                    *'|'|*'\') MATCHED="writer | reader (continued pipeline)" ;;
                    *) : ;;
                  esac
                fi
              fi
              [ -z "$MATCHED" ] && continue

              # T2 line-scoped marker: on this line, or on the line above it in the
              # head file (the conventional placement for a multi-line statement).
              if grep -qE "$LINE_MARK" <<<"$line"; then
                SUPPRESSED="${SUPPRESSED}${f}:${LN}: ${MATCHED} (T2, marker on line)"$'\n'
                continue
              fi
              if [ "$LN" -gt 1 ] 2>/dev/null; then
                PREV="$(sed -n "$((LN - 1))p" "$f" 2>/dev/null || true)"
                if [ -n "$PREV" ] && grep -qE "$LINE_MARK" <<<"$PREV"; then
                  SUPPRESSED="${SUPPRESSED}${f}:${LN}: ${MATCHED} (T2, marker on preceding line)"$'\n'
                  continue
                fi
              fi

              # T1 content-exempt: strip single-quoted spans and re-test. If the
              # idiom no longer matches the residual, it lived entirely inside a
              # quoted payload — a fixture string, not executed code.
              #
              # EXCEPT where the line hands that string to an evaluator. `eval '…'`
              # and `sh -c '…'` EXECUTE their quoted payload, so the single quotes
              # mark a shell program, not an inert fixture. Exempting those was the
              # one place T1's own premise did not hold.
              if grep -qE '(^|[^[:alnum:]_./-])(eval|[a-z]*sh[[:space:]]+-c)([[:space:]]|$)' <<<"$line"; then
                RESIDUAL="$line"
              else
                RESIDUAL="$(sed -E "s/'[^']*'//g" <<<"$line")"
              fi
              if ! grep -qE "$IDIOM_Q" <<<" ${RESIDUAL}" && ! grep -qE "$IDIOM_H" <<<" ${RESIDUAL}"; then
                EXEMPT_CONTENT=$((EXEMPT_CONTENT + 1))
                continue
              fi

              FOUND=1
              REPORT="${REPORT}${f}:${LN}: [${MATCHED}] ${line}"$'\n'
            done <<< "$SCAN"
          done

          if [ -n "$SUPPRESSED" ]; then
            {
              echo "### SIGPIPE idiom — suppressed (declared exemptions, reported not silent)"
              echo '```'
              printf '%s' "$SUPPRESSED"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          [ "$EXEMPT_CONTENT" -gt 0 ] && \
            echo "::notice::SIGPIPE idiom: ${EXEMPT_CONTENT} occurrence(s) content-exempt (T1 — idiom inside a quoted payload)." | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$FOUND" -eq 0 ]; then
            echo ":white_check_mark: SIGPIPE idiom — no writer-into-short-circuiting-reader pipeline on added shell lines" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## :x: SIGPIPE-idiom gate FAILED"
            echo ""
            echo "An added shell line pipes a writer into a **short-circuiting reader**"
            echo "(\`grep -q\`, \`grep -mN\` or \`head\`). Under \`pipefail\` the reader exits on"
            echo "its first match, the writer's next write fails on the broken pipe, and its"
            echo "non-zero status becomes the pipeline's — so a **successful match reports"
            echo "failure**. Written \`if ! <pipeline>\`, that inverts to \"no match\" and the"
            echo "check silently passes what it exists to catch."
            echo ""
            echo "The status is **141** where SIGPIPE is fatal and **1** where the shell"
            echo "inherited it as \`SIG_IGN\` — which is what a GitHub-hosted runner hands the"
            echo "step. On CI the signature is \`rc=1\`, indistinguishable from \"no match\"."
            echo ""
            echo "### Findings (file:line)"
            echo '```'
            printf '%s' "$REPORT"
            echo '```'
            echo ""
            echo "### Fix — read from a here-string; there is then no writer to signal"
            echo ""
            echo '```sh'
            echo "# before                                   # after"
            echo "printf '%s' \"\$hay\" | grep -q -- \"\$n\"       grep -q -- \"\$n\" <<<\"\$hay\""
            echo "grep -E p f | head -1                      grep -m1 -E p f"
            echo '```'
            echo ""
            echo "**Three substitutions are NOT semantics-preserving — check before converting:**"
            echo ""
            echo "- \`printf '%s\\n' \"\${A[@]}\"\` emits one line per element; \`<<<\"\${A[@]}\"\`"
            echo "  space-joins them onto ONE line, breaking any \`^\`-anchored match."
            echo "- \`grep -o … | head -1\` is NOT \`grep -m1 -o\` — \`-m\` counts matching LINES,"
            echo "  not matches, so every match on the first line survives."
            echo "- \`grep A | grep -v B | head -1\` folds only into the LAST grep. Folding into"
            echo "  the first discards the line the filter would have kept."
            echo "- \`| head -N\` -> \`-mN\` only REMOVES the hazard when the pipeline collapses"
            echo "  to a single command. With a producer still upstream, \`producer | grep -mN\`"
            echo "  short-circuits exactly as \`| head\` did — the hazard moved, it did not go."
            echo "- An empty haystack: \`printf '%s' \"\"\` emits ZERO lines, \`<<<\"\"\` emits ONE"
            echo "  empty line. If the needle can match an empty line, guard with \`[ -n \"\$v\" ]\`."
            echo ""
            echo "### Exemptions"
            echo ""
            echo "- Keeping the form deliberately: add \`# sigpipe-idiom: allow — <one-line reason>\`"
            echo "  on the line or the line above. It is reported in the SUPPRESSED block, never silent."
            echo "- Whole file: \`# repo-integrity: allow-sigpipe-idiom\`."
            echo "- The idiom inside a single-quoted payload string is content-exempt automatically."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          exit 1
