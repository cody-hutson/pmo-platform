name: Skill package content-freshness (pre-merge gate)

# gate-efficacy: posture=required(warn-mode-initial)  enforcement=branch-protection:"Pre-merge .skill package content-freshness gate"  always-reports=yes
#   invariant: every rostered skill's compiled .skill package reflects current source
#              content (the committed package == what source would build now) — asserted
#              PRE-MERGE so a PR that edits a skill's SKILL.md or references/ cannot
#              merge green while its .skill package is stale (the v3.35 defect: 9 skills
#              edited, 0 packages rebuilt, 28/28 CI SUCCESS — the stale state was caught
#              only at Stage-13 close-out, not by CI). Mirrors deploy.sh Check 7 (which
#              ran only at deploy time) into a pre-merge status check per Req (b').
#   falsification: edit a skills/*/SKILL.md (or references/) without rebuilding the
#                  .skill package -> the probe reports STALE and exits 2 (warn-mode:
#                  job green with a ::warning:: annotation) or 1 (enforce: job red).
#                  It never exits 0 on STALE. Rebuild via build-skill-packages.sh
#                  and commit the package + .sha256 sidecar -> FRESH, exit 0, green.
#                  Second arm, on the OTHER input vector: edit a TEMPLATE_SYNC_MAP
#                  canonical that lives outside any skills tree (e.g.
#                  core/standards/output-format.md) without rebuilding the packages it
#                  injects into -> the probe likewise reports STALE. Asserted by PF-6 in
#                  core/deploy/tests/test_package_freshness_exit_codes.sh, with PF-7 as
#                  its restore-and-pass control.
#
# NO PATH FILTER, BY DESIGN. The verdict this gate publishes is the whole-roster Check-7
# content hash — a global property of every rostered package, not a property of the files
# a given PR happened to touch. A `paths:` roster is only ever an APPROXIMATION of that
# verdict's real input surface, and the moment it under-approximates, skip-semantics turn
# the miss into a false statement: GitHub creates no check run at all, absence reads as a
# pass, and a partial check is reported as a full one. A roster authored as a COST control
# then silently functions as a CORRECTNESS control, which is the defect this file used to
# carry.
#
# The input surface such a roster would have to over-approximate spans FIVE heterogeneous
# classes: (1) the three skills trees (core/, operations/, release/); (2) every
# TEMPLATE_SYNC_MAP canonical, resolved through core/deploy/lib-template-sync-source.sh,
# which homes canonicals into core/standards/, operations/templates/ AND core/schemas/;
# (3) that resolver file itself, whose case arms decide which canonical is injected;
# (4) core/deploy/deploy.sh, where the map and the staging path live; and (5) the packager
# under release/skills/pmo-skill-refiner/scripts/. The roster this file used to carry
# covered class (1) and a subset of class (4) — classes (2), (3) and (5) were never in it,
# and every new resolver arm widened the gap without anyone noticing.
#
# THE FAILURE THIS CLOSES IS NOT HYPOTHETICAL. A pull request whose only changes were to
# an injected canonical outside the skills trees staled three committed .skill packages and
# merged green with this gate never having run — the injected-canonical vector, invisible
# precisely because a non-matching path filter produces no check run to read.
#
# always-reports=yes is ALSO A PREREQUISITE for the enforce flip, not a nicety: a required
# status check that is path-filtered leaves every non-matching PR permanently pending
# ("Expected — waiting for status"), so the graduation path stated below is broken by
# construction for as long as a filter exists. Ships warn-mode-initial. Check 7's
# non-reproducible-archive false-positive class is CLOSED, so mirroring the content-hash
# verdict into CI does not yield false-positive failures. Flips when the committed
# .github/skill-package-freshness.enforce token -> `enforce` AND the job is added to
# required_status_checks (branch protection, out-of-tree — R3).
# (Per core/standards/gate-efficacy-standard.md (b)/(b'); warn-mode-initial per
# core/rules/git-workflow.md § Repository-Integrity Gates.)
#
# THIN caller of the single engine. --check-package-freshness runs Check 7's FULL
# rostered-skill content-hash verdict via the shared _c7_compute_verdict "gate" body —
# NO per-skill diff-scoping logic lives here, and with the trigger filter removed there is
# no scoping of any kind left in this file (satisfying "no parallel logic"; a stale package
# for ANY skill correctly blocks). NO predicate is re-encoded in this YAML (single-engine,
# CIAC-2).
#
# Platform: macos-latest — the content-hash verdict needs python3 + unzip (both on the
# macOS image) and deploy.sh uses BSD `stat -f`/`md5` (mirrors version-freeness.yml).
#
# Security: consumes NO untrusted github.event.* input. Every run: block is a static
# invocation; the RC handoff uses the env-var pattern (no ${{ }} inside a run: block).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skill-package-freshness:
    name: Pre-merge .skill package content-freshness gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify prerequisites
        run: |
          set -euo pipefail
          uname -s
          command -v bash
          command -v git
          command -v unzip || echo "::warning::unzip missing — Check 7 degrades to the mtime signal"
          test -x /usr/bin/python3 || echo "::warning::/usr/bin/python3 missing — the staged-rebuild content verdict degrades"

      - name: Run package-freshness check (single check, via the deploy.sh engine)
        id: check
        # THIN caller. The probe reads .github/skill-package-freshness.enforce itself:
        # warn maps STALE to exit 2 (advisory), enforce to exit 1 (blocking); an
        # unexpected verdict fail-closes to 1. The probe never exits 0 on STALE.
        run: |
          set -uo pipefail
          set +e
          OUT="$(bash core/deploy/deploy.sh --check-package-freshness 2>&1)"; RC=$?
          set -e
          printf '%s\n' "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Gate decision (warn-mode-initial)
        env:
          RC: ${{ steps.check.outputs.rc }}
        run: |
          set -euo pipefail
          case "$RC" in
            0)
              echo ":white_check_mark: package-freshness: every rostered skill package is content-fresh" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            2)
              {
                echo "## :warning: skill package-freshness reported STALE (warn mode — not blocking)"
                echo ""
                echo "A rostered skill's SKILL.md or references/ changed without rebuilding its .skill package."
                echo "Rebuild via core/deploy/tools/build-skill-packages.sh <skill> and commit the package + .sha256 sidecar."
                echo "This is ADVISORY while .github/skill-package-freshness.enforce holds a non-enforce token."
              } | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::warning::package-freshness: stale .skill package reported in WARN mode — not blocking (flip the enforce sentinel token to block)"
              exit 0
              ;;
            *)
              {
                echo "## :x: skill package-freshness gate FAILED (enforce mode) or fail-closed"
                echo ""
                echo "A rostered skill's .skill package is stale with the enforce sentinel active,"
                echo "OR the verdict was unexpected (fail-closed). Probe exit code: $RC."
                echo "Rebuild via core/deploy/tools/build-skill-packages.sh <skill> and commit the package + .sha256 sidecar before merge."
              } | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
