name: Release-corpus completeness (pre-merge Stage-13 corpus gate)

# gate-efficacy: posture=required(warn-mode-initial)  enforcement=path-filtered  skip-semantics=absent-is-pass
#   invariant: every RELEASE_LOG row at/after the corpus cutover implies its matching
#              RELEASE_INDEX row + RELEASE_DIGEST entry + RELEASE_NOTES file (+ signed
#              tag + published Release for post-Release-cutover rows) — asserted
#              PRE-MERGE so the highest-frequency documented release failure (closing a
#              release with only the RELEASE_LOG row, the INDEX/DIGEST/NOTES silently
#              missing) is caught at the merge gate, not just at deploy time on the
#              operator machine (a Requirement (b') violation the deploy-time-only
#              Check 32 could not close). This is the SINGLE canonical required-context
#              for Check 32 (the required-subset runner EXCLUDES Check 32 — no
#              double-gating, R6).
#   falsification: a RELEASE_LOG row present with its INDEX row / DIGEST entry / NOTES
#                  file absent -> this gate reports INCOMPLETE and exits NON-ZERO under
#                  EVERY sentinel value (warn: advisory exit 2, reported not blocking;
#                  enforce: blocking exit 1). Delete release/releases/RELEASE_LOG.md, or
#                  strip Version/State from its header -> SKIP, exit 3 under warn and
#                  exit 1 under enforce — NEVER 0, because an unread ledger is not a
#                  clean one. A complete output-set for every in-scope row -> CLEAN, the
#                  SOLE producer of exit 0.
# Path-filtered to release/releases/**, so ADVISORY by skip-semantics: absence on an
# unrelated PR MUST NOT block. Ships warn-mode-initial (reports, does not block) — the
# ledger currently carries pre-existing corpus findings that must be drained/allowlisted
# before enforce. Flips when the committed .github/release-corpus-completeness.enforce
# token -> `enforce` AND the job is added to required_status_checks (branch protection,
# out-of-tree — R3).
#
# GRADUATION CLAUSE — THE FLIP ALSO REQUIRES DELETING THE paths: FILTER BELOW, and
# that third step is not optional. A path-filtered context registered in branch
# protection leaves every non-matching PR permanently PENDING, so the two steps above
# cannot by themselves deliver the enforcement this header declares: always-reports is
# a PREREQUISITE of a required posture, not a later optimization. Stated here because
# a graduation clause naming only the sentinel and the registration is incomplete, and
# whoever performs the flip reads this clause rather than the standard.
# (Per core/standards/gate-efficacy-standard.md § Verdict-Input Closure.)
#
# VIC CLOSURE BASIS — this filter IS a legitimate cost control, and that is a
# MEASUREMENT rather than an assumption. Check 32's _c32_compute_verdict reads
# RELEASE_LOG.md, RELEASE_INDEX.md, RELEASE_DIGEST.md and release/releases/notes/ —
# all four under release/releases/**, already rostered — plus the deploy.sh engine and
# the .enforce sentinel, both rostered. Its remaining inputs (`gh release view`, git
# tags) are NETWORK state, which no paths: filter can carry by construction. The
# residual verdict-input set outside this roster is therefore EMPTY: unlike its
# siblings this gate needs no roster widening, which is why its disposition is
# declaration-only. That is a point-in-time closure and it comes with an obligation:
# ANY widening of Check 32's input set obliges a matching roster widening in the SAME
# COMMIT, or this closure basis becomes a false statement.
# (Per core/standards/gate-efficacy-standard.md (b)/(b'); warn-mode-initial per
# core/rules/git-workflow.md § Repository-Integrity Gates.)
#
# THIN caller of the single engine. --check-release-corpus runs ONLY Check 32's shared
# _c32_compute_verdict "gate" body and honors the .enforce sentinel internally, returning
# 0 CLEAN / 2 INCOMPLETE-advisory / 3 SKIP-advisory (NOT-EVALUATED) / 1 blocking-or-
# fail-closed. The caller dispatches on that integer and NEVER re-reads the sentinel: the
# engine has already applied it, so codes 2 and 3 can only exist under a non-enforce
# sentinel. NO predicate is re-encoded in this YAML (single-engine, CIAC-2).
#
# Platform: macos-latest — mirrors version-freeness.yml + deploy-check-ci.yml.
#
# Security: consumes NO untrusted github.event.* input. Every run: block is a static
# invocation; the RC handoff uses the env-var pattern (no ${{ }} inside a run: block).

on:
  pull_request:
    paths:
      - 'release/releases/**'
      - 'core/deploy/deploy.sh'
      - '.github/workflows/release-corpus-completeness.yml'
      - '.github/release-corpus-completeness.enforce'
  push:
    branches: [main]
    paths:
      - 'release/releases/RELEASE_LOG.md'
      - 'release/releases/RELEASE_INDEX.md'
      - 'release/releases/RELEASE_DIGEST.md'

permissions:
  contents: read

jobs:
  release-corpus-completeness:
    name: Pre-merge release-corpus completeness gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uname -s
          command -v bash
          command -v git
          command -v gh || echo "::warning::gh not on PATH — the post-cutover published-Release sub-check degrades (dormant default is unaffected)"

      - name: Run release-corpus check (single check, via the deploy.sh engine)
        id: check
        # THIN caller. The probe reads .github/release-corpus-completeness.enforce
        # itself and returns 0 CLEAN / 2 INCOMPLETE-advisory / 3 SKIP-advisory /
        # 1 blocking-or-fail-closed. Nothing here re-reads the sentinel.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # DO NOT REMOVE `set +e`. A NON-ZERO exit is now the ORDINARY outcome of this
          # probe — the live ledger verdicts INCOMPLETE, which is advisory exit 2 — so
          # without `set +e` this step fails before the Gate decision step ever evaluates,
          # and the job goes red for a reason the summary never states. It reads like
          # defensive boilerplate and is load-bearing.
          set +e
          OUT="$(bash core/deploy/deploy.sh --check-release-corpus 2>&1)"; RC=$?
          set -e
          printf '%s\n' "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Gate decision (warn-mode-initial)
        env:
          RC: ${{ steps.check.outputs.rc }}
        run: |
          set -euo pipefail
          case "$RC" in
            0)
              # 0 IS CLEAN'S ALONE, under every sentinel state (PV-7, enforced by the engine's
              # _c32_verdict_exit_code and asserted by self-test RC-9c, whose control arm RC-9d
              # proves that assertion can fail). Before #7193 this code was shared with SKIP and
              # with INCOMPLETE under the shipped `warn` sentinel, which made the line below a
              # false completeness claim on the ORDINARY invocation — the engine verdicted
              # INCOMPLETE 4 230 and exited 0. The claim is true only because nothing else can
              # produce this code; do not add a branch that reaches it.
              echo ":white_check_mark: release-corpus: every in-scope release has its INDEX + DIGEST + NOTES" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            2)
              {
                echo "## :warning: release-corpus completeness reported an ADVISORY FINDING (measured)"
                echo ""
                echo "A RELEASE_LOG row at/after the corpus cutover is missing its INDEX row / DIGEST"
                echo "entry / NOTES file (or its post-cutover tag / published Release). The gate"
                echo "**measured** the corpus and found it incomplete; the enforce sentinel is not"
                echo "active, so this is reported rather than blocking."
                echo ""
                echo "**This is not a pass.** Exit 2 is the advisory-finding code — distinct from 0"
                echo "(clean), from 3 (nothing measured) and from 1 (blocking). The remedy is to"
                echo "**backfill the missing output(s)** per"
                echo "release/references/pipeline/stage-13-close.md Phase B — never to waive the"
                echo "finding. The findings and the denominator are named in the probe output above."
              } | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::warning::release-corpus: INCOMPLETE — a measured finding, reported not blocking; never read exit 2 as clean"
              exit 0
              ;;
            3)
              {
                echo "## :grey_question: release-corpus completeness was NOT-EVALUATED (not a clean result)"
                echo ""
                echo "release/releases/RELEASE_LOG.md was **absent, or its header was unparseable**, so"
                echo "ZERO rows were enumerated and this run certifies **nothing** about corpus"
                echo "completeness. **It is NOT a pass** — and its remedy differs from an advisory"
                echo "finding: restore or repair the ledger, rather than backfill the corpus."
                echo ""
                echo "That file is tracked, so on an ordinary checkout this state means the pull"
                echo "request removed it or broke its Version/State header — fixable in the pull request."
                echo ""
                echo "Exit 3 is reachable only while the enforce sentinel holds a non-enforce token."
                echo "Under enforce the same verdict exits 1 and this job is RED."
              } | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::warning::release-corpus: NOT-EVALUATED — the ledger was absent or unparseable; a withheld verdict, never a clean one"
              exit 0
              ;;
            *)
              {
                echo "## :x: release-corpus completeness gate FAILED (enforce mode) or fail-closed"
                echo ""
                echo "One of three things happened:"
                echo "  (a) a RELEASE_LOG row is missing its INDEX row / DIGEST entry / NOTES file"
                echo "      (or post-cutover tag / Release) with the enforce sentinel active;"
                echo "  (b) the ledger was absent or unparseable with the enforce sentinel active"
                echo "      (NOT-EVALUATED — a withheld verdict, never a clean one); or"
                echo "  (c) the verdict was unexpected (fail-closed)."
                echo "Probe exit code: $RC."
                echo ""
                echo "Remedy for (a): backfill the missing output(s) per"
                echo "release/references/pipeline/stage-13-close.md Phase B before merge."
                echo "Remedy for (b): restore or repair release/releases/RELEASE_LOG.md — do not merge"
                echo "on an unmeasured gate."
              } | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
