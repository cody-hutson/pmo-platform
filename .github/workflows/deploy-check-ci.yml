name: Deploy-check required subset (pre-merge load-bearing gate)

# gate-efficacy: posture=required(warn-mode-initial)  enforcement=branch-protection:"Pre-merge load-bearing check subset"  always-reports=yes
#   invariant: every load-bearing deploy.sh --check member in the enumerated
#              required-subset (network-free AND install-independent AND
#              posture:required AND lacking a dedicated CI mirror) holds pre-merge —
#              asserted as a blocking status check BEFORE the change lands, closing
#              the gap that the whole --check battery ran only at deploy time
#              (operator machine, post-merge) and was therefore skippable. Today the
#              subset resolves to FOUR members: Check 38
#              (hook-registry-index-freshness), Check 73
#              (bundle-metrics-gate-integrity), Check 77 (mirror-pair-parity) and
#              Check 78 (rules-budget);
#              it grows as posture:required checks
#              lacking a mirror are back-filled (#1036 / #313). Check 73 is the
#              first back-fill against that declaration — #313 is the milestone
#              named above as this runner's back-fill vehicle, so the roster grew
#              through the mechanism it declared rather than around it. Check 77 is
#              the second, and it is why this gate matters for its own subject: the
#              mirror-pair desync it asserts against escaped both the post-merge
#              check surface AND PR review, so a deploy-time-only assertion would
#              not have closed it. Check 78 is the third, admitted for a reason
#              specific to what it bounds: the deployed rules set it measures is
#              PRODUCED at deploy time, so a check that could only observe the
#              installed mirror would certify the per-session context cost only
#              after that cost had already been paid.
#              THE ROSTER IS DECLARED ONCE, in the `rs_checks` array in
#              core/deploy/deploy.sh (cmd_check_required_subset). This enumeration
#              and the .github/deploy-check-ci.enforce sentinel's both RESTATE it,
#              and both have drifted behind it before: the release that admitted
#              Check 77 swept both restatements, the one that admitted Check 78 did
#              not, and the count here read THREE against a four-member roster until
#              it was corrected. A member added to rs_checks owes an edit here and
#              in the sentinel; neither is derived, so neither updates itself.
#   falsification: edit a per-hook source (e.g. add a rule row) under
#                  core/rules/bypass-mode-readiness/ without regenerating the index
#                  -> this gate reports STALE (warn-mode: summary + exit 0; enforce:
#                  red + exit 1). A fresh index -> green. Independently, mutate
#                  _g3_14_compute_verdict's floor comparison from `>=` to `>` (or
#                  _g3_15_compute_verdict's band comparison from `<=` to `<`) ->
#                  Check 73 reports FAIL on the at-threshold fixture; restore ->
#                  PASS. That opposite-verdict pair on one unchanged fixture is the
#                  whole discrimination claim for the new member.
# NO PATH FILTER, BY DESIGN — and for this gate the reason is TEMPORAL, which is what
# separates it from its three path-filtered siblings.
#
# A paths: roster is only ever an approximation of a verdict's real input surface, and
# under skip-semantics=absent-is-pass an under-approximation turns the miss into a
# false statement. Measured at conversion time, this gate's roster did NOT
# under-approximate: the sole subset member then was Check 38, whose only engine
# dependency is build-hook-registry.py, and both the sources and the generated index sat
# inside the roster. Verdict-Input Closure HELD on that day. The gap is that it cannot be
# relied on to keep holding: the subset is declared to GROW as posture:required checks
# lacking a mirror are back-filled, and the roster's own annotation said it grows with
# it. Two rosters obliged to widen together with NOTHING binding them is the exact
# mechanism the injected-canonical precedent recorded — every new arm widening the gap
# without anyone noticing. A roster bound to a roster designed to grow reproduces the
# defect on a delay, so binding was rejected and the filter deleted instead. Adding a
# subset member now costs nothing and can silently cost nothing.
#
# THAT PREDICTION HAS NOW BEEN EXERCISED, AND THE DELETED FILTER IS WHY IT COST
# NOTHING. Check 73 (bundle-metrics-gate-integrity) joined the subset, and its verdict
# inputs are a set NO roster written for Check 38 would have contained: the two
# committed fixture pairs under core/deploy/tests/fixtures/bundle-metrics/, the verdict
# bodies in core/deploy/deploy.sh, the sink declarations in
# core/schemas/gate-criteria-spec.md, core/config/platform-config.toml.template, and
# the round-half-up definitional home in
# release/references/standards/bundle-composition-doctrine.md. Under the old filter this
# gate would have reported nothing on a PR touching only the doctrine or the config
# template, while still claiming to assert a predicate that reads both. No filter, no
# gap — which is the whole reason this workflow carries none.
#
# ALWAYS-REPORTS IS A PREREQUISITE OF THE DECLARED FLIP, NOT A COST DECISION.
# This gate declares posture=required and its graduation clause names
# required_status_checks. A path-filtered context registered in branch protection
# leaves every NON-matching pull request permanently PENDING, so the declared
# enforcement was unreachable while the filter existed — the surface could not deliver
# what the header claimed. Removing the filter is part of the flip.
#
# COST, STATED NOT HIDDEN: this adds an unconditional macOS job — billed at 10x — to
# every pull request, to run a single regenerate-and-diff. That was an operator call,
# taken explicitly, on the ground that a workflow declaring itself required owes
# always-reports before it owes runner minutes.
#
# Ships warn-mode-initial (reports, does not block) until the operator flips the
# committed .github/deploy-check-ci.enforce sentinel token to `enforce` AND adds this
# job to required_status_checks (branch protection — the out-of-tree enforcement
# surface, R3). Those two steps are now the WHOLE flip; the third is already done.
# (Per core/standards/gate-efficacy-standard.md (b)/(b') and § Verdict-Input Closure;
# warn-mode-initial per core/rules/git-workflow.md § Repository-Integrity Gates.)
#
# THIN caller of the single engine. --check-required-subset runs each subset
# member's shared _cNN_compute_verdict "gate" body and aggregates the verdict;
# NO check predicate is re-encoded in this YAML (single-engine discipline, CIAC-2).
# The runner reads the .enforce sentinel itself, so warn-mode swallows an in-scope
# FAIL into exit 0 (reported, non-blocking); enforce propagates exit 1.
#
# Platform: macos-latest — deploy.sh uses BSD `stat -f`/`md5` and resolves tools at
# the macOS image locations (mirrors version-freeness.yml + release-tooling-smoke.yml).
#
# Security: consumes NO untrusted github.event.* input. Every run: block is a static
# invocation against workspace files; the RC handoff between steps uses the env-var
# pattern (no ${{ }} interpolation inside a run: block).

on:
  # NO paths: key on EITHER event — deliberate, not an omission. See the NO PATH
  # FILTER, BY DESIGN paragraph above: the subset this gate runs is declared to GROW,
  # so any roster enumerating "the surfaces the current members assert" is correct only
  # until the next member lands. The event/types shape below is the tree's established
  # filter-free form (link-check.yml, skill-package-freshness.yml,
  # skill-registry-currency-check.yml), so this workflow now always reports a result.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-check-required-subset:
    name: Pre-merge load-bearing check subset
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify prerequisites
        run: |
          set -euo pipefail
          uname -s
          command -v bash
          command -v git
          # THREE of the four members shell out to /usr/bin/python3 by absolute path
          # (Check 38's build-hook-registry.py, Check 77's check-mirror-pair-parity.py,
          # Check 78's check-rules-budget.py). Naming only one understated the blast
          # radius of an image without it; Check 73 is the sole pure-bash member.
          test -x /usr/bin/python3 || echo "::warning::/usr/bin/python3 missing — the subset's Check 38, Check 77 and Check 78 members will fail-closed"

      - name: Run required-subset (via the deploy.sh engine)
        id: check
        # THIN caller of the single engine. The runner honors the committed
        # .github/deploy-check-ci.enforce sentinel internally: warn swallows an
        # in-scope FAIL into exit 0 (reported), enforce propagates exit 1; an
        # ERROR/unexpected verdict always fail-closes (exit 1) regardless of sentinel.
        run: |
          set -uo pipefail
          set +e
          OUT="$(bash core/deploy/deploy.sh --check-required-subset 2>&1)"; RC=$?
          set -e
          printf '%s\n' "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Gate decision (warn-mode-initial)
        env:
          RC: ${{ steps.check.outputs.rc }}
        run: |
          set -euo pipefail
          if [ "$RC" -eq 0 ]; then
            echo ":white_check_mark: required-subset: all load-bearing checks passed (or a finding was reported in warn-mode)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## :x: required-subset gate FAILED (enforce mode) or fail-closed"
            echo ""
            echo "A load-bearing check in the enumerated subset FAILed with the enforce sentinel active,"
            echo "OR a member returned an unexpected/ERROR verdict (fail-closed). See the check output above."
            echo "Regenerate/repair the flagged surface before merge."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
