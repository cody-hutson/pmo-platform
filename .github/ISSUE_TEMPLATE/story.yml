name: User Story
description: File a User Story — a user/operator-facing value increment under a resolved methodology.
# Pack-projected kind form — renders the `story` kind a resolved methodology pack declares in its kinds[]
# (source pack: core/packs/scrum/pack.toml; the optional Story points field mirrors the kind's
# fields.kind_specific declaration). The labels array realizes the pack's projects_kind-joined
# `type:story` row (applied_at: Intake) structurally at submission. A deployment whose resolved
# methodology declares different kinds supplies its own kind forms per the kind-derivation contract in
# operations/skills/intake-desk/references/type-map.md.
# Template selection by work-item type: see release/references/how-to/intake-style-guide.md §1b.
# Title = an informative summary (no type/category prefix — the label carries type). See release/references/how-to/intake-style-guide.md §7.
title: ""
labels: ["type:story", "status: proposed"]
body:
  - type: textarea
    id: value
    attributes:
      label: Value
      description: Who benefits and why — the user/operator-facing value this story delivers. A story with no namable beneficiary is not a story.
      placeholder: "As <role>, I need <capability> so that <benefit>. (Any framing works — the beneficiary + benefit are the required content, not the sentence shape.)"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: |
        One testable predicate per bullet — verifiable by a fresh agent without clarifying questions.
        Start each bullet with a verifiable verb (verify/check/confirm/assert/ensure/validate) OR name a
        specific file/section/output AND a specific observable state.
      placeholder: |
        - [ ] Verify that <output/behavior> shows <observable state> (method: <how>)
    validations:
      required: true

  - type: input
    id: story-points
    attributes:
      label: Story points
      description: Optional — the resolved pack's relative-estimate field (declared in the pack's kinds[] as story_points).
      placeholder: "5"
    validations:
      required: false

  - type: input
    id: parent
    attributes:
      label: Parent epic
      description: Optional — the containing epic as a #N reference (BELONGS_TO placement; the tracker's native sub-issue link carries the relationship).
      placeholder: "#N"
    validations:
      required: false

  - type: textarea
    id: documentation-impact
    attributes:
      label: Documentation Impact
      description: |
        REQUIRED. Declare the documentation this story touches.
        Two acceptable forms:

        (a) **Pointer list** — one bullet per affected doc: `file path | action (link / create / update / retire) | brief reason`.
        The action is one of those four words exactly: a qualifier goes in the reason, and a row whose action depends on a condition is resolved at Stage 5, rewritten to the chosen action or removed.
        Pointers are directional at Intake (file-path level minimum); refined at Stage 5 in the File Change Matrix.
        `retire` withdraws a document by the method the G-CL8 row states: a document that carries the platform-doc `status`
        field moves to DEPRECATED (or SUPERSEDED, naming its successor) and stays in place; one without that field is
        deleted. Either way, every inbound reference is re-pointed in the same change, to the successor where there is one
        and otherwise removed, so no live document still names the retired item.

        (b) **Explicit "None"** — write exactly: `None — no documentation impact (rationale: <one phrase>)`.
        The rationale phrase is mandatory; bare `None` fails the Stage 13 Close gate (G-CL8).

        **Scope:** defined once, in the G-CL8 row of `core/schemas/gate-criteria-spec.md` (Gate 13); this form does not restate it.
      placeholder: |
        docs/<guide>.md | update | the step this work changes
        docs/<old-guide>.md | retire | replaced by docs/<new-guide>.md

        — OR —

        None — no documentation impact (rationale: <one phrase>)
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional — evidence labels, related items, links.
    validations:
      required: false
