name: Architecture Decision Record
description: Record an architecture or design decision
title: "[ADR]: "
labels: ["adr", "status: proposed"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: confirm this decision warrants an ADR and follow the canonical authoring conventions. See the **[ADR authoring guide](https://github.com/cody-hutson/pmo-platform/blob/main/core/standards/adr-authoring-guide.md)** — the when-to-write / when-NOT rubric, the copy-paste ADR template + worked example, and the supersede-not-edit immutability policy. The field + body-section data contract lives in [`core/schemas/adr-schema.md`](https://github.com/cody-hutson/pmo-platform/blob/main/core/schemas/adr-schema.md).
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: "ADR lifecycle status. Proposed = under discussion, Accepted = binding, Deprecated = no longer relevant, Superseded = replaced by a newer ADR."
      options:
        - Proposed
        - Accepted
        - Deprecated
        - Superseded
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is the issue that motivates this decision?
      placeholder: Describe the problem, question, or forcing function that requires a decision.
    validations:
      required: true

  - type: textarea
    id: decision-drivers
    attributes:
      label: Decision Drivers
      description: What constraints or goals shape the choice?
      placeholder: "List the forces at play — technical constraints, business goals, timeline pressure, dependencies."
    validations:
      required: true

  - type: textarea
    id: considered-options
    attributes:
      label: Considered Options
      description: "Required — content conditional (adr-schema.md §3.1): this field is always answered, but what it says depends on the decision. List each option evaluated with pros and cons; if a single forced approach existed, say so instead — that is a valid, conformant answer."
      placeholder: |
        **Option 1: [Name]**
        - Pro: ...
        - Con: ...

        **Option 2: [Name]**
        - Pro: ...
        - Con: ...

        — or, where no options were weighed —
        Single forced approach; no viable alternative was weighed.
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Decision
      description: Which option was chosen and why?
      placeholder: "We chose Option N because..."
    validations:
      required: true

  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: What follows from this decision — both positive and negative?
      placeholder: |
        **Easier:** ...
        **Harder:** ...
    validations:
      required: true

  - type: input
    id: related-issues
    attributes:
      label: Related Issues
      description: "Release issues, improvement issues, or prior ADRs this decision serves. Use #N references."
      placeholder: "#N, #M"
    validations:
      required: true
