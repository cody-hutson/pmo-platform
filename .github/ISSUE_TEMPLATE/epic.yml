name: Epic
description: File an Epic — a grouping container for a large body of work decomposed into child items, under a resolved methodology.
# Pack-projected kind form — renders the `epic` kind a resolved methodology pack declares in its kinds[]
# (source pack: core/packs/scrum/pack.toml). The labels array realizes the pack's projects_kind-joined
# `type:epic` row (applied_at: Intake) structurally at submission. A deployment whose resolved methodology
# declares different kinds supplies its own kind forms per the kind-derivation contract in
# operations/skills/intake-desk/references/type-map.md.
# Template selection by work-item type: see release/references/how-to/intake-style-guide.md §1b.
# Title = an informative summary (no type/category prefix — the label carries type). See release/references/how-to/intake-style-guide.md §7.
title: ""
labels: ["type:epic", "status: proposed"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: The capability outcome this epic delivers — WHAT is true when it is done, stated observably. Not the mechanism.
      placeholder: "AFTER — an operator can <capability>. TODAY — <the gap>."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The boundary — what is IN and what is explicitly OUT.
      placeholder: |
        In: ...
        Out: ...
    validations:
      required: true

  - type: textarea
    id: children
    attributes:
      label: Candidate child items
      description: Optional. Known candidate child items as a decomposition callout for later slicing — children are sliced later, never auto-created at intake.
      placeholder: |
        - <candidate child item>
        - <candidate child item>
    validations:
      required: false

  - type: textarea
    id: documentation-impact
    attributes:
      label: Documentation Impact
      description: |
        REQUIRED. Declare the documentation this epic's work touches.
        Two acceptable forms:

        (a) **Pointer list** — one bullet per affected doc: `file path | action (link / create / update / retire) | brief reason`.
        Pointers are directional at Intake (file-path level minimum); each child item declares its own when it is filed.
        `retire` withdraws a document by the method the G-CL8 row states: a document that carries the platform-doc `status`
        field moves to DEPRECATED (or SUPERSEDED, naming its successor) and stays in place; one without that field is
        deleted. Either way, every inbound reference is re-pointed in the same change, to the successor where there is one
        and otherwise removed, so no live document still names the retired item.

        (b) **Explicit "None"** — write exactly: `None — no documentation impact (rationale: <one phrase>)`.
        The rationale phrase is mandatory; bare `None` fails the Stage 13 Close gate (G-CL8).

        **Scope:** defined once, in the G-CL8 row of `core/schemas/gate-criteria-spec.md` (Gate 13); this form does not restate it.
      placeholder: |
        docs/<guide>.md | update | the step this work changes
        docs/<old-guide>.md | retire | replaced by docs/<new-guide>.md

        — OR —

        None — no documentation impact (rationale: <one phrase>)
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional — evidence labels, related items, links.
    validations:
      required: false
