name: Bug Report
description: Report a bug or broken behavior — the finding is "X is broken" rather than "we should add/change X".
# Template selection by work-item type (bug / improvement / observation / adr): see release/references/how-to/intake-style-guide.md §1b.
# Title = an informative summary (no type/category prefix — the label carries type). See release/references/how-to/intake-style-guide.md §7.
title: ""
labels: ["bug", "status: proposed"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: "P1 = blocks work; P2 = material friction; P3 = annoyance; P4 = cosmetic"
      options:
        - P1 - Blocker
        - P2 - Material
        - P3 - Annoyance
        - P4 - Cosmetic
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      description: Numbered steps a fresh Claude Code agent can follow to reproduce. Include exact commands, files, or inputs.
      placeholder: |
        1. Run `./deploy.sh --deploy`
        2. Observe that it fails when no packages changed
        3. Error: `CHANGED_PACKAGES: unbound variable`
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What happens instead. Include error messages verbatim where applicable.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where this was observed (branch, commit SHA, OS, relevant tool versions).
      placeholder: "main @ abc1234, macOS 14.1, bash 5.2"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Evidence is admissible in EITHER of two shapes — use either, or both.
        (a) Evidence-label form — label every factual claim. Use [SOURCE] for citations,
        [INFERRED] for deductions, [ASSUMPTION – CONFIRM] for unverified claims, [CONTEXT] for background.
        (b) Probe-record form — if you measured something (how often it reproduces, over what
        population), report the measurement: at least two of Probe: / Denominator: / Control: /
        Sensitivity: / Specificity: / Verdict:, each as a label. No bracket labels needed.
        Both shapes are read from THIS section only. See release/references/how-to/intake-style-guide.md §8.
      placeholder: |
        [SOURCE: ./deploy.sh L42] — the CHANGED_PACKAGES var is assigned only inside the if-block.
        Probe: re-ran the deploy on a clean checkout, 20 times. Denominator: 20 runs. Control — specificity: the same runs with the flag unset reproduced 0 times. Verdict: reproduces 20/20 when armed.
    validations:
      required: true

  - type: textarea
    id: affected-files
    attributes:
      label: Affected Files
      description: |
        Files where the fix will land (directional OK).
        Scope-altitude check — look back at Expected Behavior before you submit:
        every behavior named there must be producible from a file listed here, and
        this list must resolve to ONE determinate set. If you are offering
        alternative fix directions, say which one the acceptance criteria assume.
        A markdown file can produce an agent-executed outcome ("the stage verifies X");
        it cannot produce a machine-executed one ("CI fails") — that needs a workflow,
        script, or hook. See `release/references/how-to/intake-style-guide.md` §4c.
    validations:
      required: true

  - type: textarea
    id: documentation-impact
    attributes:
      label: Documentation Impact
      description: |
        REQUIRED. Declare the documentation this fix touches.
        Two acceptable forms:

        (a) **Pointer list** — one bullet per affected doc: `file path | action (link / create / update / retire) | brief reason`.
        The action is one of those four words exactly: a qualifier goes in the reason, and a row whose action depends on a condition is resolved at Stage 5, rewritten to the chosen action or removed.
        `retire` withdraws a document by the method the G-CL8 row states: a document that carries the platform-doc `status`
        field moves to DEPRECATED (or SUPERSEDED, naming its successor) and stays in place; one without that field is
        deleted. Either way, every inbound reference is re-pointed in the same change, to the successor where there is one
        and otherwise removed, so no live document still names the retired item.

        (b) **Explicit "None"** — write exactly: `None — no documentation impact (rationale: <one phrase>)`.
        The rationale phrase is mandatory; bare `None` fails the Stage 13 Close gate (G-CL8).

        **Scope:** defined once, in the G-CL8 row of `core/schemas/gate-criteria-spec.md` (Gate 13); this form does not restate it. A bug fix in a documented behavior IS a doc-impact.
      placeholder: |
        operations/skills/<skill>/SKILL.md | update | fix changes output schema documented in §Output Format

        — OR —

        None — no documentation impact (rationale: internal bash regex correction; behavior unchanged)
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: 'How to verify the fix worked. Typically: "reproduction steps no longer trigger actual behavior; expected behavior observed."'
      placeholder: |
        - [ ] Running reproduction steps produces expected behavior, not actual behavior
        - [ ] Regression test exists that fails against the buggy code and passes after fix
    validations:
      required: true
