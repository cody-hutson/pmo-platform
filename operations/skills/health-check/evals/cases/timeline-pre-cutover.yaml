# Case: timeline mode against the pre-cutover fixture
case_id: timeline-pre-cutover
mode: timeline
fixture: fixtures/pre-cutover.md
judge: judges/timeline.md
prompt: "/health-check timeline --scope Synthetic-Cutover"
expected_section_membership:
  Auto-Actionable:
    - "Go-Live date April 2 -> April 9 (Jira + Smartsheet agree, more recent) [confidence: HIGH · S2]"
  tracker_updates_block: required
  Decisions:
    - "Day-of-week mismatch: 'Thursday April 2' but April 2 is a Wednesday [confidence: HIGH · S2]"
day_of_week_validation: required          # the wrong-weekday finding MUST fire
no_generalized_dates: required            # no "week of ..." in the body
must_not_flag:
  - "any correctly-dated item"
pass_rule: "Date drifts categorized correctly, the weekday mismatch flagged, no generalized range emitted."
