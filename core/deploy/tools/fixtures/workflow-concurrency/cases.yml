# Fixture cases for core/deploy/tools/check-workflow-concurrency.py --self-test and --case.
# Not a workflow: the host reads only files directly under .github/workflows/.
# One YAML document per fixture, separated by `---`. Each opens with
#   # case: <id>  expect=<exit>  codes=<finding codes, or ->  kind=<near-miss|other>
# The documents of one id are evaluated together as one population. A `near-miss`
# document is the `canonical` document with exactly ONE property changed, which the
# self-test asserts (one diff hunk). The tag-only, schedule-only, workflow_call and
# review-event cases are synthetic: no such workflow exists in the tree.
---
# case: canonical  expect=0  codes=-  kind=other
name: Fixture canonical

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Superseded-run cancellation: on a pull request, a newer run of this
# workflow for the same pull request (a new push, or a re-run on the same
# head) cancels this one. Any other event (a push to main, a tag, a
# schedule, a dispatch) keys on its own run id, so it is never cancelled
# and never waits behind another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Fixture check
    runs-on: ubuntu-latest
    steps:
      - run: echo fixture
---
