# roster-fixture.yaml — POPULATED de-identified eval fixture (TRACKED — committable)
#
# This is a FIXTURE, not an operator-instance roster. It carries de-identified
# TEST people (synthetic person_ids + placeholder preferred names) so the
# consumption eval can resolve a known name/owner/coverage answer against it.
#
# WHY THIS NAME (not people-roster.yaml): the `.gitignore` rule `**/people-roster.yaml`
# (with the `!**/people-roster-template.yaml` carve-out) ignores any file named
# people-roster.yaml so a filled operator roster can never be committed. A fixture
# named people-roster.yaml would be silently un-committable. This file is named
# roster-fixture.yaml precisely so it IS tracked; `git check-ignore` does not match it.
#
# It conforms to the SHIPPED schema (operations/templates/people-roster-template.yaml):
# only allow-list fields appear; capability is TAGS not ratings; provenance-bearing
# fields carry {value, source, last_verified}; status is the tombstone enum. No
# EXCLUDED (shadow-HR) field appears. All names are synthetic placeholders.
#
# The composed people-coverage-graph view (core/disciplines/people-coverage-graph.md)
# joins this roster's functional attributes with the FROZEN Person identity and the
# FROZEN Resource allocation on `person_id`. The fixture supplies the roster leg and
# an inline `_fixture_person_entity` / `_fixture_resource_allocations` block standing
# in for the two frozen entities — so the runner can exercise all three view queries
# (who-does-what / who-covers-whom / coverage-by-capability) self-contained, without
# a live Person/Resource store. The `_fixture_*` keys are NOT roster schema fields;
# they are eval-harness scaffolding and are ignored by any real roster consumer.

