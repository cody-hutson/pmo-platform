# core/packs/_common/pack.toml
# Shared methodology-pack BASE (role = "base"). Carries archetype-INVARIANT
# contributions only. Best-practice defaults (K1 / Layer-3); a deployment SELECTS a
# pack via operator config and MAY override per project (K4). No operator-specific
# values. Archetype packs declare `extends = "_common"` and carry ONLY their deltas.
# NOTE: no work-status MACHINE — the Axis-1 base machine is owned by the entity layer
# (ADR-018 D1); kinds inherit it via `axis1_state_machine = "inherit"`. The archetype-
# INVARIANT work-status LABEL PROJECTION over that machine IS carried here (see the
# Work-status block below): ADR-070 D3 homes the shared base projection in this pack,
# and archetype packs carry only their sub-state deltas. Machine vs. projection is the
# whole distinction — a pack PROJECTS LABELS OVER the base, it never re-founds it.
# No `kinds` — a role = "base" pack is non-kind-bearing (widened §1.1 / ADR-070 D4).

[meta]
pack_id = "_common"
pack_version = "0.1.0"          # semver; §6.1 additive-minor rule
schema_version = 1              # MANIFEST meta key (operator.toml/platform-config.toml precedent) — NOT the meta-schema grammar version
applies_to = "*"                # role = "base" MUST be "*" (methodology-neutral; no Layer-2 join — §1.1)
role = "base"                   # widened §1.1 (ADR-070 D1): non-kind-bearing shared base

# Universal label GROUP contributions. The label GROUPS + RULES grammar is owned by
# label-taxonomy.md; a pack only CONTRIBUTES instances into a grammar-owned group
# (ADR-018 D1 "project labels over the base"; widened §1.1.1 / ADR-070 D2). These are the
# archetype-INVARIANT rows (the ~80% shared surface) the label-cleave slice relocated out
# of label-taxonomy.md into this base. Colors are lifted verbatim from the pre-cleave doc
# rows. `group` ∈ {category|status|work-status|cluster|initiative|triage-flag|disposition}
# (grammar-owned; listed in label-taxonomy.md's own section order).

# --- Category (archetype-invariant content-classification rows; the two-tier intake model
#     per label-taxonomy.md § Category Labels). `type:*` kind labels are per-archetype
#     DELTAS and live in the archetype packs, not here.
[[labels]]
group = "category"
name = "improvement"
color = "0E8A16"
description = "General/umbrella for platform improvement when no specific category fits (Triage fallback; not template-auto-applied)"
applied_at = "Triage (Stage 2) — fallback only"

