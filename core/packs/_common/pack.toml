# --- Work-status (one per work item; the archetype-INVARIANT Axis-1 delivery-lifecycle
#     projection — the shared base projection ADR-070 D3 homes in this base pack, which
#     is why these rows live here and not in an archetype pack. Values are the entity-
#     layer Axis-1 enum VERBATIM (entity-field-schemas.md §3.18 V-WI-04): a label
#     projection OVER that machine, never a re-founding of it (work-item-type-schema.md
#     §1.1). The `work-status: ` name prefix is deliberately DISJOINT from `status: `:
#     the GitHub label namespace is flat, the two axes share the `in-progress` and
#     `done` tokens, and the status-label invariant check matches on the NAME PREFIX
#     rather than on this `group` field — so a row named `status: <x>` here would trip
#     the one-status-label mutex release-wide. See label-taxonomy.md § Work-Status
#     Labels + § Rules 8. No `blocked` row: blocked-ness is a derived condition of an
#     unsatisfied BLOCKS / DEPENDS_ON edge, not an Axis-1 state.
[[labels]]
group = "work-status"
name = "work-status: backlog"
color = "E6E6E6"
description = "Delivery Axis-1: identified, not yet refined for pull"

[[labels]]
group = "work-status"
name = "work-status: ready"
color = "C2E0C6"
description = "Delivery Axis-1: refined and pullable"

[[labels]]
group = "work-status"
name = "work-status: in-progress"
color = "FEF2C0"
description = "Delivery Axis-1: actively being worked"

[[labels]]
group = "work-status"
name = "work-status: in-review"
color = "BFD4F2"
description = "Delivery Axis-1: work complete, under review"

[[labels]]
group = "work-status"
name = "work-status: done"
color = "0E8A16"
description = "Delivery Axis-1: accepted complete (terminal)"

[[labels]]
group = "work-status"
name = "work-status: cancelled"
color = "D93F0B"
description = "Delivery Axis-1: abandoned without completion (terminal)"

