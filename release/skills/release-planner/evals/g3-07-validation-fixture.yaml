        target: 1002
    expected_verdict: PASS
    notes: "Both in v2.00-canonical-baseline — same-milestone edge passes by definition"

  - label: neg-forward
    edges:
      - source: 1003
        target: 1004
    expected_verdict: PASS
    notes: "Source v2.10 (pos 10) >= target v2.00 (pos 1) — forward-direction edge passes"

  - label: neg-resolved
    edges:
      - source: 1005
        target: 1006
    expected_verdict: PASS
    expected_annotations: ["[RESOLVED]"]
    notes: "Target Done in closed milestone — edge annotated [RESOLVED], not a violation"

  - label: neg-equal-pos
    edges:
      - source: 1007
        target: 1008
    expected_verdict: PASS
    notes: "Source 1007 in v2.05a-parallel-track-a (position: 5) and target 1008 in v2.05b-parallel-track-b (position: 5) — distinct milestones, equal position via shared `position:` override. Per Milestone-Position Resolution algorithm position-equivalence-class rule (gate-criteria-spec.md line 239): edges between members of the same position-class PASS trivially (same-milestone treatment). This case exercises the OVERRIDE-branch equal-position rule, distinct from neg-same-milestone (which is the literally-same-milestone trivial case). v1.1."

