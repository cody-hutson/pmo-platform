# Bundle-level rollup assertions (Stage 7 DT A5)
#
# v1.1: each rollup carries `expected_section_present: true|false` for the
# Cross-Milestone Dependency Validation section emission assertion. true = bundle has ≥1
# dep edge → section emits with status line (and violation table / exception list / positive-
# signal counted body per status). false = bundle has zero dep edges → section suppressed.
# Backward-compat: legacy Stage 7 DT harnesses that ignore `expected_section_present` still
# run verdict-only assertions correctly.
bundle_rollups:
  - label: all-positives-rollup
    test_cases: [pos-15-14, pos-27-20, pos-184-179, pos-188-45, pos-593-518, pos-594-518, pos-595-518, pos-600-121]
    expected_status: "FAIL (8 unresolved)"
    expected_section_present: true  # ≥1 dep edge (all 8 cross-milestone violations) → section emits with violation table
  - label: all-exception-rollup
    test_cases: [exc-15-14, exc-188-45]
    expected_status: "PASS-WITH-EXCEPTIONS (2)"
    expected_section_present: true  # ≥1 dep edge (2 exception-registered cross-milestone) → section emits with registered-exception list
  - label: all-negative-rollup
    test_cases: [neg-same-milestone, neg-forward, neg-resolved, neg-equal-pos]
    expected_status: "PASS"
    expected_section_present: true  # ≥1 dep edge (4 PASS edges incl. position-equivalence-class) → section emits with counted positive-signal body

  # v1.1 emission-presence rollups (AC1/AC3) — exercise the always-emit boundary harmonized with the File Contention Map empty-state pattern.
  - label: pos-sig-same-ms-only
    test_cases: [neg-same-milestone]
    expected_status: "PASS — 1 dependency edge(s) checked, 0 cross-milestone violations"
    expected_section_present: true
    notes: "AC1: bundle of ≥2 issues (1001 + 1002, both in v2.00-canonical-baseline) with all same-milestone dep edges, zero cross-milestone edges. Section emits with counted positive-signal body — explicit signal that the gate ran. Analogous to the File Contention Map `No file contention detected` empty-state."

  - label: pos-sig-no-deps
    test_cases: []  # No edges to assert; rollup exists to verify section SUPPRESSION when bundle has zero dep edges.
    expected_status: "(section suppressed — no dep edges to check)"
    expected_section_present: false
    notes: "AC3: hypothetical bundle of ≥2 issues with zero dependency edges in any direction → G3-07 section suppressed entirely (no check possible). Mirrors File Contention Map behavior on 1-issue bundles where contention is impossible. No edges fixture-resident; Stage 7 DT asserts the SUPPRESSION condition by inspection of the always-emit rule's preconditions."
