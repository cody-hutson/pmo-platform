# G3-07 Validation Fixture — mocked milestone state at Phase D audit baseline
#
# Source: ADR-2 and its evidence section.
# [SOURCE: 2026-04-18 Skills Mini-Project Phase D]
#
# Encodes a MOCKED milestone-state-as-at-2026-04-18, NOT live GitHub state. This makes
# the fixture reproducible regardless of subsequent reorg activity. Use with Stage 7 DT
# eval harness to validate release-planner Mode A Step 4.5 + Mode B Step 5b G3-07 check.
#
# Schema:
#   milestones: list of {title, position, due_on, state, description_blocks}
#   issues: list of {number, milestone, state, status, dependencies}
#   test_cases: list of {label, edges, expected_verdict, expected_annotations}
#   bundle_rollups: list of {label, test_cases, expected_status, expected_section_present} [expected_section_present field added in v1.1]
#
# Versioning:
#   v1.0 — initial cut (per ADR-2).
#   v1.1:
#     - Adds `expected_section_present: true|false` field on bundle_rollups (backward-compat: missing field = legacy verdict-only assertion).
#     - Adds 2 bundle_rollups (`pos-sig-same-ms-only`, `pos-sig-no-deps`) exercising the always-emit emission boundary.
#     - Adds 2 milestones (`v2.05a-parallel-track-a`, `v2.05b-parallel-track-b`) sharing `position: 5` override (synthetic test data, not live workspace state).
#     - Adds 2 synthetic issues (1007, 1008) — extends the existing fixture-internal series.
#     - Repurposes `neg-equal-pos` to reference the equal-position cross-milestone pair (distinct milestones, equal position via shared `position:` override); replaces the prior duplicate-of-`neg-same-milestone` form.

